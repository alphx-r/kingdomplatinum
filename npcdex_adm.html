<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPCdex ADM — Kingdom Platinum</title>
<link rel="icon" type="image/x-icon" href="https://64.media.tumblr.com/c429cb57b048b0ba1d90c6451d7c3aa1/8607b48e6654212e-0d/s540x810/c1f9956cc78935a32f53346f3a7a942caa5d1d67.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1a3a5c;--brand-mid:#2563a8;
  --accent:#e8a020;
  --deep:#050c18;--panel:#0c1a2c;--panel2:#0f2138;
  --cyan:#3fe8ff;--cyan-dim:rgba(63,232,255,.35);
  --magenta:#ff3fa0;--magenta-dim:rgba(255,63,160,.3);
  --line:rgba(63,232,255,.14);
  --ink:#cfe4f5;--ink-dim:#7b93ad;
  --green:#5fd45f;--red:#ff6b5b;
  --font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif;--font-mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%}
body{min-height:100vh;font-family:var(--font-body);color:var(--ink)}
html{
  background-image:
    radial-gradient(ellipse 900px 500px at 8% -5%, rgba(63,232,255,.10), transparent 60%),
    radial-gradient(ellipse 700px 600px at 100% 30%, rgba(255,63,160,.08), transparent 60%),
    repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 42px);
  background-color:var(--deep);
  background-attachment:fixed;
}

/* ══ NAV ══ */
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:58px;background:var(--brand);position:sticky;top:0;z-index:9000;border-bottom:1px solid rgba(63,232,255,.18);box-shadow:0 1px 24px rgba(0,0,0,.35)}
.nav-logo img{height:35px;object-fit:contain}
.nav-title{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--magenta);letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.nav-title .dot{width:6px;height:6px;border-radius:50%;background:var(--magenta);box-shadow:0 0 8px 2px var(--magenta-dim);animation:pulse-dot 1.8s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.nav-back{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);text-decoration:none;padding:7px 14px;border-radius:20px;transition:all .2s}
.nav-back:hover{background:rgba(255,255,255,.12);color:#fff}

/* ══ LOGIN GATE ══ */
.gate{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--cyan-dim);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.gate-icon{font-size:32px;margin-bottom:10px}
.gate-title{font-family:var(--font-title);font-size:18px;font-weight:700;color:#fff;margin-bottom:4px}
.gate-sub{font-size:11px;color:var(--ink-dim);font-family:var(--font-mono);letter-spacing:.5px;margin-bottom:20px}
.gate-input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--font-body);font-size:14px;color:#fff;background:var(--panel);outline:none;margin-bottom:10px}
.gate-input:focus{border-color:var(--cyan)}
.gate-err{color:var(--red);font-size:11px;margin-bottom:10px;display:none}
.gate-btn{width:100%;padding:11px;border:none;border-radius:8px;background:var(--cyan);color:#03121c;font-family:var(--font-body);font-size:13px;font-weight:800;cursor:pointer}

/* ══ SHELL ══ */
.shell{display:none;max-width:1080px;margin:0 auto;padding:28px 24px 70px}
.shell.open{display:block}
.shell-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.shell-title{font-family:var(--font-title);font-size:26px;font-weight:900;color:#fff;letter-spacing:1px}
.shell-title span{color:var(--cyan)}
.shell-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:10px 16px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--cyan-dim)}
.btn-primary{background:rgba(63,232,255,.1);border-color:var(--cyan-dim);color:var(--cyan)}
.btn-primary:hover{background:rgba(63,232,255,.18)}
.btn-danger{background:rgba(255,107,91,.08);border-color:rgba(255,107,91,.35);color:var(--red)}
.btn-danger:hover{background:rgba(255,107,91,.16)}
.btn-ghost{background:transparent;color:var(--ink-dim)}
.btn-sm{padding:6px 11px;font-size:10px}

/* ══ FILTER ROW ══ */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search-input,.sel-input{background:var(--panel2);border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;font-family:var(--font-body);font-size:13px;color:#fff;outline:none}
.search-input{flex:1;min-width:180px}
.search-input:focus,.sel-input:focus{border-color:var(--cyan)}
.stat-pill{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;padding:0 6px}

/* ══ TABLE ══ */
.tbl-wrap{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-dim);padding:12px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(63,232,255,.04)}
.row-inativo td{opacity:.42}
.cell-npc{display:flex;align-items:center;gap:10px}
.cell-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel);flex-shrink:0}
.cell-photo-ph{width:34px;height:34px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.cell-name{font-weight:700;color:#fff}
.cell-slug{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim)}
.tag{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.tbl-actions{display:flex;gap:6px;flex-wrap:wrap}
.empty-row td{text-align:center;padding:50px 20px;color:var(--ink-dim);font-family:var(--font-mono);font-size:13px}

/* ══ MODAL ══ */
.modal-overlay{position:fixed;inset:0;background:rgba(2,6,14,.72);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--panel2);border:1.5px solid var(--cyan-dim);border-radius:14px;padding:26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-title{font-family:var(--font-title);font-size:16px;font-weight:700;color:#fff;margin-bottom:16px;text-align:center}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:10px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-family:var(--font-mono)}
.modal-field input,.modal-field select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;font-family:var(--font-body);font-size:13px;color:#fff;background:var(--panel);outline:none}
.modal-field input:focus,.modal-field select:focus{border-color:var(--cyan)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-err{color:var(--magenta);font-size:11px;margin-top:8px;text-align:center;display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1.5px solid var(--cyan-dim);color:#fff;padding:10px 20px;border-radius:30px;font-size:12px;font-family:var(--font-mono);z-index:10000;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}

@media(max-width:640px){
  .tbl th:nth-child(4),.tbl td:nth-child(4){display:none}
  .shell{padding:20px 14px 60px}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="https://kingdomplatinum.vercel.app"><img src="https://64.media.tumblr.com/bb526b9df0c7703d60a3e491a3f2ecf6/25947a08ea9632bf-74/s1280x1920/cff7702dac61e7830b197041196e3f7da571140b.pnj" alt="Kingdom Platinum"></a>
  <div class="nav-title"><span class="dot"></span> NPCdex · Admin</div>
  <a class="nav-back" href="/npcdex">← Voltar ao NPCdex</a>
</nav>

<!-- GATE: senha -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-icon">🔒</div>
    <div class="gate-title">Acesso restrito</div>
    <div class="gate-sub">Painel administrativo do NPCdex</div>
    <input class="gate-input" type="password" id="gate-senha" placeholder="Senha" onkeydown="if(event.key==='Enter')confirmarGate()">
    <div class="gate-err" id="gate-err">Senha incorreta.</div>
    <button class="gate-btn" onclick="confirmarGate()">Entrar</button>
  </div>
</div>

<!-- SHELL: painel -->
<div class="shell" id="shell">
  <div class="shell-head">
    <div class="shell-title">NPCdex <span>ADM</span></div>
    <div class="shell-actions">
      <button class="btn btn-primary" onclick="abrirModalNovo()">+ Novo NPC</button>
      <button class="btn btn-ghost" onclick="sairAdm()">Sair</button>
    </div>
  </div>

  <div class="filter-row">
    <input class="search-input" id="busca" placeholder="Buscar por nome ou slug..." oninput="renderTabela()">
    <select class="sel-input" id="filtro-categoria" onchange="renderTabela()">
      <option value="">Todas as categorias</option>
      <option value="gymleader">GYM Leader</option>
      <option value="elitefour">Elite Four</option>
      <option value="liga">Campeão / Liga</option>
      <option value="househost">House Host</option>
      <option value="stationchief">Station Chief</option>
      <option value="vilao">Vilão</option>
      <option value="aliado">Aliado</option>
      <option value="comum">NPC Comum</option>
    </select>
    <select class="sel-input" id="filtro-status" onchange="renderTabela()">
      <option value="">Ativos e inativos</option>
      <option value="ativo">Só ativos</option>
      <option value="inativo">Só inativos</option>
    </select>
    <div class="stat-pill" id="stat-pill"></div>
  </div>

  <div class="tbl-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>NPC</th>
          <th>Categoria</th>
          <th>Cargo</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbl-body">
        <tr class="empty-row"><td colspan="5">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- MODAL: novo NPC -->
<div class="modal-overlay" id="modal-novo" onclick="if(event.target===this)fecharModalNovo()">
  <div class="modal-box">
    <div class="modal-title">Novo NPC</div>
    <div class="modal-field">
      <label>Nome</label>
      <input id="novo-nome" placeholder="Ex: Ariel Costa" oninput="sugerirSlug()">
    </div>
    <div class="modal-field">
      <label>Slug (URL)</label>
      <input id="novo-slug" placeholder="ex: ariel-costa">
    </div>
    <div class="modal-field">
      <label>Categoria</label>
      <select id="novo-categoria">
        <option value="gymleader">GYM Leader</option>
        <option value="elitefour">Elite Four</option>
        <option value="liga">Campeão / Liga</option>
        <option value="househost">House Host</option>
        <option value="stationchief">Station Chief</option>
        <option value="vilao">Vilão</option>
        <option value="aliado">Aliado</option>
        <option value="comum" selected>NPC Comum</option>
      </select>
    </div>
    <div class="modal-err" id="novo-err"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="fecharModalNovo()">Cancelar</button>
      <button class="btn btn-primary" id="novo-confirmar" onclick="criarNpc()">Criar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://fatdzivyqipmcbzaiftc.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhdGR6aXZ5cWlwbWNiemFpZnRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTMyNDAsImV4cCI6MjA5ODQyOTI0MH0.0SRPZt1RYSpEbPQazv7ttHJBZNDOyIax2YRO49bvpmE';

// ── ATENÇÃO: precisa ser IDÊNTICA à senha em npcdex.html e npc_ficha.html
const ADMIN_PASSWORD='trocaessasenha';
const ADMIN_KEY='kp_npcdex_admin';
const isAdmin=()=>localStorage.getItem(ADMIN_KEY)==='1';

async function api(path,opts={}){
  const isGet=!opts.method||opts.method==='GET';
  let res;
  try{
    res=await fetch(`${SUPA_URL}/rest/v1/${path}`,{
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Content-Type':'application/json','Prefer':'return=representation',...(isGet?{'Range':'0-9999'}:{}),...opts.headers},
      ...opts
    });
  }catch(e){
    throw new Error('Falha de rede/conexão com o Supabase: '+e.message);
  }
  if(res.status===204||opts.method==='DELETE')return[];
  const t=await res.text();
  let parsed;
  try{parsed=JSON.parse(t);}catch{parsed=null;}
  if(!res.ok){
    const msg=(parsed&&(parsed.message||parsed.error||parsed.hint))||`HTTP ${res.status}`;
    throw new Error(msg);
  }
  return parsed??[];
}
const apiGet=(p,q='')=>api(`${p}?${q}`);
const apiPost=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
const apiPatch=(p,q,b)=>api(`${p}?${q}`,{method:'PATCH',body:JSON.stringify(b)});
const apiDel=(p,q)=>api(`${p}?${q}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});

const CAT_LABEL={gymleader:'GYM Leader',elitefour:'Elite Four',liga:'Campeão / Liga',househost:'House Host',stationchief:'Station Chief',vilao:'Vilão',aliado:'Aliado',comum:'NPC Comum'};
const CAT_ICON={gymleader:'🥋',elitefour:'👑',liga:'🏆',househost:'🏠',stationchief:'🚉',vilao:'💀',aliado:'🤝',comum:'👤'};
const CAT_COLOR={
  gymleader:{bg:'rgba(63,232,255,.1)',fg:'var(--cyan)',bd:'var(--cyan-dim)'},
  elitefour:{bg:'rgba(255,63,160,.1)',fg:'var(--magenta)',bd:'var(--magenta-dim)'},
  liga:{bg:'rgba(232,160,32,.12)',fg:'var(--accent)',bd:'rgba(232,160,32,.35)'},
  househost:{bg:'rgba(200,140,60,.14)',fg:'#e0a868',bd:'rgba(200,140,60,.4)'},
  stationchief:{bg:'rgba(90,150,220,.14)',fg:'#7ab0ee',bd:'rgba(90,150,220,.4)'},
  vilao:{bg:'rgba(192,57,43,.14)',fg:'#ff6b5b',bd:'rgba(192,57,43,.4)'},
  aliado:{bg:'rgba(42,122,42,.14)',fg:'#5fd45f',bd:'rgba(42,122,42,.4)'},
  comum:{bg:'rgba(123,147,173,.1)',fg:'var(--ink-dim)',bd:'rgba(123,147,173,.3)'},
};

let todosNpcs=[];

// ── Toast ──
let _toastT=null;
function toast(msg,cor='var(--cyan)'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.borderColor=cor;el.style.display='block';
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>el.style.display='none',2200);
}

// ── Gate ──
function confirmarGate(){
  const v=document.getElementById('gate-senha').value;
  if(v===ADMIN_PASSWORD){
    localStorage.setItem(ADMIN_KEY,'1');
    entrarShell();
  } else {
    document.getElementById('gate-err').style.display='block';
  }
}
function sairAdm(){
  localStorage.removeItem(ADMIN_KEY);
  document.getElementById('shell').classList.remove('open');
  document.getElementById('gate').style.display='flex';
  document.getElementById('gate-senha').value='';
}
function entrarShell(){
  document.getElementById('gate').style.display='none';
  document.getElementById('shell').classList.add('open');
  carregarNpcs();
}

// ── Carregar / renderizar tabela ──
async function carregarNpcs(){
  document.getElementById('tbl-body').innerHTML='<tr class="empty-row"><td colspan="5">Carregando...</td></tr>';
  try{
    todosNpcs=await apiGet('npcs','order=ordem.asc,nome.asc')||[];
  }catch(e){
    document.getElementById('tbl-body').innerHTML=`<tr class="empty-row"><td colspan="5" style="color:var(--red)">Erro ao carregar: ${e.message}</td></tr>`;
    todosNpcs=[];
    return;
  }
  renderTabela();
}

function renderTabela(){
  const q=(document.getElementById('busca').value||'').toLowerCase().trim();
  const cat=document.getElementById('filtro-categoria').value;
  const status=document.getElementById('filtro-status').value;
  let lista=todosNpcs.slice();
  if(q) lista=lista.filter(n=>(n.nome||'').toLowerCase().includes(q)||(n.slug||'').toLowerCase().includes(q));
  if(cat) lista=lista.filter(n=>(n.categoria||'comum')===cat);
  if(status==='ativo') lista=lista.filter(n=>n.ativo!==false);
  if(status==='inativo') lista=lista.filter(n=>n.ativo===false);

  document.getElementById('stat-pill').textContent=`${lista.length} de ${todosNpcs.length} NPC(s)`;

  const tbody=document.getElementById('tbl-body');
  if(!lista.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="5">Nenhum NPC encontrado.</td></tr>';
    return;
  }
  tbody.innerHTML=lista.map(n=>{
    const catInfo=CAT_COLOR[n.categoria]||CAT_COLOR.comum;
    const catLabel=CAT_LABEL[n.categoria]||'NPC Comum';
    const catIcon=CAT_ICON[n.categoria]||'👤';
    const inativo=n.ativo===false;
    const foto=n.foto?`<img class="cell-photo" src="${n.foto}" onerror="this.style.display='none'">`:`<div class="cell-photo-ph">${catIcon}</div>`;
    return `<tr class="${inativo?'row-inativo':''}">
      <td><div class="cell-npc">${foto}<div><div class="cell-name">${n.nome||'(sem nome)'}</div><div class="cell-slug">/${n.slug}</div></div></div></td>
      <td><span class="tag" style="background:${catInfo.bg};color:${catInfo.fg};border:1px solid ${catInfo.bd}">${catIcon} ${catLabel}</span></td>
      <td>${n.cargo||'—'}</td>
      <td><span class="tag" style="background:${inativo?'rgba(255,107,91,.1)':'rgba(95,212,95,.1)'};color:${inativo?'var(--red)':'var(--green)'};border:1px solid ${inativo?'rgba(255,107,91,.35)':'rgba(95,212,95,.35)'}">${inativo?'Inativo':'Ativo'}</span></td>
      <td><div class="tbl-actions">
        <a class="btn btn-sm" href="/npcdex/${encodeURIComponent(n.slug)}">✏️ Editar</a>
        <button class="btn btn-sm" onclick="toggleAtivo('${n.id}',${inativo})">${inativo?'Ativar':'Desativar'}</button>
        <button class="btn btn-sm btn-danger" onclick="excluirNpc('${n.id}','${(n.nome||'').replace(/'/g,"\\'")}')">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
}

async function toggleAtivo(id,tornarAtivo){
  try{
    await apiPatch('npcs',`id=eq.${id}`,{ativo:tornarAtivo});
    const n=todosNpcs.find(x=>String(x.id)===String(id));
    if(n) n.ativo=tornarAtivo;
    renderTabela();
    toast(tornarAtivo?'NPC ativado':'NPC desativado');
  }catch(e){
    toast('Erro: '+e.message,'var(--red)');
  }
}

async function excluirNpc(id,nome){
  if(!confirm(`Tem certeza que quer excluir "${nome}"? Essa ação não pode ser desfeita.`))return;
  try{
    await apiDel('npcs',`id=eq.${id}`);
    todosNpcs=todosNpcs.filter(x=>String(x.id)!==String(id));
    renderTabela();
    toast('NPC excluído');
  }catch(e){
    toast('Erro ao excluir: '+e.message,'var(--red)');
  }
}

// ── Novo NPC ──
function slugify(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function sugerirSlug(){
  const slugEl=document.getElementById('novo-slug');
  if(!slugEl.dataset.touched) slugEl.value=slugify(document.getElementById('novo-nome').value);
}
function abrirModalNovo(){
  document.getElementById('novo-nome').value='';
  document.getElementById('novo-slug').value='';
  document.getElementById('novo-slug').dataset.touched='';
  document.getElementById('novo-categoria').value='comum';
  document.getElementById('novo-err').style.display='none';
  document.getElementById('modal-novo').classList.add('open');
  setTimeout(()=>document.getElementById('novo-nome').focus(),50);
}
function fecharModalNovo(){document.getElementById('modal-novo').classList.remove('open');}

document.getElementById('novo-slug').addEventListener('input',function(){this.dataset.touched='1';});

async function criarNpc(){
  const nome=document.getElementById('novo-nome').value.trim();
  const slug=slugify(document.getElementById('novo-slug').value.trim());
  const categoria=document.getElementById('novo-categoria').value;
  const err=document.getElementById('novo-err');
  const btn=document.getElementById('novo-confirmar');
  err.style.display='none';
  if(!nome||!slug){err.textContent='Preencha nome e slug.';err.style.display='block';return;}
  if(todosNpcs.some(n=>n.slug===slug)){err.textContent='Já existe um NPC com esse slug.';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Criando...';
  try{
    const res=await apiPost('npcs',{nome,slug,categoria,time:[{},{},{},{},{},{}],relacionamentos:[],rel_total:6,ativo:true});
    if(res&&res[0]){
      location.href=`/npcdex/${encodeURIComponent(slug)}`;
    } else {
      err.textContent='Criação não retornou dados. Verifica a tabela npcs no Supabase.';err.style.display='block';
      btn.disabled=false;btn.textContent='Criar';
    }
  }catch(e){
    err.textContent='Erro: '+e.message;err.style.display='block';
    btn.disabled=false;btn.textContent='Criar';
  }
}

// ── Init ──
if(isAdmin()) entrarShell();
</script>
