<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mural de Missões — Kingdom Platinum</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --wood:#3b1d0a;--wood2:#5a3015;--paper:#fbf5e6;--paper2:#f3e9cf;--ink:#2b1a0e;--muted:#7a6650;
  --line:#d9c9a3;--brand:#8a4b14;--ok:#2e7d32;--warn:#b26a00;--bad:#b3261e;--bg:#efe6d2;--card-shadow:0 6px 16px rgba(59,29,10,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;min-height:100vh}
a{color:inherit}
header{background:var(--wood);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.3)}
header .back{color:#e8d7bd;text-decoration:none;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:8px}
header h1{font-family:'Cinzel',serif;font-size:21px;margin:0;letter-spacing:.04em;flex:1;min-width:180px}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who b{color:#ffd9a0}
.btn{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--brand);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tabs{display:flex;gap:6px}
.tab{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--wood);color:#fff;border-color:var(--wood)}
.toolbar input,.toolbar select{font-family:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.toolbar input{flex:1;min-width:160px}
.spacer{flex:1}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.note{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:26px 20px 18px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;gap:12px}
.note::before{content:'';position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#b3261e 70%);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.note.off{opacity:.6}
.note h2{font-family:'Cinzel',serif;font-size:18px;margin:0;text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.rank{display:inline-block;font-weight:800;font-size:11px;letter-spacing:.06em;background:var(--wood);color:#ffd9a0;border-radius:5px;padding:3px 8px;margin-right:8px;vertical-align:middle}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:0;padding:10px 12px;background:var(--paper2);border-radius:6px}
.meta dt{font-weight:800;color:var(--brand)}.meta dd{margin:0}
.desc{font-size:14px;line-height:1.55;white-space:pre-line;margin:0}
.rew{font-size:13px;border-top:1px dashed var(--line);padding-top:10px}
.rew b{color:var(--brand)}
.rew .none{color:var(--muted);font-style:italic}
.takers{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.chip.me{border-color:var(--brand);background:#fff3df;font-weight:800}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.chip.done .dot{background:var(--ok)}
.chip button{border:0;background:none;cursor:pointer;font-size:12px;padding:0 0 0 2px;color:var(--ok);font-weight:800}
.chip button.x{color:var(--bad)}
.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.foot .hint{font-size:12px;color:var(--muted);flex:1;min-width:120px}
.badge-off{font-size:11px;font-weight:800;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(30,15,5,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.on{display:flex}
.modal{background:var(--paper);border-radius:12px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.modal.wide{max-width:680px}
.modal h3{font-family:'Cinzel',serif;margin:0 0 4px;font-size:19px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.f{margin-bottom:11px}
.f label{display:block;font-size:12px;font-weight:800;color:var(--brand);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;font-family:inherit;font-size:14px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.f textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;margin:6px 0;display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--wood);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;z-index:99;display:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
@media(max-width:560px){.board{grid-template-columns:1fr}.row2{grid-template-columns:1fr}header h1{font-size:17px}}
</style>
</head>
<body>

<header>
  <a class="back" href="/">← Início</a>
  <h1>📜 Mural de Missões</h1>
  <div class="who" id="who"></div>
</header>

<main>
  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab on" data-aba="todas">Todas</button>
      <button class="tab" data-aba="disp">Disponíveis</button>
      <button class="tab" data-aba="minhas">Minhas missões</button>
    </div>
    <select id="f-rank"><option value="">Todos os rankings</option></select>
    <input id="f-q" type="search" placeholder="Buscar missão, local, descrição…"/>
  </div>
  <div class="board" id="board"><div class="empty">Carregando missões…</div></div>
</main>

<!-- Login -->
<div class="ov" id="ov-login">
  <div class="modal">
    <h3>Entrar</h3>
    <div class="sub" id="pl-sub">Entre com seu player para escolher missões</div>
    <div class="f"><label>Player</label><input id="pl-player" autocomplete="username"/></div>
    <div class="f"><label>Senha</label><input id="pl-senha" type="password" autocomplete="current-password"/></div>
    <div class="f" id="pl-conf-wrap" style="display:none"><label>Confirmar senha (primeiro acesso)</label><input id="pl-conf" type="password"/></div>
    <div class="err" id="pl-err"></div>
    <div class="mfoot"><button class="btn ghost" data-close="ov-login">Cancelar</button><button class="btn" id="pl-go">Entrar</button></div>
  </div>
</div>

<!-- Aceitar -->
<div class="ov" id="ov-aceitar">
  <div class="modal">
    <h3 id="ac-titulo">Aceitar missão</h3>
    <div class="sub" id="ac-sub"></div>
    <div class="f" id="ac-pers-wrap"><label>Com qual personagem?</label><select id="ac-pers"></select></div>
    <div class="err" id="ac-err"></div>
    <div class="mfoot"><button class="btn ghost" data-close="ov-aceitar">Cancelar</button><button class="btn ok" id="ac-go">Aceitar missão</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Supabase (mesmo projeto do index: players / personagens) ─────────
const SUPA_URL = 'https://ucbkodkjlbatttiuqjtv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYmtvZGtqbGJhdHR0aXVxanR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjExODcsImV4cCI6MjA5MzMzNzE4N30.a65MSk7m4DvgTw2pHXhaqMOOEpjTB_wPsXJUfvOGiG4';
const H = {apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY, 'Content-Type':'application/json'};

async function api(path, opts={}){
  const r = await fetch(SUPA_URL+'/rest/v1/'+path, {...opts, headers:{...H, Prefer:'return=representation', ...(opts.headers||{})}});
  const t = await r.text(); let j=null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok) throw new Error((j && (j.message||j.hint)) || ('Erro '+r.status));
  return j || [];
}
async function rpc(fn, args){
  const r = await fetch(SUPA_URL+'/rest/v1/rpc/'+fn, {method:'POST', headers:H, body:JSON.stringify(args)});
  const t = await r.text(); let j=null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok) throw new Error((j && (j.message||j.hint)) || ('Erro '+r.status));
  return j;
}

// ── Estado ───────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null;            // {nome, id} — sessão compartilhada com o site (localStorage 'player_session')
let adm = null;           // {email} — sessão ADM do site ('adm_session')
let missoes = [], aceitas = [], meusPers = [];
let aba = 'todas';
let aceitando = null;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2800); }
function abrir(id){ $(id).classList.add('on'); }
function fechar(id){ $(id).classList.remove('on'); }
document.addEventListener('click', e => { const c = e.target.closest('[data-close]'); if(c) fechar(c.dataset.close); });

// ── Sessão ───────────────────────────────────────────────────────────
async function carregarSessao(){
  try{ adm = JSON.parse(localStorage.getItem('adm_session')||'null'); if(!adm?.email) adm = null; }catch(e){ adm = null; }
  try{
    const s = JSON.parse(localStorage.getItem('player_session')||'null');
    if(s?.nome && s?.id != null){
      // confere se o player ainda existe/ativo
      const r = await api('players?id=eq.'+encodeURIComponent(s.id)+'&select=id,nome,ativo');
      if(r[0] && r[0].ativo !== false) me = {nome:r[0].nome, id:r[0].id};
      else if(r[0]) localStorage.removeItem('player_session');
    }
  }catch(e){ try{ const s = JSON.parse(localStorage.getItem('player_session')||'null'); if(s?.nome) me = s; }catch(_){} }
  if(me){
    try{ meusPers = (await api('personagens?player=eq.'+encodeURIComponent(me.nome)+'&select=nome&order=nome.asc')).map(p=>p.nome); }catch(e){ meusPers = []; }
  }
}
function renderWho(){
  const w = $('who');
  w.innerHTML = '';
  if(me){
    w.innerHTML = `<span>Player: <b>${esc(me.nome)}</b></span>${adm?'<span title="Sessão ADM ativa">🛡️ ADM</span>':''}<button class="btn ghost sm" id="btn-sair">Sair</button>`;
    $('btn-sair').onclick = sair;
  } else {
    w.innerHTML = `${adm?'<span>🛡️ ADM</span>':''}<button class="btn" id="btn-entrar">Entrar</button>`;
    $('btn-entrar').onclick = () => abrir('ov-login');
  }
}
function sair(){
  try{ const sv = JSON.parse(localStorage.getItem('kp_ficha_sessao')||'null'); if(sv && me && String(sv.nome||'').toLowerCase()===me.nome.toLowerCase()) localStorage.removeItem('kp_ficha_sessao'); }catch(e){}
  localStorage.removeItem('player_session');
  me = null; meusPers = [];
  renderWho(); render();
}

// ── Login (mesmas funções RPC do index) ──────────────────────────────
let _chk;
$('pl-player').addEventListener('input', () => {
  clearTimeout(_chk);
  _chk = setTimeout(async () => {
    const nome = $('pl-player').value.trim();
    if(!nome){ $('pl-conf-wrap').style.display='none'; return; }
    try{
      const r = await rpc('player_check', {p_nome:nome}); const s = Array.isArray(r) ? r[0] : r;
      const primeiro = s && s.existe && s.precisa_senha;
      $('pl-conf-wrap').style.display = primeiro ? '' : 'none';
      $('pl-sub').textContent = primeiro ? 'Primeiro acesso — crie sua senha' : 'Entre com seu player para escolher missões';
    }catch(e){}
  }, 400);
});
['pl-player','pl-senha','pl-conf'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') $('pl-go').click(); }));
$('pl-go').onclick = async () => {
  const err = $('pl-err'); err.style.display='none';
  const nome = $('pl-player').value.trim(), senha = $('pl-senha').value, conf = $('pl-conf').value;
  const falha = m => { err.textContent = m; err.style.display = 'block'; };
  if(!nome) return falha('Informe seu nome de player.');
  if(!senha) return falha('Informe a senha.');
  let st; try{ const r = await rpc('player_check', {p_nome:nome}); st = Array.isArray(r) ? r[0] : r; }catch(e){ return falha('Erro: '+e.message); }
  if(!st || !st.existe) return falha('Player não encontrado.');
  let match;
  try{
    if(st.precisa_senha){
      if(!conf) return falha('Confirme sua senha.');
      if(senha !== conf) return falha('As senhas não coincidem.');
      if(senha.length < 4) return falha('A senha deve ter pelo menos 4 caracteres.');
      const r = await rpc('player_set_initial_password', {p_nome:nome, p_senha:senha}); match = Array.isArray(r) ? r[0] : r;
      if(!match) return falha('Este player já possui uma senha definida.');
    } else {
      const r = await rpc('player_login', {p_nome:nome, p_senha:senha}); match = Array.isArray(r) ? r[0] : r;
      if(!match) return falha('Senha incorreta.');
    }
  }catch(e){ return falha('Erro: '+e.message); }
  try{
    const a = await api('players?id=eq.'+encodeURIComponent(match.id)+'&select=ativo');
    if(a[0] && a[0].ativo === false) return falha('Este player está desativado. Fale com a administração.');
  }catch(e){}
  localStorage.setItem('player_session', JSON.stringify({nome:match.nome, id:match.id}));
  try{ // sessão do Fichário, como no resto do site
    const rf = await fetch('/api/ficha-token', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nome, senha})});
    const jf = await rf.json().catch(()=>null); if(rf.ok && jf?.token) localStorage.setItem('kp_ficha_sessao', JSON.stringify(jf));
  }catch(e){}
  $('pl-senha').value = ''; $('pl-conf').value = '';
  fechar('ov-login');
  await carregarSessao(); renderWho(); render();
  toast('Bem-vindo, '+match.nome+'!');
};

// ── Dados ────────────────────────────────────────────────────────────
async function carregarDados(){
  try{
    const [jm, ac] = await Promise.all([
      fetch('/missoes.json', {cache:'no-cache'}).then(r => { if(!r.ok) throw new Error('missoes.json HTTP '+r.status); return r.json(); }),
      api('missoes_aceitas?select=*&status=neq.cancelada&order=aceita_em.asc')
    ]);
    missoes = (Array.isArray(jm) ? jm : (jm.missoes || [])).map((m,i) => ({ativa:true, repeticao:'livre', ordem:i, ...m, id:String(m.id)}));
    aceitas = ac;
  }catch(e){
    $('board').innerHTML = `<div class="empty">Não foi possível carregar as missões.<br><small>${esc(e.message)}</small><br><small>Se as tabelas ainda não existem, confira o <b>missoes.json</b> e rode o <b>missoes.sql</b> no Supabase.</small></div>`;
    return false;
  }
  const ranks = [...new Set(missoes.map(m=>m.ranking).filter(Boolean))].sort();
  const sel = $('f-rank'), atual = sel.value;
  sel.innerHTML = '<option value="">Todos os rankings</option>' + ranks.map(r=>`<option>${esc(r)}</option>`).join('');
  sel.value = ranks.includes(atual) ? atual : '';
  return true;
}

// ── Regras de repetição ──────────────────────────────────────────────
const DIAS = {semanal:7, diaria:1};
function souEu(a){ return me && String(a.player_id) === String(me.id); }
// por que NÃO posso aceitar com este personagem? (null = pode)
function bloqueio(m, personagem){
  const pers = personagem || '';
  const minhas = aceitas.filter(a => a.missao_id===m.id && souEu(a) && (a.personagem||'') === pers);
  if(minhas.some(a => a.status==='aceita')) return 'Já está em andamento';
  if(m.repeticao === 'nao' && minhas.some(a => a.status==='concluida')) return 'Missão não repetível — já concluída';
  const dias = DIAS[m.repeticao];
  if(dias){
    const lim = Date.now() - dias*86400000;
    const rec = minhas.filter(a => new Date(a.aceita_em).getTime() >= lim).sort((x,y)=>new Date(y.aceita_em)-new Date(x.aceita_em))[0];
    if(rec){ const lib = new Date(new Date(rec.aceita_em).getTime()+dias*86400000); return 'Disponível de novo em '+lib.toLocaleDateString('pt-BR')+' '+lib.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
  }
  return null;
}

// ── Render ───────────────────────────────────────────────────────────
function render(){
  const q = $('f-q').value.trim().toLowerCase(), rk = $('f-rank').value;
  let lista = missoes.filter(m => m.ativa !== false).sort((a,b)=>(a.ordem-b.ordem)||String(a.ranking||'').localeCompare(String(b.ranking||'')));
  if(rk) lista = lista.filter(m => m.ranking === rk);
  if(q) lista = lista.filter(m => [m.titulo,m.local,m.mapa,m.descricao,m.estilo].join(' ').toLowerCase().includes(q));
  if(aba === 'minhas') lista = lista.filter(m => aceitas.some(a => a.missao_id===m.id && souEu(a)));
  if(aba === 'disp') lista = lista.filter(m => m.ativa && !aceitas.some(a => a.missao_id===m.id && souEu(a) && a.status==='aceita'));
  if(aba === 'minhas' && !me){ $('board').innerHTML = '<div class="empty">Entre com seu player para ver as suas missões.</div>'; return; }
  if(!lista.length){ $('board').innerHTML = '<div class="empty">Nenhuma missão encontrada.</div>'; return; }
  $('board').innerHTML = lista.map(card).join('');
}
function linha(k, v){ return v ? `<dt>${k}:</dt><dd>${esc(v)}</dd>` : ''; }
function card(m){
  const aqui = aceitas.filter(a => a.missao_id === m.id);
  const chips = aqui.map(a => {
    const eu = souEu(a), feito = a.status === 'concluida';
    const nome = esc(a.player_nome) + (a.personagem ? ' · '+esc(a.personagem) : '');
    let acoes = '';
    if(adm && !feito) acoes += `<button title="Marcar como concluída" data-act="concluir" data-id="${a.id}">✔</button>`;
    if((eu || adm) && !feito) acoes += `<button class="x" title="Cancelar" data-act="cancelar" data-id="${a.id}">✕</button>`;
    return `<span class="chip ${eu?'me':''} ${feito?'done':''}" title="${feito?'Concluída':'Em andamento'}"><span class="dot"></span>${nome}${acoes}</span>`;
  }).join('');
  const meusAbertos = aqui.filter(a => souEu(a) && a.status==='aceita');
  let acao;
  if(!me) acao = `<button class="btn" data-act="login">Entrar para aceitar</button>`;
  else {
    const personagens = meusPers.length ? meusPers : [''];
    const livres = personagens.filter(p => !bloqueio(m, p));
    if(livres.length) acao = `<button class="btn ok" data-act="aceitar" data-id="${m.id}">Aceitar missão</button>`;
    else acao = `<button class="btn" disabled>Indisponível</button><span class="hint">${esc(bloqueio(m, personagens[0]))}</span>`;
  }
  return `<article class="note">
    <h2><span class="rank">${esc(m.ranking ? 'RANK '+m.ranking : 'S/R')}</span>${esc(m.titulo)}</h2>
    <dl class="meta">
      ${linha('Estilo', m.estilo)}${linha('Pré-requisitos', m.pre_requisitos)}${linha('Local', m.local)}${linha('Mapa', m.mapa)}
      ${linha('Pokémon capturável', m.capturavel)}${linha('Repetível', m.repetivel)}
    </dl>
    ${m.descricao ? `<p class="desc">${esc(m.descricao)}</p>` : ''}
    <div class="rew"><b>Recompensas:</b> ${m.recompensas ? `<span style="white-space:pre-line">${esc(m.recompensas)}</span>` : '<span class="none">a definir</span>'}</div>
    <div class="takers">${aqui.length ? `<b>${aqui.length}</b> ${aqui.length>1?'treinadores escolheram':'treinador escolheu'} esta missão` : 'Ninguém escolheu esta missão ainda'}
      ${chips ? `<div class="chips">${chips}</div>` : ''}</div>
    <div class="foot">${acao}</div>
  </article>`;
}

// ── Ações ────────────────────────────────────────────────────────────
$('board').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if(act === 'login') return abrir('ov-login');
  if(act === 'aceitar') return abrirAceitar(missoes.find(m => m.id === id));
  if(act === 'concluir' || act === 'cancelar'){
    const a = aceitas.find(x => x.id === id); if(!a) return;
    if(act === 'cancelar' && !confirm('Cancelar esta participação'+(souEu(a)?'?':' de '+a.player_nome+'?'))) return;
    if(act === 'concluir' && !confirm('Marcar como concluída: '+a.player_nome+(a.personagem?' · '+a.personagem:'')+'?')) return;
    try{
      await api('missoes_aceitas?id=eq.'+encodeURIComponent(id), {method:'PATCH', body:JSON.stringify(act==='concluir' ? {status:'concluida', concluida_em:new Date().toISOString()} : {status:'cancelada'})});
      await carregarDados(); render(); toast(act==='concluir' ? 'Missão concluída!' : 'Participação cancelada.');
    }catch(err){ toast('Erro: '+err.message); }
  }
});

function abrirAceitar(m){
  if(!me || !m) return;
  aceitando = m;
  $('ac-titulo').textContent = m.titulo;
  $('ac-sub').textContent = (m.repetivel ? 'Repetível: '+m.repetivel : '');
  $('ac-err').style.display = 'none';
  const wrap = $('ac-pers-wrap'), sel = $('ac-pers');
  if(meusPers.length){
    wrap.style.display = '';
    sel.innerHTML = meusPers.map(p => { const b = bloqueio(m, p); return `<option value="${esc(p)}" ${b?'disabled':''}>${esc(p)}${b?' — '+esc(b):''}</option>`; }).join('');
    const livre = meusPers.find(p => !bloqueio(m, p)); if(livre) sel.value = livre;
  } else { wrap.style.display = 'none'; sel.innerHTML = '<option value=""></option>'; }
  abrir('ov-aceitar');
}
$('ac-go').onclick = async () => {
  const m = aceitando, err = $('ac-err');
  const pers = meusPers.length ? $('ac-pers').value : '';
  const b = bloqueio(m, pers);
  if(b){ err.textContent = b; err.style.display = 'block'; return; }
  $('ac-go').disabled = true;
  try{
    await api('missoes_aceitas', {method:'POST', body:JSON.stringify({missao_id:m.id, player_id:String(me.id), player_nome:me.nome, personagem:pers||null, status:'aceita'})});
    fechar('ov-aceitar'); await carregarDados(); render(); toast('Missão aceita! Boa sorte, '+(pers||me.nome)+'.');
  }catch(e){
    err.textContent = /duplicate|unique/i.test(e.message) ? 'Você já aceitou esta missão com esse personagem.' : 'Erro: '+e.message; err.style.display = 'block';
  }finally{ $('ac-go').disabled = false; }
};

// ── Filtros / init ───────────────────────────────────────────────────
$('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if(!t) return; aba = t.dataset.aba; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x===t)); render(); });
$('f-q').addEventListener('input', render);
$('f-rank').addEventListener('change', render);

(async () => {
  await carregarSessao();
  renderWho();
  if(await carregarDados()) render();
})();
</script>
