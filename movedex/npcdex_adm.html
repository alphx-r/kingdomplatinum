<!-- KP-ADMIN:BEGIN site=npcdex (gerado por build_gate.py) --><script data-site="npcdex">
/* admin-player.js — acesso por PLAYER (Chefe / ADM / MOD por site) + switch ao lado do nome do player.
   Uso (em TODO html, no <head>):  <script src="/admin-player.js"><\/script>
   Opcional: data-site="torneios" para forçar o nome do site (senão sai do caminho da URL).
   A lista vem de config.kp_staff (projeto do index):
     { "chefe":"ricky", "admins":["jef","lucas"], "mods":{ "torneios":[], "stores":[] } }
   IMPORTANTE: isto só controla a INTERFACE. Quem protege os dados é o servidor (token do player). */
(function () {
  if (window.KPAdm) return;
  var SU = 'https://ucbkodkjlbatttiuqjtv.supabase.co', SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYmtvZGtqbGJhdHR0aXVxanR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjExODcsImV4cCI6MjA5MzMzNzE4N30.a65MSk7m4DvgTw2pHXhaqMOOEpjTB_wPsXJUfvOGiG4';
  var KS = 'kp_ficha_sessao', KP = 'kp_preview', KC = 'kp_staff_cache', KT = 'kp_staff_ts', KJ = 'player_session', TTL = 600000;
  /* lê/grava nos DOIS storages: sessionStorage (esta aba) e localStorage (vale para as outras abas e visitas).
     rd(k, true) = a aba tem prioridade; rd(k) = o localStorage tem prioridade. A senha (kp_adm_cred) fica só na aba, de propósito. */
  function rd(k, sf) { var f = [function () { return sessionStorage.getItem(k); }, function () { return localStorage.getItem(k); }]; if (!sf) f.reverse(); for (var i = 0; i < f.length; i++) { try { var v = f[i](); if (v != null) return v; } catch (e) {} } return null; }
  function wr(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} try { localStorage.setItem(k, v); } catch (e) {} }
  function js(k, sf) { try { return JSON.parse(rd(k, sf)); } catch (e) { return null; } }
  var PADRAO = { chefe: 'ricky', admins: ['jef', 'lucas'], mods: {} };
  var nrm = function (s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').toLowerCase(); };

  var cs = document.currentScript;
  var SITE = (cs && cs.getAttribute('data-site')) || (function () {
    var p = location.pathname.replace(/\/+$/, '').replace(/\.html$/, '').split('/').pop() || 'index';
    return { pokemart: 'stores' }[p] || p;
  })();

  function lista(a) { return Array.isArray(a) ? a.map(function (x) { return nrm(x && typeof x === 'object' ? x.nome : x); }).filter(Boolean) : []; }
  function norm(v) {
    if (!v || typeof v !== 'object') return null;
    var mods = {}; Object.keys(v.mods || {}).forEach(function (k) { mods[String(k).toLowerCase()] = lista(v.mods[k]); });
    return { chefe: nrm(v.chefe) || PADRAO.chefe, admins: lista(v.admins), mods: mods };
  }
  var staff = norm(js(KC)) || PADRAO;

  function ses() { var s = js(KS); return s && s.token ? s : null; }
  /* o nome vem do Fichário (kp_ficha_sessao) ou, na falta dele, do login do index (player_session) */
  function nome() { var s = js(KS); if (s && s.nome) return s.nome; var j = js(KJ); return j && j.nome ? j.nome : ''; }
  function papel() {
    var n = nrm(nome()); if (!n) return null;
    if (n === staff.chefe) return 'chefe';
    if (staff.admins.indexOf(n) >= 0) return 'admin';
    var m = staff.mods[SITE]; if (m && m.indexOf(n) >= 0) return 'mod';
    return null;
  }
  function modoOn() { return rd(KP, true) !== '1'; }

  var ouvintes = [];
  function emit() { ouvintes.forEach(function (f) { try { f(); } catch (e) {} }); }

  /* ── switch ao lado do nome do player (liga/desliga o modo ADM/MOD); o clique no nome continua com a página ── */
  var busy = false;
  var SEL = '#nav-player-name,#nav-who';
  function pintar() {
    if (busy) return;
    var p = papel(), on = modoOn();
    Array.prototype.forEach.call(document.querySelectorAll(SEL), function (el) {
      var raw = el.textContent, txt = raw.replace(/^(ADM|MOD)\s+/, '').trim();
      /* páginas sem código próprio para o nome (npcdex...): preenche com o player logado */
      if ((!txt || txt === '—') && nome() && el.hasAttribute('data-kp-fill')) txt = nome();
      if (txt && raw !== txt) { busy = true; el.textContent = txt; busy = false; }
      var nx = el.nextElementSibling, sw = nx && nx.classList && nx.classList.contains('kp-sw') ? nx : null;
      var pv = el.previousElementSibling, rl = pv && pv.classList && pv.classList.contains('kp-role') ? pv : null;
      var bd = el.closest ? el.closest('#nav-player-badge') : null;
      if (!p || !txt || txt === '—' || txt === 'Entrar') { if (sw) sw.remove(); if (rl) rl.remove(); if (bd) bd.classList.remove('kp-staff'); return; }
      if (bd) bd.classList.add('kp-staff');
      if (!rl) { rl = document.createElement('span'); rl.className = 'kp-role'; el.parentNode.insertBefore(rl, el); }
      rl.textContent = p === 'mod' ? 'MOD' : 'ADM'; rl.classList.toggle('off', !on);
      if (!sw) {
        sw = document.createElement('button'); sw.type = 'button'; sw.className = 'kp-sw';
        sw.setAttribute('role', 'switch'); sw.innerHTML = '<i></i>';
        sw.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); toggle(); });
        el.parentNode.insertBefore(sw, el.nextSibling);
      }
      var tipo = p === 'mod' ? 'MOD' : 'ADM';
      sw.classList.toggle('on', on); sw.setAttribute('aria-checked', on ? 'true' : 'false');
      sw.setAttribute('aria-label', 'Modo ' + tipo); sw.removeAttribute('title');
    });
  }
  function toggle() {
    if (!papel()) return;
    /* torneios/stores já têm togPreview(): ela grava kp_preview e repinta a página */
    if (typeof window.togPreview === 'function') { window.togPreview(); setTimeout(function () { try { var sv = sessionStorage.getItem(KP); if (sv != null) localStorage.setItem(KP, sv); } catch (e) {} pintar(); emit(); }, 260); return; }
    wr(KP, modoOn() ? '1' : '');
    pintar(); emit();
  }


  /* ── senha do player (para ações que gravam no servidor); fica só nesta aba ── */
  var KK = 'kp_adm_cred';
  function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; return e; }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var DLG = 'padding:20px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:var(--bg,#1b1b20);color:var(--text,#fff);max-width:min(92vw,460px);width:100%;font:14px/1.4 system-ui,sans-serif';
  var INP = 'width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;font:inherit;margin:6px 0';
  var BTN = 'padding:9px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;font:inherit;font-weight:700;cursor:pointer';
  function credLimpar() { try { sessionStorage.removeItem(KK); } catch (e) {} }
  function cred(msg) {
    return new Promise(function (ok) {
      var c = null; try { c = JSON.parse(sessionStorage.getItem(KK)); } catch (e) {}
      if (c && c.n && c.s) return ok(c);
      var d = el('dialog', DLG);
      d.innerHTML = '<h3 style="margin:0 0 6px">Confirme sua senha</h3><p style="margin:0 0 8px;opacity:.75">' + esc(msg || 'Para salvar, confirme a senha do seu player.') + '</p>' +
        '<input id="kpc-n" style="' + INP + '" placeholder="Nome do player" value="' + esc(nome()) + '"><input id="kpc-s" type="password" style="' + INP + '" placeholder="Senha">' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button id="kpc-x" style="' + BTN + '">Cancelar</button><button id="kpc-o" style="' + BTN + ';background:#3bb54a;border-color:#3bb54a">Confirmar</button></div>';
      var v = null; document.body.appendChild(d);
      var go = function () { var n = d.querySelector('#kpc-n').value.trim(), s = d.querySelector('#kpc-s').value; if (!n || !s) return; v = { n: n, s: s }; try { sessionStorage.setItem(KK, JSON.stringify(v)); } catch (e) {} d.close(); };
      d.querySelector('#kpc-o').onclick = go; d.querySelector('#kpc-x').onclick = function () { d.close(); };
      d.querySelector('#kpc-s').onkeydown = function (e) { if (e.key === 'Enter') go(); };
      d.addEventListener('close', function () { d.remove(); ok(v); }, { once: true }); d.showModal();
    });
  }

  /* ── editor da lista de acesso (Chefe e ADMs) — com host (elemento) desenha dentro da página; sem host abre um diálogo ── */
  var SITES = ['torneios', 'stores', 'mapa', 'npcdex', 'fichas', 'missoes', 'weathercast', 'datadex'];
  var INP_I = 'width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1.5px solid var(--border,#dde3ee);background:var(--surface,#fff);color:var(--text,#1a1f2e);font:inherit;margin:6px 0';
  var BTN_I = 'padding:9px 16px;border-radius:8px;border:1.5px solid var(--border,#dde3ee);background:var(--surface,#fff);color:var(--text,#1a1f2e);font:inherit;font-weight:700;cursor:pointer';
  function editor(host) {
    var p = papel(); if (p !== 'chefe' && p !== 'admin') return;
    var inl = !!(host && host.nodeType === 1);
    var cInp = inl ? INP_I : INP, cBtn = inl ? BTN_I : BTN;
    var cChip = inl ? 'background:var(--surface2,#eef1f7);border:1px solid var(--border,#dde3ee)' : 'background:rgba(255,255,255,.1)';
    var nv = JSON.parse(JSON.stringify(staff)); nv.mods = nv.mods || {};
    SITES.forEach(function (k) { if (!nv.mods[k]) nv.mods[k] = []; });
    var d = inl ? el('div') : el('dialog', DLG + ';max-height:88vh;overflow:auto'), dl = el('datalist'); dl.id = 'kpe-pl'; d.appendChild(dl);
    fetch(SU + '/rest/v1/players?select=nome&order=nome.asc', { headers: { apikey: SKEY, Authorization: 'Bearer ' + SKEY } }).then(function (r) { return r.ok ? r.json() : []; })
      .then(function (L) { dl.innerHTML = (L || []).map(function (x) { return '<option value="' + esc(x.nome) + '">'; }).join(''); }).catch(function () {});
    var corpo = el('div'); d.appendChild(corpo);
    function sec(titulo, arr) {
      var h = '<div style="margin:12px 0 4px;font-weight:800">' + esc(titulo) + '</div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
        (arr.map(function (n, i) { return '<span style="padding:4px 10px;border-radius:99px;' + cChip + '">' + esc(n) + ' <a href="#" data-del="' + i + '" style="color:inherit;text-decoration:none;opacity:.7">✕</a></span>'; }).join('') || '<span style="opacity:.6">ninguém</span>') + '</div>' +
        '<div style="display:flex;gap:6px"><input list="kpe-pl" placeholder="Adicionar player…" style="' + cInp + '"><button data-add style="' + cBtn + ';margin:6px 0">+</button></div>';
      var box = el('div', '', h);
      box.addEventListener('click', function (e) {
        var a = e.target.closest('[data-del]'), b = e.target.closest('[data-add]');
        if (a) { e.preventDefault(); arr.splice(+a.getAttribute('data-del'), 1); desenha(); }
        if (b) { var n = nrm(box.querySelector('input').value); if (n && arr.indexOf(n) < 0 && n !== nv.chefe) { arr.push(n); desenha(); } }
      });
      return box;
    }
    function desenha() {
      corpo.innerHTML = (inl ? '' : '<h3 style="margin:0 0 4px">Equipe de acesso</h3>') + '<p style="margin:0;opacity:.75">Chefe: <b>' + esc(nv.chefe) + '</b>. O chefe só é trocado direto no banco.</p>';
      corpo.appendChild(sec('ADMs (todos os sites)', nv.admins));
      Object.keys(nv.mods).sort().forEach(function (k) { corpo.appendChild(sec('MODs · ' + k, nv.mods[k])); });
      var rod = el('div', 'display:flex;gap:8px;justify-content:flex-end;margin-top:16px', '<span id="kpe-err" style="flex:1;color:' + (inl ? 'var(--red,#c0392b)' : '#ff8a8a') + ';align-self:center"></span><button id="kpe-x" style="' + cBtn + '">' + (inl ? 'Desfazer' : 'Fechar') + '</button><button id="kpe-s" style="' + cBtn + ';background:#3bb54a;border-color:#3bb54a;color:#fff">Salvar</button>');
      corpo.appendChild(rod);
      rod.querySelector('#kpe-x').onclick = function () { if (inl) editor(host); else d.close(); };
      rod.querySelector('#kpe-s').onclick = async function () {
        var err = rod.querySelector('#kpe-err'); err.textContent = '';
        var c = await cred('Confirme a senha do seu player para salvar a equipe.'); if (!c) return;
        try {
          var r = await fetch('/api/ficha-salvar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'staff_salvar', nome: c.n, senha: c.s, staff: nv }) });
          var j = await r.json().catch(function () { return {}; });
          if (!r.ok) { if (r.status === 401 || r.status === 403) credLimpar(); throw new Error(j.error || 'Erro ' + r.status); }
          staff = norm(j.staff) || staff; wr(KC, JSON.stringify(staff)); wr(KT, String(Date.now()));
          pintar(); emit();
          if (inl) { err.style.color = '#2e8b3a'; err.textContent = 'Equipe salva ✓'; } else d.close();
        } catch (e) { err.textContent = e.message; }
      };
    }
    desenha();
    if (inl) { host.innerHTML = ''; host.appendChild(d); return; }
    document.body.appendChild(d); d.addEventListener('close', function () { d.remove(); }, { once: true }); d.showModal();
  }

  var st = document.createElement('style');
  st.textContent = '.kp-role{flex:none;margin:0 6px 0 0;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.22);color:inherit;font-size:10px;font-weight:800;letter-spacing:.6px;line-height:1;transition:opacity .18s}.kp-role.off{opacity:.45}.kp-sw{box-sizing:border-box;flex:none;position:relative;width:30px;height:17px;padding:0;margin:0 0 0 6px;border-radius:99px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);cursor:pointer;transition:background .18s,border-color .18s;-webkit-tap-highlight-color:transparent}.kp-sw i{position:absolute;top:1.5px;left:1.5px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .18s}.kp-sw.on{background:#3bb54a;border-color:#3bb54a}.kp-sw.on i{transform:translateX(13px)}';
  document.head.appendChild(st);

  function iniciar() {
    Array.prototype.forEach.call(document.querySelectorAll(SEL), function (el) {
      new MutationObserver(pintar).observe(el, { childList: true, characterData: true, subtree: true });
    });
    pintar();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
  window.addEventListener('storage', function (e) { if (e.key === KS || e.key === KJ) carregar(false); else if (e.key === KP) { pintar(); emit(); } });

  /* ── carrega a lista de acesso: só vai ao servidor se há player identificado e o cache (local+aba) passou de 10 min ── */
  function carregar(forcar) {
    var fresco = !!js(KC) && Date.now() - (+rd(KT) || 0) < TTL;
    if (!forcar && (!nome() || fresco)) return Promise.resolve().then(function () { pintar(); emit(); });
    return fetch(SU + '/rest/v1/config?chave=eq.kp_staff&select=valor', { headers: { apikey: SKEY, Authorization: 'Bearer ' + SKEY } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        var v = rows && rows[0] && rows[0].valor; if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { v = null; } }
        var n = norm(v); if (n) { staff = n; wr(KC, JSON.stringify(v)); wr(KT, String(Date.now())); }
      })
      .catch(function () {})
      .then(function () { pintar(); emit(); });
  }
  var ready = carregar(false);

  window.KPAdm = {
    site: SITE, ready: ready,
    papel: papel,                                                   // 'chefe' | 'admin' | 'mod' | null (ignora o botão)
    isStaff: function () { return !!papel(); },                     // tem acesso, mesmo no modo player
    modoOn: modoOn,
    isChefe: function () { return papel() === 'chefe' && modoOn(); },
    isAdm: function () { var p = papel(); return (p === 'chefe' || p === 'admin') && modoOn(); },   // use isto para liberar telas/botões de ADM
    isMod: function () { return papel() === 'mod' && modoOn(); },
    pode: function () { return !!papel() && modoOn(); },            // ADM ou MOD deste site, com o botão ligado
    nome: nome, staff: function () { return staff; },
    toggle: toggle, onChange: function (f) { ouvintes.push(f); },
    cred: cred, credLimpar: credLimpar,                             // {n,s} da senha do player (cache só na aba); mande como admin_nome/admin_senha
    editor: editor                                                  // editor(host): desenha a equipe dentro de 'host'; sem host abre um diálogo (Chefe/ADM)
  };
})();

</script><!-- KP-ADMIN:END -->
<!-- KP-GATE-HEAD:BEGIN (gerado por build_gate.py) --><style id="kp-gate-css">html:not(.kp-ok) body>*:not(#kp-gate){display:none!important}

#kp-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:var(--bg,#f4f6fb);color:var(--text,var(--ink,#1a1f2e));font:14px/1.45 var(--font-body,system-ui,sans-serif)}
#kp-gate .kg-box{width:100%;max-width:380px;text-align:center;background:var(--surface,var(--panel,#fff));border:1.5px solid var(--border,var(--line,#dde3ee));border-radius:14px;padding:32px 28px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
#kp-gate .kg-ico{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(127,127,127,.16)}
#kp-gate .kg-t{font:700 18px var(--font-title,inherit);margin-bottom:6px}
#kp-gate .kg-s{font-size:13px;opacity:.78;margin-bottom:22px}

html.kp-wait #kp-gate .kg-lock{display:none}
html:not(.kp-wait) #kp-gate .kg-wait{display:none}</style>
<script>
(function () {
  var h = document.documentElement, A = window.KPAdm, pend = true;
  /* libera só se o player logado está na lista (Chefe/ADM, ou MOD deste site). Espera a lista carregar antes de trancar de vez. */
  function dec() {
    var ok = !!(A && A.isStaff());
    h.classList.toggle('kp-ok', ok);
    h.classList.toggle('kp-wait', !ok && pend && !!(A && A.nome()));
  }
  dec();
  if (A) { A.onChange(dec); A.ready.then(function () { pend = false; dec(); }); } else { pend = false; dec(); }
})();
</script><!-- KP-GATE-HEAD:END -->

<title>NPCdex ADM — Kingdom Platinum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --brand:#1a3a5c;--brand-mid:#2563a8;
  --accent:#e8a020;
  --deep:#050c18;--panel:#0c1a2c;--panel2:#0f2138;
  --cyan:#3fe8ff;--cyan-dim:rgba(63,232,255,.35);
  --magenta:#ff3fa0;--magenta-dim:rgba(255,63,160,.3);
  --line:rgba(63,232,255,.14);
  --ink:#cfe4f5;--ink-dim:#7b93ad;
  --green:#5fd45f;--red:#ff6b5b;
  --font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif;--font-mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%}
body{min-height:100vh;font-family:var(--font-body);color:var(--ink)}
html{
  background-image:
    radial-gradient(ellipse 900px 500px at 8% -5%, rgba(63,232,255,.10), transparent 60%),
    radial-gradient(ellipse 700px 600px at 100% 30%, rgba(255,63,160,.08), transparent 60%),
    repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 42px);
  background-color:var(--deep);
  background-attachment:fixed;
}

/* ══ NAV ══ */
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:58px;background:var(--brand);position:sticky;top:0;z-index:9000;border-bottom:1px solid rgba(63,232,255,.18);box-shadow:0 1px 24px rgba(0,0,0,.35)}
.nav-logo img{height:35px;object-fit:contain}
.nav-title{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--magenta);letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.nav-title .dot{width:6px;height:6px;border-radius:50%;background:var(--magenta);box-shadow:0 0 8px 2px var(--magenta-dim);animation:pulse-dot 1.8s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.nav-back{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);text-decoration:none;padding:7px 14px;border-radius:20px;transition:all .2s}
.nav-back:hover{background:rgba(255,255,255,.12);color:#fff}

/* ══ LOGIN GATE ══ */
.gate{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--cyan-dim);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.gate-icon{font-size:32px;margin-bottom:10px}
.gate-title{font-family:var(--font-title);font-size:18px;font-weight:700;color:#fff;margin-bottom:4px}
.gate-sub{font-size:11px;color:var(--ink-dim);font-family:var(--font-mono);letter-spacing:.5px;margin-bottom:20px}
.gate-input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--font-body);font-size:14px;color:#fff;background:var(--panel);outline:none;margin-bottom:10px}
.gate-input:focus{border-color:var(--cyan)}
.gate-err{color:var(--red);font-size:11px;margin-bottom:10px;display:none}
.gate-btn{width:100%;padding:11px;border:none;border-radius:8px;background:var(--cyan);color:#03121c;font-family:var(--font-body);font-size:13px;font-weight:800;cursor:pointer}

/* ══ SHELL ══ */
.shell{display:none;max-width:1080px;margin:0 auto;padding:28px 24px 70px}
.shell.open{display:block}
.shell-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.shell-title{font-family:var(--font-title);font-size:26px;font-weight:900;color:#fff;letter-spacing:1px}
.shell-title span{color:var(--cyan)}
.shell-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:10px 16px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--cyan-dim)}
.btn-primary{background:rgba(63,232,255,.1);border-color:var(--cyan-dim);color:var(--cyan)}
.btn-primary:hover{background:rgba(63,232,255,.18)}
.btn-danger{background:rgba(255,107,91,.08);border-color:rgba(255,107,91,.35);color:var(--red)}
.btn-danger:hover{background:rgba(255,107,91,.16)}
.btn-ghost{background:transparent;color:var(--ink-dim)}
.btn-sm{padding:6px 11px;font-size:10px}

/* ══ FILTER ROW ══ */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search-input,.sel-input{background:var(--panel2);border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;font-family:var(--font-body);font-size:13px;color:#fff;outline:none}
.search-input{flex:1;min-width:180px}
.search-input:focus,.sel-input:focus{border-color:var(--cyan)}
.stat-pill{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;padding:0 6px}

/* ══ TABLE ══ */
.tbl-wrap{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-dim);padding:12px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(63,232,255,.04)}
.row-inativo td{opacity:.42}
.cell-npc{display:flex;align-items:center;gap:10px}
.cell-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel);flex-shrink:0}
.cell-photo-ph{width:34px;height:34px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.cell-name{font-weight:700;color:#fff}
.cell-slug{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim)}
.tag{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.tbl-actions{display:flex;gap:6px;flex-wrap:wrap}
.empty-row td{text-align:center;padding:50px 20px;color:var(--ink-dim);font-family:var(--font-mono);font-size:13px}

/* ══ MODAL ══ */
.modal-overlay{position:fixed;inset:0;background:rgba(2,6,14,.72);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--panel2);border:1.5px solid var(--cyan-dim);border-radius:14px;padding:26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-title{font-family:var(--font-title);font-size:16px;font-weight:700;color:#fff;margin-bottom:16px;text-align:center}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:10px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-family:var(--font-mono)}
.modal-field input,.modal-field select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;font-family:var(--font-body);font-size:13px;color:#fff;background:var(--panel);outline:none}
.modal-field input:focus,.modal-field select:focus{border-color:var(--cyan)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-err{color:var(--magenta);font-size:11px;margin-top:8px;text-align:center;display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1.5px solid var(--cyan-dim);color:#fff;padding:10px 20px;border-radius:30px;font-size:12px;font-family:var(--font-mono);z-index:10000;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}

@media(max-width:640px){
  .tbl th:nth-child(4),.tbl td:nth-child(4){display:none}
  .shell{padding:20px 14px 60px}
}
</style>
</head>
<body>
<!-- KP-GATE-BODY:BEGIN (gerado por build_gate.py — não edite à mão) --><div id="kp-gate"><div class="kg-box"><div class="kg-wait">Verificando acesso…</div><div class="kg-lock"><div class="kg-ico">🔒</div><div class="kg-t">Acesso restrito</div><div class="kg-s">Faça login como admin no site principal para acessá-lo.</div><a class="kg-b" href="/">Ir ao site principal</a></div></div></div><!-- KP-GATE-BODY:END -->

<nav class="nav">
  <a class="nav-logo" href="https://kingdomplatinum.vercel.app"><img src="https://64.media.tumblr.com/bb526b9df0c7703d60a3e491a3f2ecf6/25947a08ea9632bf-74/s1280x1920/cff7702dac61e7830b197041196e3f7da571140b.pnj" alt="Kingdom Platinum"></a>
  <div class="nav-title"><span class="dot"></span> NPCdex · Admin</div>
  <a class="nav-back" href="/npcdex">← Voltar ao NPCdex</a>
</nav>

<!-- SHELL: painel -->
<div class="shell" id="shell">
  <div class="shell-head">
    <div class="shell-title">NPCdex <span>ADM</span></div>
    <div class="shell-actions">
      <button class="btn btn-primary" onclick="abrirModalNovo()">+ Novo NPC</button>
      <button class="btn btn-ghost" onclick="sairAdm()">Sair</button>
    </div>
  </div>

  <div class="filter-row">
    <input class="search-input" id="busca" placeholder="Buscar por nome ou slug..." oninput="renderTabela()">
    <select class="sel-input" id="filtro-categoria" onchange="renderTabela()">
      <option value="">Todas as categorias</option>
      <option value="gymleader">GYM Leader</option>
      <option value="elitefour">Elite Four</option>
      <option value="liga">Campeão / Liga</option>
      <option value="househost">House Host</option>
      <option value="stationchief">Station Chief</option>
      <option value="vilao">Vilão</option>
      <option value="aliado">Aliado</option>
      <option value="comum">NPC Comum</option>
    </select>
    <select class="sel-input" id="filtro-status" onchange="renderTabela()">
      <option value="">Ativos e inativos</option>
      <option value="ativo">Só ativos</option>
      <option value="inativo">Só inativos</option>
    </select>
    <div class="stat-pill" id="stat-pill"></div>
  </div>

  <div class="tbl-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>NPC</th>
          <th>Categoria</th>
          <th>Cargo</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbl-body">
        <tr class="empty-row"><td colspan="5">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- MODAL: novo NPC -->
<div class="modal-overlay" id="modal-novo" onclick="if(event.target===this)fecharModalNovo()">
  <div class="modal-box">
    <div class="modal-title">Novo NPC</div>
    <div class="modal-field">
      <label>Nome</label>
      <input id="novo-nome" placeholder="Ex: Ariel Costa" oninput="sugerirSlug()">
    </div>
    <div class="modal-field">
      <label>Slug (URL)</label>
      <input id="novo-slug" placeholder="ex: ariel-costa">
    </div>
    <div class="modal-field">
      <label>Categoria</label>
      <select id="novo-categoria">
        <option value="gymleader">GYM Leader</option>
        <option value="elitefour">Elite Four</option>
        <option value="liga">Campeão / Liga</option>
        <option value="househost">House Host</option>
        <option value="stationchief">Station Chief</option>
        <option value="vilao">Vilão</option>
        <option value="aliado">Aliado</option>
        <option value="comum" selected>NPC Comum</option>
      </select>
    </div>
    <div class="modal-err" id="novo-err"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="fecharModalNovo()">Cancelar</button>
      <button class="btn btn-primary" id="novo-confirmar" onclick="criarNpc()">Criar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://fatdzivyqipmcbzaiftc.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhdGR6aXZ5cWlwbWNiemFpZnRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTMyNDAsImV4cCI6MjA5ODQyOTI0MH0.0SRPZt1RYSpEbPQazv7ttHJBZNDOyIax2YRO49bvpmE';

const isAdmin=()=>!!(window.KPAdm&&KPAdm.isStaff());

async function api(path,opts={}){
  const isGet=!opts.method||opts.method==='GET';
  let res;
  try{
    res=await fetch(`${SUPA_URL}/rest/v1/${path}`,{
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Content-Type':'application/json','Prefer':'return=representation',...(isGet?{'Range':'0-9999'}:{}),...opts.headers},
      ...opts
    });
  }catch(e){
    throw new Error('Falha de rede/conexão com o Supabase: '+e.message);
  }
  if(opts.method==='DELETE'){
    if(!res.ok){
      let parsed=null;
      try{parsed=JSON.parse(await res.text());}catch{}
      const msg=(parsed&&(parsed.message||parsed.error||parsed.hint))||`HTTP ${res.status} — verifique as permissões (RLS) de DELETE na tabela.`;
      throw new Error(msg);
    }
    return[];
  }
  if(res.status===204)return[];
  const t=await res.text();
  let parsed;
  try{parsed=JSON.parse(t);}catch{parsed=null;}
  if(!res.ok){
    const msg=(parsed&&(parsed.message||parsed.error||parsed.hint))||`HTTP ${res.status}`;
    throw new Error(msg);
  }
  return parsed??[];
}
const apiGet=(p,q='')=>api(`${p}?${q}`);
const apiPost=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
const apiPatch=(p,q,b)=>api(`${p}?${q}`,{method:'PATCH',body:JSON.stringify(b)});
const apiDel=(p,q)=>api(`${p}?${q}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});

const CAT_LABEL={gymleader:'GYM Leader',elitefour:'Elite Four',liga:'Campeão / Liga',househost:'House Host',stationchief:'Station Chief',vilao:'Vilão',aliado:'Aliado',comum:'NPC Comum'};
const CAT_ICON={gymleader:'🥋',elitefour:'👑',liga:'🏆',househost:'🏠',stationchief:'🚉',vilao:'💀',aliado:'🤝',comum:'👤'};
const CAT_COLOR={
  gymleader:{bg:'rgba(63,232,255,.1)',fg:'var(--cyan)',bd:'var(--cyan-dim)'},
  elitefour:{bg:'rgba(255,63,160,.1)',fg:'var(--magenta)',bd:'var(--magenta-dim)'},
  liga:{bg:'rgba(232,160,32,.12)',fg:'var(--accent)',bd:'rgba(232,160,32,.35)'},
  househost:{bg:'rgba(200,140,60,.14)',fg:'#e0a868',bd:'rgba(200,140,60,.4)'},
  stationchief:{bg:'rgba(90,150,220,.14)',fg:'#7ab0ee',bd:'rgba(90,150,220,.4)'},
  vilao:{bg:'rgba(192,57,43,.14)',fg:'#ff6b5b',bd:'rgba(192,57,43,.4)'},
  aliado:{bg:'rgba(42,122,42,.14)',fg:'#5fd45f',bd:'rgba(42,122,42,.4)'},
  comum:{bg:'rgba(123,147,173,.1)',fg:'var(--ink-dim)',bd:'rgba(123,147,173,.3)'},
};

let todosNpcs=[];

// ── Toast ──
let _toastT=null;
function toast(msg,cor='var(--cyan)'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.borderColor=cor;el.style.display='block';
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>el.style.display='none',2200);
}

// ── Gate ──
function sairAdm(){ location.href='/npcdex'; }
function entrarShell(){
  document.getElementById('shell').classList.add('open');
  carregarNpcs();
}

// ── Carregar / renderizar tabela ──
async function carregarNpcs(){
  document.getElementById('tbl-body').innerHTML='<tr class="empty-row"><td colspan="5">Carregando...</td></tr>';
  try{
    todosNpcs=await apiGet('npcs','order=ordem.asc,nome.asc')||[];
  }catch(e){
    document.getElementById('tbl-body').innerHTML=`<tr class="empty-row"><td colspan="5" style="color:var(--red)">Erro ao carregar: ${e.message}</td></tr>`;
    todosNpcs=[];
    return;
  }
  renderTabela();
}

function renderTabela(){
  const q=(document.getElementById('busca').value||'').toLowerCase().trim();
  const cat=document.getElementById('filtro-categoria').value;
  const status=document.getElementById('filtro-status').value;
  let lista=todosNpcs.slice();
  if(q) lista=lista.filter(n=>(n.nome||'').toLowerCase().includes(q)||(n.slug||'').toLowerCase().includes(q));
  if(cat) lista=lista.filter(n=>(n.categoria||'comum')===cat);
  if(status==='ativo') lista=lista.filter(n=>n.ativo!==false);
  if(status==='inativo') lista=lista.filter(n=>n.ativo===false);

  document.getElementById('stat-pill').textContent=`${lista.length} de ${todosNpcs.length} NPC(s)`;

  const tbody=document.getElementById('tbl-body');
  if(!lista.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="5">Nenhum NPC encontrado.</td></tr>';
    return;
  }
  tbody.innerHTML=lista.map(n=>{
    const catInfo=CAT_COLOR[n.categoria]||CAT_COLOR.comum;
    const catLabel=CAT_LABEL[n.categoria]||'NPC Comum';
    const catIcon=CAT_ICON[n.categoria]||'👤';
    const inativo=n.ativo===false;
    const foto=n.foto?`<img class="cell-photo" src="${n.foto}" onerror="this.style.display='none'">`:`<div class="cell-photo-ph">${catIcon}</div>`;
    return `<tr class="${inativo?'row-inativo':''}">
      <td><div class="cell-npc">${foto}<div><div class="cell-name">${n.nome||'(sem nome)'}</div><div class="cell-slug">/${n.slug}</div></div></div></td>
      <td><span class="tag" style="background:${catInfo.bg};color:${catInfo.fg};border:1px solid ${catInfo.bd}">${catIcon} ${catLabel}</span></td>
      <td>${n.cargo||'—'}</td>
      <td><span class="tag" style="background:${inativo?'rgba(255,107,91,.1)':'rgba(95,212,95,.1)'};color:${inativo?'var(--red)':'var(--green)'};border:1px solid ${inativo?'rgba(255,107,91,.35)':'rgba(95,212,95,.35)'}">${inativo?'Inativo':'Ativo'}</span></td>
      <td><div class="tbl-actions">
        <a class="btn btn-sm" href="/npcdex/${encodeURIComponent(n.slug)}">✏️ Editar</a>
        <button class="btn btn-sm" onclick="toggleAtivo('${n.id}',${inativo})">${inativo?'Ativar':'Desativar'}</button>
        <button class="btn btn-sm btn-danger" onclick="excluirNpc('${n.id}','${(n.nome||'').replace(/'/g,"\\'")}')">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
}

async function toggleAtivo(id,tornarAtivo){
  try{
    await apiPatch('npcs',`id=eq.${id}`,{ativo:tornarAtivo});
    const n=todosNpcs.find(x=>String(x.id)===String(id));
    if(n) n.ativo=tornarAtivo;
    renderTabela();
    toast(tornarAtivo?'NPC ativado':'NPC desativado');
  }catch(e){
    toast('Erro: '+e.message,'var(--red)');
  }
}

async function excluirNpc(id,nome){
  if(!confirm(`Tem certeza que quer excluir "${nome}"? Essa ação não pode ser desfeita.`))return;
  try{
    await apiDel('npcs',`id=eq.${id}`);
    todosNpcs=todosNpcs.filter(x=>String(x.id)!==String(id));
    renderTabela();
    toast('NPC excluído');
  }catch(e){
    toast('Erro ao excluir: '+e.message,'var(--red)');
  }
}

// ── Novo NPC ──
function slugify(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function sugerirSlug(){
  const slugEl=document.getElementById('novo-slug');
  if(!slugEl.dataset.touched) slugEl.value=slugify(document.getElementById('novo-nome').value);
}
function abrirModalNovo(){
  document.getElementById('novo-nome').value='';
  document.getElementById('novo-slug').value='';
  document.getElementById('novo-slug').dataset.touched='';
  document.getElementById('novo-categoria').value='comum';
  document.getElementById('novo-err').style.display='none';
  document.getElementById('modal-novo').classList.add('open');
  setTimeout(()=>document.getElementById('novo-nome').focus(),50);
}
function fecharModalNovo(){document.getElementById('modal-novo').classList.remove('open');}

document.getElementById('novo-slug').addEventListener('input',function(){
  this.dataset.touched='1';
  const start=this.selectionStart;
  const antes=this.value.length;
  this.value=this.value.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-');
  const diff=antes-this.value.length;
  const pos=Math.max(0,(start||0)-diff);
  this.setSelectionRange(pos,pos);
});
document.getElementById('novo-slug').addEventListener('keydown',function(e){
  if(e.key===' ') e.preventDefault();
});

async function criarNpc(){
  const nome=document.getElementById('novo-nome').value.trim();
  const slug=slugify(document.getElementById('novo-slug').value.trim());
  const categoria=document.getElementById('novo-categoria').value;
  const err=document.getElementById('novo-err');
  const btn=document.getElementById('novo-confirmar');
  err.style.display='none';
  if(!nome||!slug){err.textContent='Preencha nome e slug.';err.style.display='block';return;}
  if(todosNpcs.some(n=>n.slug===slug)){err.textContent='Já existe um NPC com esse slug.';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Criando...';
  try{
    const res=await apiPost('npcs',{nome,slug,categoria,time:[{},{},{},{},{},{}],relacionamentos:[],rel_total:6,ativo:true});
    if(res&&res[0]){
      location.href=`/npcdex/${encodeURIComponent(slug)}`;
    } else {
      err.textContent='Criação não retornou dados. Verifica a tabela npcs no Supabase.';err.style.display='block';
      btn.disabled=false;btn.textContent='Criar';
    }
  }catch(e){
    err.textContent='Erro: '+e.message;err.style.display='block';
    btn.disabled=false;btn.textContent='Criar';
  }
}

// ── Init ──
(function(){ var feito=false; function ir(){ if(!feito&&isAdmin()){ feito=true; entrarShell(); } } ir(); if(window.KPAdm){ KPAdm.ready.then(ir); KPAdm.onChange(ir); } })();
</script>
</body>
</html>
