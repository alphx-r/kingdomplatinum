<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ItemDex — Kingdom Platinum</title>
    <link rel="icon" type="image/x-icon" href="https://64.media.tumblr.com/c429cb57b048b0ba1d90c6451d7c3aa1/8607b48e6654212e-0d/s540x810/c1f9956cc78935a32f53346f3a7a942caa5d1d67.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1a3a5c;--brand-mid:#2563a8;--brand-light:#e8f0fb;
  --accent:#e8a020;--accent-light:#fdf3dc;
  --surface:#fff;--surface2:#f0f3f8;
  --border:#dde3ee;--text:#1a1f2e;--muted:#6b7a99;
  --green:#2a7a2a;--red:#c0392b;

  /* ── tokens do tema "smartwatch" (mesmo do DataDex/NationalDex/MoveDex/AbilityDex) ── */
  --deep:#050c18;--panel:#0c1a2c;--panel2:#0f2138;
  --cyan:#3fe8ff;--cyan-dim:rgba(63,232,255,.35);
  --magenta:#ff3fa0;--magenta-dim:rgba(255,63,160,.3);
  --line:rgba(63,232,255,.14);
  --ink:#cfe4f5;--ink-dim:#7b93ad;

  --r:12px;--font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif;--font-mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%}
body{min-height:100vh;font-family:var(--font-body);color:var(--ink)}

html{
  background-image:
    radial-gradient(ellipse 900px 500px at 8% -5%, rgba(63,232,255,.10), transparent 60%),
    radial-gradient(ellipse 700px 600px at 100% 30%, rgba(255,63,160,.08), transparent 60%),
    repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 42px);
  background-color:var(--deep);
  background-attachment:fixed;
}

/* ══════════════ NAV ══════════════ */
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:58px;background:var(--brand);position:sticky;top:0;z-index:9000;border-bottom:1px solid rgba(63,232,255,.18);box-shadow:0 1px 24px rgba(0,0,0,.35)}
.nav-logo{font-family:var(--font-title);font-size:16px;font-weight:700;color:#fff;letter-spacing:1px;display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.nav-links{display:flex;gap:4px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.nav-link{font-size:13px;font-weight:600;font-family:var(--font-body);padding:7px 18px;border-radius:20px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center}
.nav-link:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-link.active{background:rgba(255,255,255,.18);color:#fff}
.nav-link.locked{opacity:.4;cursor:not-allowed;pointer-events:none}
.nav-hamburger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:36px;height:36px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;cursor:pointer;padding:0;flex-shrink:0}
.nav-hamburger span{display:block;width:18px;height:2px;background:#fff;border-radius:2px;transition:all .25s}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-dropdown{display:none;position:absolute;top:58px;left:0;right:0;background:var(--brand);border-bottom:2px solid rgba(63,232,255,.18);z-index:8999;padding:10px 14px 14px;flex-direction:column;gap:4px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.nav-dropdown.open{display:flex}
.nav-dropdown .nav-link{width:100%;text-align:left;border-radius:8px;padding:10px 14px;font-size:13px}
@media(max-width:768px){.nav-links{display:none}.nav-hamburger{display:flex}}

/* ══════════════ HERO ══════════════ */
.hero{position:relative;padding:40px 24px 30px;text-align:center;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:inline-flex;align-items:center;gap:8px}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan))}
.hero-eyebrow::after{background:linear-gradient(90deg,var(--cyan),transparent)}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px 2px var(--cyan-dim);animation:pulse-dot 1.8s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.hero-title{font-family:var(--font-title);font-size:36px;font-weight:900;color:#fff;letter-spacing:3px;margin-bottom:8px;text-shadow:0 0 18px rgba(63,232,255,.35),0 2px 20px rgba(0,0,0,.4)}
.hero-title span{color:var(--cyan)}
.hero-sub{font-size:12px;color:var(--ink-dim);font-family:var(--font-mono);letter-spacing:1.5px;text-transform:uppercase}
.hero-scan{width:min(420px,80%);height:2px;margin:18px auto 0;position:relative;background:linear-gradient(90deg,transparent,var(--line),transparent);overflow:hidden;border-radius:2px}
.hero-scan::after{content:'';position:absolute;top:0;left:-30%;width:30%;height:100%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 2.6s linear infinite}
@keyframes scan{from{left:-30%}to{left:100%}}

/* ══════════════ SEARCH / FILTER BAR ══════════════ */
.dex-wrap{max-width:1200px;margin:0 auto;padding:28px 24px 60px}
.search-bar{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sinput-wrap{position:relative;flex:1;min-width:200px}
.sinput-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-dim);pointer-events:none}
#search{width:100%;padding:9px 12px 9px 38px;border-radius:20px;border:1.5px solid var(--line);background:rgba(5,12,24,.5);font-family:var(--font-body);font-size:13px;color:var(--ink);outline:none;transition:border .2s}
#search:focus{border-color:var(--cyan)}
#search::placeholder{color:var(--ink-dim)}
.mfilter{padding:9px 14px;border-radius:8px;border:1.5px solid var(--line);background:rgba(5,12,24,.5);font-family:var(--font-body);font-size:13px;color:var(--ink);outline:none;cursor:pointer}
.mfilter option{background:var(--panel);color:var(--ink)}
.mfilter:focus{border-color:var(--cyan)}
.cpill{background:rgba(63,232,255,.08);border:1px solid var(--cyan-dim);border-radius:20px;padding:5px 16px;font-family:var(--font-mono);font-size:11px;color:var(--cyan);font-weight:700;white-space:nowrap;margin-left:auto;letter-spacing:.5px}

/* ══════════════ GRID DE ITENS ══════════════ */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.item-card{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1.5px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;
  animation:fadeUp .3s both;transition:all .25s;position:relative;
}
.item-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,var(--cyan-dim),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.item-card:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 8px 24px rgba(63,232,255,.14)}
.item-icon-wrap{padding:16px 14px 10px;display:flex;justify-content:center;align-items:center}
.item-icon{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.item-icon-fallback{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.5}
.item-name-bar{background:#0a1626;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);padding:8px 12px;text-align:center}
.item-name{font-family:var(--font-title);font-weight:700;font-size:13px;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.item-body{background:#fff;padding:12px 14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.item-cat{font-family:var(--font-mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--cyan)}
.item-desc{font-size:12px;color:#333;line-height:1.55;text-align:justify}
.mv-dash{color:#999;font-family:var(--font-mono)}

.empty-msg{padding:60px 20px;text-align:center;color:var(--ink-dim);font-family:var(--font-mono);font-size:12px;grid-column:1/-1}
.spinner-wrap{padding:60px 20px;text-align:center;grid-column:1/-1}
.spinner{width:34px;height:34px;border:3px solid rgba(63,232,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-text{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:600px){
  .sinput-wrap{flex:1 1 100%}
  .mfilter{flex:1 1 auto;min-width:0}
  .cpill{flex:1 1 100%;width:100%;box-sizing:border-box;text-align:center;margin-left:0}
  .item-grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(max-width:500px){.hero-title{font-size:28px}.dex-wrap{padding:16px 12px 40px}}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="https://kingdomplatinum.vercel.app"><img src="https://64.media.tumblr.com/bb526b9df0c7703d60a3e491a3f2ecf6/25947a08ea9632bf-74/s1280x1920/cff7702dac61e7830b197041196e3f7da571140b.pnj" style="height:35px;object-fit:contain" alt="Kingdom Platinum"></a>
  <div class="nav-links">
    <a class="nav-link" href="/datadex">Home</a>
    <a class="nav-link" href="/datadex/nationaldex">NationalDex</a>
    <a class="nav-link" href="/datadex/movedex">MoveDex</a>
    <a class="nav-link" href="/datadex/abilitydex">AbilityDex</a>
    <a class="nav-link active" href="/datadex/itemdex">ItemDex</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" onclick="toggleMobileMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-dropdown" id="nav-dropdown">
  <a class="nav-link" href="/datadex">Home</a>
  <a class="nav-link" href="/datadex/nationaldex">NationalDex</a>
  <a class="nav-link" href="/datadex/movedex">MoveDex</a>
  <a class="nav-link" href="/datadex/abilitydex">AbilityDex</a>
  <a class="nav-link active" href="/datadex/itemdex">ItemDex</a>
</div>

<div class="hero">
  <div class="hero-eyebrow"><span class="hero-dot"></span> Pokétch <span class="hero-dot"></span></div>
  <div class="hero-title">Item<span>Dex</span></div>
  <div class="hero-sub" id="hero-sub">Carregando itens…</div>
  <div class="hero-scan"></div>
</div>

<div class="dex-wrap">
  <div class="search-bar">
    <div class="sinput-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Buscar item…" oninput="applyFilters()">
    </div>
    <select id="f-cat" class="mfilter" onchange="applyFilters()"><option value="">Todas categorias</option></select>
    <span class="cpill" id="count-pill">—</span>
  </div>

  <div class="item-grid" id="grid">
    <div class="spinner-wrap"><div class="spinner"></div><div class="spinner-text">Carregando ItemDex…</div></div>
  </div>
</div>

<script>
const SUPA_URL='https://vnccljhhexlsthjaaorr.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuY2NsamhoZXhsc3RoamFhb3JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTI5NjEsImV4cCI6MjEwMDg2ODk2MX0.XtKUKNMq7MG_NAQo74nbIsvJCKFE-qhH4_AxULF7M1k';
const SH={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};

async function sbFetchAllPages(url,headers,pageSize=1000){
  let all=[],from=0;
  while(true){
    const sep=url.includes('?')?'&':'?';
    const res=await fetch(`${url}${sep}limit=${pageSize}&offset=${from}`,{headers});
    if(!res.ok) break;
    const chunk=await res.json();
    all=all.concat(chunk);
    if(chunk.length<pageSize) break;
    from+=pageSize;
  }
  return all;
}

let ALL=[];

function cardHtml(it){
  const icon = it.sprite
    ? `<img class="item-icon" src="${it.sprite}" alt="${it.name}" loading="lazy">`
    : `<div class="item-icon-fallback">🎒</div>`;
  const isConsumivel = !!it.flags?.consumivel?.enabled;
  const rawDesc = it.item_desc || '';
  const startsWithTag = /^consumível\b/i.test(rawDesc.trim());
  let desc;
  if (startsWithTag) {
    // O texto já vem com "CONSUMÍVEL" digitado no início (inserido pelo painel
    // admin) — deixa só essa palavra em negrito preto, com ponto colado, e
    // mantém o resto normal.
    const trimmed = rawDesc.trim();
    const rest = trimmed.slice('consumível'.length).replace(/^[\s.—-]+/, '');
    desc = `<b style="color:#000">CONSUMÍVEL.</b>${rest ? ' ' + rest : ''}`;
  } else if (isConsumivel) {
    // Item legado com a flag marcada mas sem o texto literal na descrição.
    desc = `<b style="color:#000">CONSUMÍVEL.</b>${rawDesc ? ' ' + rawDesc : ''}`;
  } else {
    desc = rawDesc || '<span class="mv-dash">—</span>';
  }
  return `<div class="item-card">
    <div class="item-icon-wrap">${icon}</div>
    <div class="item-name-bar"><span class="item-name">${it.name||''}</span></div>
    <div class="item-body">
      <span class="item-desc">${desc}</span>
    </div>
  </div>`;
}

function render(){
  const grid=document.getElementById('grid');
  const q=document.getElementById('search').value.trim().toLowerCase();
  const fCat=document.getElementById('f-cat').value;

  let list=ALL.filter(it=>{
    if(q){
      const hay=`${it.name||''} ${it.item_desc||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(fCat && it.category!==fCat) return false;
    return true;
  });

  list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  document.getElementById('count-pill').textContent=`${list.length} de ${ALL.length} itens`;
  grid.innerHTML = list.length ? list.map(cardHtml).join('') : `<div class="empty-msg">Nenhum item encontrado.</div>`;
}
function applyFilters(){ render(); }

function populateCatFilter(){
  const sel=document.getElementById('f-cat');
  const cats=[...new Set(ALL.map(it=>it.category).filter(Boolean))].sort();
  sel.innerHTML='<option value="">Todas categorias</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

// Fallback estático: items.json na raiz do repo alphx-r/kingdomplatinum
// (mesmo padrão do pokemon.json). Só é usado se o Supabase falhar ou não
// retornar nada — ele é atualizado manualmente via o botão "Atualizar
// items.json" no painel admin, então pode ficar levemente desatualizado.
const ITEMS_JSON_FALLBACK='https://raw.githubusercontent.com/alphx-r/kingdomplatinum/main/items.json';

async function loadItemsFallback(){
  const res=await fetch(ITEMS_JSON_FALLBACK,{cache:'no-store'});
  if(!res.ok) throw new Error('fallback fetch failed: '+res.status);
  return await res.json();
}

async function init(){
  let usedFallback=false;
  try{
    ALL=await sbFetchAllPages(`${SUPA_URL}/rest/v1/items?select=*`,SH);
    if(!ALL.length) throw new Error('empty supabase result');
  }catch(e){
    try{
      ALL=await loadItemsFallback();
      usedFallback=true;
    }catch(e2){
      ALL=[];
    }
  }
  document.getElementById('hero-sub').textContent = usedFallback
    ? `${ALL.length} itens catalogados (fonte: backup)`
    : `${ALL.length} itens catalogados`;
  populateCatFilter();
  render();
}
init();

// ── Menu mobile (hamburger) ──
function toggleMobileMenu(){
  const btn=document.getElementById('nav-hamburger');
  const drop=document.getElementById('nav-dropdown');
  btn.classList.toggle('open');
  drop.classList.toggle('open');
}
document.addEventListener('click',function(e){
  const btn=document.getElementById('nav-hamburger');
  const drop=document.getElementById('nav-dropdown');
  if(btn&&drop&&!btn.contains(e.target)&&!drop.contains(e.target)){
    btn.classList.remove('open');
    drop.classList.remove('open');
  }
});
</script>
</body>
</html>
