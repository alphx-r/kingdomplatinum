<!-- PokéMart (/pokemart): compra e venda de itens da Bag da ficha. Itens vêm do items.json (flags.pokemart.enabled + price; flags.pokemart.enabled = comprável (e revendível por SELL_PCT do preço); flags.venda.enabled = o PokéMart compra do jogador pelo preço cheio do items.json, mesmo sem vender o item; se tiver as duas, vale a regra do PokéMart (SELL_PCT), pra não dar pra comprar e revender pelo mesmo valor).
     Compra desconta o dinheiro e soma na Bag; venda tira da Bag e soma o dinheiro (ver sellUnit). Salva via /api/ficha-salvar.
     vercel.json: { "source": "/pokemart", "destination": "/pokemart.html" } -->

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1a3a5c;--brand-mid:#2563a8;--brand-light:#e8f0fb;
  --accent:#e8a020;--accent-light:#fdf3dc;
  --bg:#808080;--surface:#fff;--surface2:#f0f3f8;

html,body{min-height:100%;background:var(--bg);font-family:var(--font-body);color:var(--text)}
:root{--sidenav-w:64px;--sidenav-w-open:220px}
body{padding-left:var(--sidenav-w);transition:padding-left .25s ease}

.nav.expanded{width:var(--sidenav-w-open);box-shadow:4px 0 24px rgba(0,0,0,.3)}
.nav-top{display:flex;align-items:center;gap:10px;padding:0 14px;height:58px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.nav-hamburger{position:relative;display:flex;justify-content:center;align-items:center;width:36px;height:36px;min-width:36px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;cursor:pointer;padding:0;flex-shrink:0;color:#fff;transition:background .2s,border-color .2s,color .2s}
.nav-hamburger svg{width:18px;height:18px;display:block}
#nav-player-badge.is-admin{border-color:rgba(255,255,255,.3)}
.nav-logo{font-family:var(--font-title);font-size:15px;font-weight:700;color:#fff;letter-spacing:1px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.nav.expanded .nav-logo{opacity:1;transition:opacity .3s ease .1s}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;flex-direction:column;gap:2px;padding:8px;overflow-y:auto;overflow-x:hidden;flex:1}
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.nav-link{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;font-family:var(--font-body);padding:10px 12px;border-radius:10px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;white-space:nowrap;width:100%;text-align:left;text-decoration:none!important}
.nav-link:hover,.nav-link:visited,.nav-link:active,.nav-link:focus{text-decoration:none!important}
.nav-link:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-link.active{background:rgba(255,255,255,.18);color:#fff}
.nav-link .nav-ico{font-size:17px;min-width:20px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-ico svg{width:17px;height:17px;display:block}
.nav-link .nav-label{opacity:0;transition:opacity .15s;overflow:hidden}
.nav.expanded .nav-link .nav-label{opacity:1;transition:opacity .25s ease .08s}
.nav-drop-wrap{position:relative;display:flex;flex-direction:column}
.nav-drop-btn{font-size:13px;font-weight:600;font-family:var(--font-body);padding:10px 12px;border-radius:10px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;width:100%;text-align:left;white-space:nowrap}
.nav-drop-btn:hover,.nav-drop-btn.open,.nav-drop-btn.active{background:rgba(255,255,255,.2);color:#fff}
.nav-drop-btn .nav-ico{font-size:17px;min-width:20px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-drop-btn .nav-label{opacity:0;transition:opacity .15s;overflow:hidden;flex:1}
.nav.expanded .nav-drop-btn .nav-label{opacity:1;transition:opacity .25s ease .08s}
.nav-drop-btn .nav-drop-arrow{font-size:10px;line-height:1;opacity:0;transition:opacity .15s,transform .2s;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px}
.nav.expanded .nav-drop-btn .nav-drop-arrow{opacity:1}
.nav-drop-btn.open .nav-drop-arrow{transform:rotate(180deg)}
.nav-drop-menu{display:none;flex-direction:column;gap:2px;padding:2px 0 2px 14px;margin-top:2px}
.nav-drop-menu.open{display:flex}
.nav-drop-item{font-size:12.5px;font-weight:600;font-family:var(--font-body);padding:9px 12px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,.75);cursor:pointer;transition:all .15s;text-align:left;white-space:nowrap;display:flex;align-items:center;gap:10px}
.nav-drop-item:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-bottom{padding:8px;border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}
.nav-login{font-size:12px;font-weight:700;font-family:var(--font-body);padding:10px 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;width:100%;white-space:nowrap}
.nav-login .nav-ico{font-size:16px;min-width:20px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-login .nav-label{opacity:0;transition:opacity .15s;overflow:hidden}
.nav.expanded .nav-login .nav-label{opacity:1;transition:opacity .25s ease .08s}
.nav-login:hover{background:var(--accent);border-color:var(--accent)}
.nav-login.active{background:var(--accent);border-color:var(--accent)}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8999}
.nav-overlay.open{display:block}
.loading-overlay{position:fixed;inset:0;background:var(--bg, #f4f6fa);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:#e53e3e;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--muted);font-weight:600}
#nav-player-badge{
  display:none;align-items:center;gap:0;justify-content:center;
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);
  border-radius:20px;padding:8px 0;font-size:12px;font-weight:700;color:#fff;
  width:100%;overflow:hidden;white-space:nowrap;
}
#nav-player-name{overflow:hidden;text-overflow:ellipsis;text-align:center;opacity:0;width:0;transition:opacity .15s}
.nav-player-ico{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-player-ico svg{width:14px;height:14px;display:block}
.nav.expanded #nav-player-badge{gap:6px;padding:8px 10px;width:100%}
.nav.expanded #nav-player-name{opacity:1;width:auto;flex:1;transition:opacity .25s ease .08s}
#nav-player-badge .player-logout-btn{
  background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;
  font-size:13px;padding:0 0 0 6px;line-height:1;transition:color .15s,opacity .15s;flex-shrink:0;
  opacity:0;width:0;overflow:hidden;pointer-events:none;
}
.nav.expanded #nav-player-badge .player-logout-btn{opacity:1;width:auto;padding:0 0 0 6px;pointer-events:auto;transition:opacity .2s ease .08s}
#nav-player-badge .player-logout-btn:hover{color:#fff}
.btn{padding:8px 16px;border-radius:3px;border:0;font:700 13px var(--fb);cursor:pointer;background:#eee;color:#222;border:1px solid #ccc}
.btn:hover{opacity:.85}
.btn.p{background:var(--brand-mid);color:#fff;border-color:var(--brand-mid)}
.btn.d{background:#fee2e2;color:#c00;border-color:#fca5a5}
.btn.s{padding:5px 12px;font-size:12px}
dialog#rlm{width:min(440px,94vw);text-align:left}
.in{width:100%;padding:6px 10px;border:1.5px solid #ccc;border-radius:3px;font:13px var(--fb);background:#fff;outline:none}
.in:focus{border-color:var(--pri)}
dialog{margin:auto;padding:24px;border:0;border-radius:4px;width:min(360px,92vw);box-shadow:0 8px 32px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.mtl{font:700 16px var(--ft);text-align:center;margin-bottom:16px}
dialog .in{margin-bottom:8px}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;display:none;z-index:9100}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.12);margin-bottom:16px}
.btn2{padding:9px 18px;border-radius:8px;border:0;font:700 13px var(--fb);cursor:pointer;text-decoration:none;display:inline-block;background:var(--surface2);color:var(--tx)}
.btn2.p{background:var(--brand-mid);color:#fff}
.btn2.p:hover{background:var(--brand)}
.btn2.d{background:#fde8e8;color:#c03030}
.btn2.s{padding:5px 11px;font-size:12px}

/* ===== PokéMart: visual de loja ===== */
.pmh{background:linear-gradient(135deg,var(--brand),var(--brand-mid));color:#fff;padding:22px 12px 20px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.pmht{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pmw{max-width:1100px;margin:0 auto;padding:16px 12px 60px}.pmh .pmw{padding:0}
.pmb{display:flex;flex-direction:column;min-width:150px}.pmb b{font:700 26px var(--font-title);letter-spacing:1px}.pmb span{font:600 12px var(--font-body);opacity:.8}

.pmcart{font-size:18px;padding:8px 14px}.pmcart i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#e53935;font:800 11px/20px var(--font-body);font-style:normal;text-align:center;padding:0 5px}
.pmtl{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.pmtl .pmtabs{flex:1}.pms{width:auto!important;margin:0!important}
.pmtabs{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.pmtabs button{flex:1;border:0;background:none;border-radius:7px;padding:9px 14px;font:800 13px var(--font-body);cursor:pointer;color:var(--text)}.pmtabs button.on{background:var(--brand-mid);color:#fff}
.pmg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.pc{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.1);border:2px solid transparent;transition:transform .15s,box-shadow .15s}
.pc:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.16)}.pc.on{border-color:var(--brand-mid)}
.pci{height:84px;display:flex;align-items:center;justify-content:center;background:var(--s2);border-radius:10px}.pci img{max-width:64px;max-height:64px;object-fit:contain}
.pcc{align-self:flex-start;font:800 10px var(--font-body);text-transform:uppercase;letter-spacing:.5px;color:var(--brand-mid);background:var(--brand-light);padding:2px 8px;border-radius:10px}
.pc h3{font:800 15px var(--font-body);margin:0}.pc p{font:500 12px var(--font-body);color:var(--mu);margin:0;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}.pcf .lp{font:800 17px var(--font-title)}
#pmo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9400;opacity:0;pointer-events:none;transition:opacity .2s}#pmo.open{opacity:1;pointer-events:auto}
#pmc{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--surface);z-index:9500;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;box-shadow:-6px 0 30px rgba(0,0,0,.3)}#pmc.open{transform:none}
.pmch{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--bd);font:700 18px var(--font-title)}.pmch button{border:0;background:none;font-size:18px;cursor:pointer;color:var(--text)}
.pmcb{flex:1;overflow-y:auto;padding:6px 14px}.pmcb h4{font:800 11px var(--font-body);text-transform:uppercase;letter-spacing:.6px;color:var(--mu);margin:12px 0 4px}
.pml{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font:600 13px var(--font-body)}.pml .imi{width:32px;height:32px}.pml .imi img{width:32px;height:32px}.pml small{display:block;color:var(--mu);font-weight:500;font-size:11px}.pmt{min-width:64px;text-align:right}
.pmcf{padding:12px 18px 16px;border-top:1px solid var(--bd);background:var(--s2)}.pmcp{display:flex;gap:6px;margin-bottom:4px}.pmcp .in{margin:0!important;text-transform:uppercase}
.pmcd{background:var(--accent-light);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin-bottom:8px;font:600 12.5px var(--font-body);display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pmcd span{flex:1 1 100%}
.pmk{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px;font:700 12.5px var(--font-body)}.pmkb{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.vchc{display:block;width:max-content;margin-top:4px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;font:700 10.5px var(--font-body);padding:2px 9px;cursor:pointer}.pmkb .vchc{margin:0;font-size:11.5px;padding:3px 10px}.vchc.on{background:var(--accent);color:#fff}
.le2{color:#c03030;font:700 12px var(--font-body);min-height:14px;margin-bottom:6px}
.pmr{display:flex;justify-content:space-between;font:600 13px var(--font-body);padding:3px 0}.pmr.tot{font:800 16px var(--font-body);border-top:1px solid var(--bd);margin-top:4px;padding-top:8px}
.pmcf .suma{display:flex;gap:8px;margin-top:10px}.pmcf .suma .btn{flex:1}.pmcf .suma .btn.p{flex:2}
.cpr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font:600 13px var(--font-body)}.cpr .imn small{display:block;font:500 11px var(--font-body);color:var(--mu)}
.cpf{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.cpf .in{margin:0!important}

/* barra fixa neutra + sprites 24x24 */
.pmh{position:sticky;top:0;z-index:200;background:var(--surface);color:var(--text);padding:10px 12px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.pmb b{color:var(--brand)}.pmb span{color:var(--mu);opacity:1}
.pmq{border:1.5px solid var(--bd)!important;background:var(--fbg)!important;color:var(--text)}
.pmbt{background:var(--s2);color:var(--text)}.pmbt:hover{background:var(--bd)}
.pmcart{background:var(--brand-mid);color:#fff}.pmcart:hover{background:var(--brand)}
.pct{display:flex;align-items:center;gap:8px}.pct h3{flex:1;min-width:0}
.pci{width:24px;height:24px;flex:none;background:none;border-radius:0;display:block}

@media(max-width:768px){.pmh{top:52px}}
.pc{cursor:pointer}.pc .stp,.pc .btn{cursor:auto}.pc .btn{cursor:pointer}
.pmcart{cursor:pointer;min-width:48px;height:42px;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}.pmcart>*{pointer-events:none}.pmcart::after{content:"";position:absolute;inset:-6px}

/* barra colorida de volta; compacta ao rolar */

.pmb b{color:#fff}.pmb span{color:#fff;opacity:.8}
.pmq{border:0!important;background:#fff!important}
.pmbt,.pmcart{background:rgba(255,255,255,.18);color:#fff}.pmbt:hover,.pmcart:hover{background:rgba(255,255,255,.3)}
.pmh.sm{padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}

.tmi small{display:block;font:800 10px var(--font-body);text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:2px}

/* ===== Recycling Machine (embutida na aba Reciclagem; tudo escopado em #rec) ===== */
#rec{--neon:#3ddc6a;--neon-dim:#1f7a3e;--body-light:#eef0f3;--body-mid:#d3d8de;--body-shadow:#aab0b8;--face-dark:#22252b;--face-darker:#101216;--bg-top:#0e2038;--bg-bottom:#2a4a70}
#rec .rec-page{display:flex;flex-direction:column;align-items:center;gap:30px;padding:8px 4px 24px}
#rec .machine-wrap{width:100%;max-width:400px;position:relative}
#rec .machine{border-radius:26px;overflow:hidden;
  background:linear-gradient(150deg,var(--body-light),var(--body-mid) 60%,var(--body-shadow));
  box-shadow:0 34px 60px -20px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.5);
  position:relative;}
#rec .machine-header{position:relative;display:flex;align-items:center;justify-content:center;
  padding:14px 50px 4px;}
#rec .machine-title{text-align:center;width:100%;
  font-family:var(--font-title);font-weight:700;color:var(--brand);
  font-size:14px;letter-spacing:1.2px;}
#rec .machine-title small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:1.6px;font-weight:700;margin-top:2px;text-transform:uppercase}
#rec .recipe-btn-round{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#3a4048,#20242a);color:#eef2f6;
  cursor:pointer;box-shadow:0 3px 0 #101216, 0 6px 10px rgba(0,0,0,.3);
  transition:transform .08s, box-shadow .08s;}
#rec .recipe-btn-round svg{width:16px;height:16px}
#rec .recipe-btn-round:hover{color:var(--accent)}
#rec .recipe-btn-round:active{transform:translateY(calc(-50% + 2px));box-shadow:0 1px 0 #101216, 0 2px 6px rgba(0,0,0,.3)}
#rec .face-dark{margin:12px 12px 0;border-radius:18px 18px 10px 10px;
  background:linear-gradient(155deg,var(--face-dark),var(--face-darker));
  padding:22px 18px 34px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -30px 40px -20px rgba(0,0,0,.5);}
#rec .face-dark::after{content:"";position:absolute;top:14px;right:16px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#8a8f96,#3a3d42);
  box-shadow:0 0 0 2px rgba(255,255,255,.08);}
#rec .face-row{display:flex;align-items:center;gap:16px}
#rec .port-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;padding-top:6px}
#rec .port{width:88px;height:88px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 32%,#3a3f46,#0a0b0d 70%);
  box-shadow:0 0 0 5px var(--face-darker), 0 0 16px 3px rgba(61,220,106,.55), inset 0 4px 10px rgba(0,0,0,.7);
  transition:box-shadow .18s;}
#rec .port::before{content:"";position:absolute;inset:-3px;border-radius:50%;
  border:2.5px solid var(--neon);opacity:.85;
  box-shadow:0 0 10px 2px rgba(61,220,106,.5);}
#rec .port::after{content:"";position:absolute;inset:16px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#1b1d21 0deg 14deg,#0a0b0d 14deg 28deg);
  opacity:.8;}
#rec .port.pulse{animation:portPulse .5s ease}
#rec .port-item-anim{position:absolute;top:50%;left:50%;z-index:5;pointer-events:none;
  transform:translate(-50%,-50%) scale(1.15);opacity:1;
  filter:drop-shadow(0 0 6px rgba(61,220,106,.85));
  animation:portItemSuck .42s ease-in forwards;}
@keyframes portItemSuck{0%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
  55%{transform:translate(-50%,-50%) scale(.9);opacity:1}
  100%{transform:translate(-50%,-50%) scale(.1);opacity:0}}
@keyframes portPulse{0%{box-shadow:0 0 0 5px var(--face-darker), 0 0 16px 3px rgba(61,220,106,.5), inset 0 4px 10px rgba(0,0,0,.7)}
  40%{box-shadow:0 0 0 5px var(--face-darker), 0 0 30px 10px rgba(61,220,106,.9), inset 0 4px 10px rgba(0,0,0,.7)}
  100%{box-shadow:0 0 0 5px var(--face-darker), 0 0 16px 3px rgba(61,220,106,.5), inset 0 4px 10px rgba(0,0,0,.7)}}
#rec .port-label{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;text-align:center}
#rec .screen-frame{flex:1;background:#dfe3e8;border-radius:11px;padding:6px;
  box-shadow:0 3px 10px rgba(0,0,0,.35);}
#rec .screen-green{background:linear-gradient(160deg,#3fbf5f,#2e9e44);
  border-radius:7px 7px 0 0;padding:12px 12px 10px;color:#fff;}
#rec .screen-green .st-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
#rec .screen-green .st{font-size:11.5px;font-weight:800;letter-spacing:.3px}
#rec .screen-green .st-qty{font-family:var(--font-title);font-weight:900;font-size:14px;flex-shrink:0}
#rec .screen-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:2px;min-height:24px}
#rec .screen-chip{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 8px;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;gap:4px;cursor:pointer;}
#rec .screen-chip:hover{background:rgba(255,255,255,.3)}
#rec .screen-white{background:#fff;border-radius:0 0 7px 7px;padding:12px 12px 14px;text-align:center;
  min-height:30px;display:flex;align-items:center;justify-content:center;}
#rec .screen-white span{font-size:12px;font-weight:700;color:var(--text);line-height:1.4}
#rec .screen-white.err span{color:var(--red)}
#rec .screen-white.ok span{color:var(--green)}
#rec .slot-area{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-height:40px}
#rec .slot-bar{width:64%;height:11px;border-radius:6px;
  background:linear-gradient(180deg,#050607,#1a1c20);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.03);
  position:relative;overflow:visible;}
#rec .slot-bar::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:2px;background:var(--neon);opacity:.6;border-radius:2px}
#rec .ticket{background:#fff;border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:9px;
  box-shadow:0 8px 18px rgba(0,0,0,.35);animation:ticketOut .35s ease;
  cursor:pointer;}
#rec .ticket .info b{display:block;font-size:12px;color:var(--text)}
#rec .ticket .info span{font-size:9.5px;color:var(--muted);font-weight:700}
@keyframes ticketOut{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
#rec .face-light{margin:0 12px 12px;padding:16px 18px 18px;border-radius:10px 10px 16px 16px;
  background:linear-gradient(160deg,#f4f6f8,#d8dde3);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
#rec .recycle-logo svg{width:44px;height:44px;display:block}
#rec .lever-btn{font-family:var(--font-title);font-weight:700;font-size:13px;letter-spacing:1.2px;
  color:#fff;background:linear-gradient(180deg,#3ddc6a,#1f7a3e);
  border:none;border-radius:40px;padding:11px 22px;cursor:pointer;
  box-shadow:0 5px 0 #14532b, 0 9px 16px rgba(0,0,0,.3);
  transition:transform .08s, box-shadow .08s;}

#rec .lever-btn:disabled{filter:grayscale(.6) brightness(.85);cursor:not-allowed}
#rec .feet{display:flex;justify-content:space-between;padding:0 34px;margin-top:-4px}
#rec .feet span{width:16px;height:10px;border-radius:0 0 6px 6px;background:linear-gradient(180deg,#3a3d42,#1a1b1d)}
#rec .panel{width:100%;max-width:400px;background:var(--surface);border-radius:16px;
  box-shadow:0 20px 40px -18px rgba(0,0,0,.4);overflow:hidden;
  display:none;}
#rec .panel.is-open{display:block}
#rec .panel-head{padding:14px 16px;font-size:13px;font-weight:800;color:var(--brand);
  border-bottom:1.5px solid var(--border);background:var(--surface2);}
#rec .panel-body{padding:16px}
#rec .inv-strip-section{margin:14px 12px 5px;padding:12px 12px 14px;border-radius:12px;background:var(--surface2)}
#rec .inv-strip-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#rec .inv-strip-title{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted)}
#rec .restock-mini{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);background:var(--surface);
  color:var(--muted);font-size:12px;cursor:pointer;line-height:1;}
#rec .restock-mini:hover{color:var(--brand);border-color:var(--brand-mid)}
#rec .inv-strip-row{display:flex;align-items:center;gap:6px}
#rec .inv-nav-btn{flex-shrink:0;align-self:flex-start;margin-top:15px;padding:0 0 2px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border2);
  background:var(--surface);color:var(--muted);font-size:15px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;}

#rec .inv-strip{flex:1;display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;padding:8px 4px 2px;
  scrollbar-width:none;}

#rec .recipe-card .rin{display:flex;gap:4px;align-items:center}

function renderHamburgerIcon(){

function toggleSidenav(){

}
function openSidenav(){
  const nav=document.getElementById('main-nav');

  nav.classList.add('expanded');
  btn.classList.add('open');

  const nav=document.getElementById('main-nav');

}
function closeNavDrop(){
  document.getElementById('nav-drop-menu')?.classList.remove('open');

}

/* SPRITES — reaproveita os itens que o PokéMart já carregou (ITM, chave nk(nome)); sem sprite cai no chute da PokeAPI e depois no 📦 */
function _itemSlug(nome){
  return String(nome).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function _guessSpriteUrl(nome){
  const it=ITM&&ITM.get(nk(nome));
  return (it&&it.sprite)||('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/'+_itemSlug(nome)+'.png');
}
function itemImg(nome, size){
  const attr = String(nome).replace(/"/g,'&quot;');
  return `<img class="item-spr" data-item="${attr}" src="${_guessSpriteUrl(nome)}" `
       + `style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle" onerror="_sprErr(this)"/>`;
}
window._sprErr=function(el){
  el.onerror = null;
  const size = parseInt(el.style.width)||18;
  const span = document.createElement('span');
  span.className = 'item-spr-fallback';
  span.style.fontSize = Math.round(size*0.85)+'px';
  span.textContent = '📦';
  el.replaceWith(span);
};
function _resolveSprites(){
  document.querySelectorAll('#rec .item-spr[data-item]').forEach(img=>{
    const it = ITM&&ITM.get(nk(img.dataset.item));
    if(it && it.sprite) img.src = it.sprite;
  });
}

/* =========================================================================
   3) ESTADO — estoque = lixo da Bag da ficha atual (F.d.inventario); receitas descobertas = F.d.receitas_descobertas.
   Inserir/devolver na máquina é só visual; a Bag só muda (e salva) no "Reciclar".
   ========================================================================= */
let stock = {};
let discovered = [];
let inserted = {};
let pendingReward = null;
let _busyRec = false;
const MAX_INSERT = 3; // toda receita pede exatamente 3 itens

// itens vinculados não entram (mesma regra da venda no PokéMart)
function bagQtd(id){
  const k = nk(trashById(id).nome);
  return bag().filter(e => !e.vinculado && nk(e.nome) === k).reduce((a,e) => a + (parseInt(e.qtd)||1), 0);
}
function syncFromBag(){
  TRASH_ITEMS.forEach(t => { stock[t.id] = Math.max(0, bagQtd(t.id) - (inserted[t.id]||0)); });
  discovered = Array.isArray(F?.d?.receitas_descobertas) ? F.d.receitas_descobertas : [];
}

/* =========================================================================
   4) RENDER
   ========================================================================= */
function trashById(id){ return TRASH_ITEMS.find(t=>t.id===id); }
function insertedCount(){ return Object.values(inserted).reduce((a,b)=>a+b,0); }
function insertedIds(){ return Object.keys(inserted); }

function renderInventory(){
  const strip = document.getElementById('inv-strip');
  strip.innerHTML = '';
  const withStock = TRASH_ITEMS.filter(t => (stock[t.id]||0) > 0);
  if(!withStock.length){
    strip.innerHTML = '<div class="inv-empty">' + (F ? 'você não tem lixo na Bag' : 'escolha uma ficha para usar a máquina') + '</div>';
    return;
  }
  withStock.forEach(t=>{
    const qty = stock[t.id]||0;
    const full = insertedCount() >= MAX_INSERT;
    const div = document.createElement('div');
    div.className = 'inv-chip' + (full ? ' disabled' : '');
    div.innerHTML = `${itemImg(t.nome,26)}<span class="name">${t.nome}</span><span class="qty">${qty}</span>`;
    if(!full) div.onclick = () => insertItem(t.id);
    strip.appendChild(div);
  });
}

function renderScreen(){
  const ids = insertedIds();
  const total = insertedCount();
  document.getElementById('screen-title').textContent = total ? 'PRONTO PRA RECICLAR' : 'INSIRA O LIXO';

  document.getElementById('screen-qty').textContent = `×${total}`;

  const chips = document.getElementById('screen-chips');
  chips.innerHTML = '';
  ids.forEach(id=>{
    const t = trashById(id);
    const chip = document.createElement('div');
    chip.className = 'screen-chip';
    chip.innerHTML = `${itemImg(t.nome,14)} ${inserted[id]>1 ? '×'+inserted[id] : ''} ✕`;
    chip.onclick = () => removeOne(id);
    chips.appendChild(chip);
  });

  document.getElementById('btn-reciclar').disabled = total === 0 || !F || _busyRec;
}

function setStatus(msg, tone, dim){
  const el = document.getElementById('screen-white');
  el.className = 'screen-white ' + (tone||'idle');
  el.innerHTML = `<span${dim ? ' style="opacity:.5"' : ''}>${msg}</span>`;
}

function renderSlotArea(){
  const area = document.getElementById('slot-area');
  area.innerHTML = '<div class="slot-bar"></div>';
  if(pendingReward){
    const ticket = document.createElement('div');
    ticket.className = 'ticket';
    ticket.innerHTML = `${itemImg(pendingReward.nome,26)}<div class="info"><b>${pendingReward.nome}</b><span>já está na sua Bag · toque pra fechar</span></div>`;
    ticket.onclick = collectReward;
    area.appendChild(ticket);
  }

function renderRecipeBook(){
  const list = document.getElementById('recipe-list');
  list.innerHTML = '';
  RECIPES.forEach(r=>{
    const known = discovered.includes(r.id);
    const card = document.createElement('div');
    card.className = 'recipe-card' + (known ? '' : ' mystery');
    const inputsHtml = Object.entries(r.inputs).map(([id,qty])=>{
      const t = trashById(id);
      return `<span>${t.nome}${qty>1?' ×'+qty:''}</span>`;
    }).join('');
    const outHtml = !known ? '??? · ???'
      : (r.output.special==='gem' ? 'Gem (tipo aleatório)' : r.output.special==='berry' ? 'Berry' : r.output.nome);
    card.innerHTML = `
      <div class="recipe-top">
        <div class="rin">${inputsHtml}</div>
        <div class="rarrow">→</div>
        <div class="rout">${outHtml}</div>
      </div>
      ${known && r.flavor ? `<div class="recipe-flavor">${r.flavor}</div>` : ''}
    `;
    list.appendChild(card);
  });
}

function renderAll(){
  renderInventory();
  renderScreen();
  renderSlotArea();
  renderRecipeBook();
  _resolveSprites();
}

   5) AÇÕES
   ========================================================================= */
function pulsePort(){
  const port = document.getElementById('port');
  port.classList.remove('pulse');
  void port.offsetWidth;
  port.classList.add('pulse');
}

let _portBusy = false;

function playPortInsertAnim(nome, onDone){
  const port = document.getElementById('port');
  const wrap = document.createElement('div');
  wrap.className = 'port-item-anim';
  wrap.innerHTML = itemImg(nome, 40);
  port.appendChild(wrap);
  pulsePort();
  setTimeout(() => {
    wrap.remove();
    onDone();
  }, 380);
}

function insertItem(id){
  if(_portBusy) return;
  if(insertedCount() >= MAX_INSERT) return;
  if((stock[id]||0) <= 0) return;
  const t = trashById(id);
  _portBusy = true;
  playPortInsertAnim(t.nome, () => {
    stock[id]--;
    inserted[id] = (inserted[id]||0) + 1;
    setStatus('item inserido', 'idle', true);
    renderAll();
    _portBusy = false;
  });
}

function removeOne(id){
  if(!inserted[id]) return;
  inserted[id]--;
  if(inserted[id]<=0) delete inserted[id];
  stock[id] = (stock[id]||0) + 1;
  setStatus('item devolvido ao seu lixo', 'idle');
  renderAll();
}

function findMatchingRecipe(){
  return RECIPES.find(r=>{
    const ids = Object.keys(r.inputs);
    const sameIds = ids.length === Object.keys(inserted).length;
    if(!sameIds) return false;
    return ids.every(id => (inserted[id]||0) === r.inputs[id]);
  });
}

// Relê a ficha, tira o lixo da Bag, põe o prêmio e salva tudo de uma vez (mesmo caminho da transação do PokéMart)
async function recSalvar(recipe, ins, nomeFinal){
  const fr = await lerFicha(F.slug);
  if(!fr) throw new Error('Ficha não encontrada.');
  fr.d = fr.d || {};
  const inv = fr.d.inventario = Array.isArray(fr.d.inventario) ? fr.d.inventario : [];
  for(const [id,q] of Object.entries(ins)){
    const t = trashById(id), k = nk(t.nome);
    let r = q;
    for(let i = 0; i < inv.length && r > 0; i++){
      const x = inv[i];
      if(!x || x.vinculado || nk(x.nome) !== k) continue;
      const c = parseInt(x.qtd)||1, m = Math.min(c, r);
      r -= m;
      if(c - m > 0) x.qtd = c - m; else { inv.splice(i,1); i--; }
    }
    if(r > 0) throw new Error('A Bag mudou: você não tem mais ' + q + 'x ' + t.nome + '.');
  }
  const it = ITM && ITM.get(nk(nomeFinal)), nome = it ? it.name : nomeFinal;
  const i = inv.findIndex(x => x && !x.vinculado && nk(x.nome) === nk(nome));
  if(i >= 0) inv[i].qtd = (parseInt(inv[i].qtd)||1) + 1;
  else inv.push({nome, qtd:1, ...(it ? bagOf(it) : {})});
  const dsc = Array.isArray(fr.d.receitas_descobertas) ? fr.d.receitas_descobertas.slice() : [];
  if(!dsc.includes(recipe.id)) dsc.push(recipe.id);
  fr.d.receitas_descobertas = dsc;
  const j = await salvarFicha({slug:fr.slug, nome:fr.nome, foto:fr.foto, banner:fr.banner, thumb:fr.thumb, player_id:fr.player_id, d:fr.d});
  if(j){ fr.foto = j.foto; fr.banner = j.banner; fr.thumb = j.thumb; fr.atualizado_em = j.atualizado_em; }
  F = fr;
  return nome;
}

async function reciclar(){
  if(insertedCount() === 0 || _busyRec || busy) return;
  if(!F){ setStatus('escolha uma ficha', 'err'); return; }
  const recipe = findMatchingRecipe();
  if(!recipe){
    // combinação sem receita: nada é consumido, os itens voltam pro estoque
    inserted = {}; pendingReward = null; syncFromBag();
    setStatus('✕ essa combinação não gera nada... ainda (itens devolvidos)', 'err');
    renderAll();
    return;
  }
  if(!ses?.token){ alert('Para reciclar, entre com a sua conta de player (botão Entrar).'); lg.showModal(); return; }
  let nomeFinal = recipe.output.nome;
  if(recipe.output.special === 'gem'){
    nomeFinal = POKEMON_TYPES[Math.floor(Math.random()*POKEMON_TYPES.length)] + ' Gem';
  } else if(recipe.output.special === 'berry'){
    nomeFinal = randomBerry();
  }
  _busyRec = true; busy = true;
  renderScreen();
  setStatus('processando...', 'idle');
  try{
    const nome = await recSalvar(recipe, {...inserted}, nomeFinal);
    inserted = {}; pendingReward = { nome };
    syncFromBag();
    setStatus(`✓ gerou: ${nome}`, 'ok');
  }catch(e){
    inserted = {}; pendingReward = null;
    try{ const fr = await lerFicha(F.slug); if(fr){ fr.d = fr.d || {}; F = fr; } }catch{}
    syncFromBag();
    setStatus('✕ ' + (e.message || 'erro ao salvar'), 'err');
  }finally{ _busyRec = false; busy = false; }
  // o carrinho do PokéMart pode estar apontando pra itens que acabaram de sair da Bag
  for(const k of Object.keys(CS)){ const o = ownQ(k); if(o <= 0) delete CS[k]; else if(CS[k] > o) CS[k] = o; }
  renderAll();
  drawSum();
}

function collectReward(){
  pendingReward = null;
  renderSlotArea();
  setStatus('insira mais lixo', 'idle');
}

async function refreshBag(){
  if(!F || _busyRec) return;
  try{ const fr = await lerFicha(F.slug); if(fr){ fr.d = fr.d || {}; F = fr; } }
  catch(e){ setStatus('✕ não consegui atualizar a Bag', 'err'); return; }
  inserted = {}; pendingReward = null;
  syncFromBag();
  setStatus('Bag atualizada', 'idle');
  renderAll();
}

function drawSum(){
 if(!$('pmn'))return;
 const t=totais(),nb=Object.keys(CB).length,ns=Object.keys(CS).length,n=nb+ns,un=Object.values(CB).reduce((a,b)=>a+b,0)+Object.values(CS).reduce((a,b)=>a+b,0);
 $('tb-b').className=TAB==='b'?'on':'';$('tb-s').className=TAB==='s'?'on':'';$('tb-r').className=TAB==='r'?'on':'';
 $('pmn').textContent=un>99?'99+':un;$('pmn').style.display=un?'':'none';
 const ln=(k,q,tp)=>{const it=ITM.get(k);if(!it)return'';const u=tp==='b'?+it.price:sellUnit(it);const a=tp==='b'?(VCH[k]||0):0,free=tmvQtd()-vchUsed(),vc=tp==='b'&&isTM(it)&&tmvQtd()>0?(a?`<button type="button" class="vchc on" onclick="vchOff('${esc(k)}')">TM Voucher${a>1?' ×'+a:''} ✕</button>`:'')+(a<q&&free>0?`<button type="button" class="vchc" onclick="vchUse('${esc(k)}')">${a?'+ ':''}Usar TM Voucher (${free})</button>`:''):'';return`<div class="pml" data-t="${tp}" data-k="${esc(k)}"><span class="imi">${it.sprite?`<img src="${esc(it.sprite)}" alt="">`:''}</span><span class="imn">${esc(it.name)}<small>${tp==='b'?'':'+'}${fm(u)} cada</small>${vc}</span><div class="stp"><button type="button" data-a="-">−</button><input type="number" min="0" value="${q}"><button type="button" data-a="+">+</button></div><b class="pmt">${a&&a>=q?'Grátis':fm(u*(q-a))}</b></div>`};
 const bl=Object.entries(CB).map(([k,q])=>ln(k,q,'b')).join(''),sl=Object.entries(CS).map(([k,q])=>ln(k,q,'s')).join('');
 $('pmc').innerHTML=`<div class="pmch"><span>Carrinho${un?` (${un})`:''}</span><button type="button" onclick="toggleCart(false)" aria-label="Fechar">✕</button></div>
 <div class="pmcb">${n?(bl?'<h4>Compras</h4>'+bl:'')+(sl?'<h4>Vendas</h4>'+sl:''):'<div class="lt">Seu carrinho está vazio.</div>'}</div>
 <div class="pmcf">${nb?cupBanner()+`<div class="pmcp"><input class="in" id="cpi" placeholder="Cupom de desconto" autocomplete="off" value="${CUP?esc(CUP.codigo):''}"${CUP?' disabled':''} onkeydown="if(event.key==='Enter')aplicaCupom()">${CUP?'<button type="button" class="btn s" onclick="tiraCupom()">Remover</button>':'<button type="button" class="btn s" onclick="aplicaCupom()">Aplicar</button>'}</div><div class="le2" id="cpe"></div>`:''}
 <div class="pmr"><span>Compras</span><b>${fm(t.c)}</b></div>${t.vd?`<div class="pmr"><span>TM Voucher</span><b class="pos">−${fm(t.vd)}</b></div>`:''}${t.d?`<div class="pmr"><span>${esc(cupLbl())}</span><b class="pos">−${fm(t.d)}</b></div>`:''}<div class="pmr"><span>Vendas</span><b class="pos">+${fm(t.v)}</b></div><div class="pmr"><span>Saldo atual</span><b>${F?fm(saldo()):'—'}</b></div>
 <div class="pmr tot"><span>Saldo final</span><b class="${t.fin<0?'neg':''}">${t.fin<0?'−':''}${fm(t.fin)}</b></div>
 <div class="suma"><button type="button" class="btn s" onclick="limpa()"${n?'':' disabled'}>Limpar</button><button type="button" class="btn p" onclick="finaliza()"${!F||!n||t.fin<0||busy?' disabled':''}>Finalizar</button></div></div>`}
function limpa(){CB={};CS={};CUP=null;VCH={};drawList();drawSum()}

/* histórico (só adm): últimas 30 transações gravadas na própria ficha em d.historico_pokemart */
function openHist(){if(!isAdm())return;if(!F)return toast('Escolha uma ficha');
 let d=$('hsm');if(!d){d=document.createElement('dialog');d.id='hsm';d.style.width='min(520px,94vw)';document.body.appendChild(d)}
 const H=Array.isArray(F.d?.historico_pokemart)?F.d.historico_pokemart:[],ls=a=>a.map(x=>x[1]+'× '+esc(x[0])).join(', ');
 d.innerHTML=`<div class="mtl">Histórico · ${esc(F.nome||'')}</div>${H.length?H.map(h=>{const df=h.d-h.a;return`<div style="padding:8px 0;border-top:1px solid var(--bd);font:500 13px/1.45 var(--font-body)"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(new Date(h.t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}))}</b><b class="${df<0?'neg':'pos'}">${df<0?'−':'+'}${fm(Math.abs(df))}</b></div>${h.b?.length?`<div>Compra: ${ls(h.b)}</div>`:''}${h.s?.length?`<div>Venda: ${ls(h.s)}</div>`:''}${h.vd?`<div>TM Voucher${h.vn>1?' ×'+h.vn:''}: −${fm(h.vd)}</div>`:''}${h.cp?`<div>${esc(h.cn||'Cupom')}: −${fm(h.cp)}</div>`:''}<small style="color:var(--muted)">Saldo ${fm(h.a)} → ${fm(h.d)}</small></div>`}).join(''):'<div class="lt" style="padding:16px">Nenhuma transação registrada.</div>'}<div class="mb"><button type="button" class="btn s" onclick="hsm.close()">Fechar</button></div>`;d.showModal()}
/* cupons */
async function aplicaCupom(){const e=$('cpe'),c=$('cpi').value.trim().toUpperCase();if(!c)return;e.textContent='';
 try{const r=await irpc('pokemart_cupom_check',{p_codigo:c});if(!r||!r.codigo)throw new Error('Cupom inválido ou expirado.');CUP=r;toast('Cupom aplicado');drawSum()}catch(x){e.textContent=x.message}}
function tiraCupom(){CUP=null;drawSum()}
const irpcL=(n,b)=>fetch(IU+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:IK,Authorization:'Bearer '+IK,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||'HTTP '+r.status);return j||[]});
let CPL=[];
async function openCup(){let d=$('cpm');if(!d){d=document.createElement('dialog');d.id='cpm';d.style.width='min(520px,94vw)';document.body.appendChild(d)}
 d.innerHTML='<div class="mtl">Cupons</div><div class="lt">Carregando...</div>';d.showModal();await drawCup()}
async function drawCup(err){const d=$('cpm');
 try{CPL=await irpcL('pokemart_cupom_listar',{p_admin:ses.nome})}catch(e){err=err||e.message;CPL=[]}
 d.innerHTML=`<div class="mtl">Cupons</div>${CPL.length?CPL.map((c,i)=>`<div class="cpr"><span class="imn"><b>${esc(c.codigo)}</b> · ${c.tipo==='pct'?c.valor+'% OFF':fm(c.valor)+' OFF'}<small>${c.usos}${c.usos_max?'/'+c.usos_max:''} usos${c.expira_em?' · até '+esc(c.expira_em):''}</small></span><button type="button" class="btn s" onclick="cupSave(${i},true)">${c.ativo?'Ativo':'Inativo'}</button><button type="button" class="btn s" onclick="cupDel(${i})" aria-label="Excluir">🗑</button></div>`).join(''):'<div class="lt" style="padding:16px">Nenhum cupom criado.</div>'}
 <div class="cpf"><input class="in" id="cc" placeholder="CÓDIGO" autocomplete="off" style="text-transform:uppercase"><select class="in" id="ct"><option value="pct">Porcentagem (%)</option><option value="fixo">Valor fixo (C$)</option></select><input class="in" id="cv" type="number" min="1" placeholder="Valor"><input class="in" id="cx" type="number" min="1" placeholder="Limite de usos (opcional)"><input class="in" id="ce" type="date" style="grid-column:1/-1"></div>
 <div class="le2" id="cer">${esc(err||'')}</div><div class="mb"><button type="button" class="btn s" onclick="cpm.close()">Fechar</button><button type="button" class="btn p s" onclick="cupSave()">Criar cupom</button></div>`}
async function cupSave(i,tg){let c;
 if(tg){const o=CPL[i];c={p_codigo:o.codigo,p_tipo:o.tipo,p_valor:o.valor,p_expira:o.expira_em||null,p_usos_max:o.usos_max||null,p_ativo:!o.ativo}}
 else{const cd=$('cc').value.trim().toUpperCase().replace(/\s+/g,''),v=parseInt($('cv').value)||0;if(!cd||v<1)return drawCup('Informe código e valor.');if($('ct').value==='pct'&&v>100)return drawCup('Porcentagem máxima: 100.');
  c={p_codigo:cd,p_tipo:$('ct').value,p_valor:v,p_expira:$('ce').value||null,p_usos_max:parseInt($('cx').value)||null,p_ativo:true}}
 try{await irpcL('pokemart_cupom_salvar',{p_admin:ses.nome,...c});await drawCup()}catch(e){drawCup(e.message)}}
async function cupDel(i){if(!confirm('Excluir o cupom '+CPL[i].codigo+'?'))return;try{await irpcL('pokemart_cupom_excluir',{p_admin:ses.nome,p_codigo:CPL[i].codigo});await drawCup()}catch(e){drawCup(e.message)}}

/* modal de confirmação (itens, valores e saldo final); resolve true/false */
function confirmaTx(t){return new Promise(res=>{
 const d=$('cfm');if(d.open)return res(false);
 const row=(tp,k,q)=>{const it=ITM.get(k);if(!it)return'';const u=tp==='b'?+it.price:sellUnit(it);
  return`<div class="cfl"><span class="imi">${it.sprite?`<img src="${esc(it.sprite)}" alt="">`:''}</span><span class="cfn">${esc(it.name)}<small>${q}x · ${tp==='b'?'':'+'}${fm(u)} cada</small></span><span class="cftag ${tp}">${tp==='b'?'Compra':'Venda'}</span><b class="cfv ${tp==='b'?'neg':'pos'}">${tp==='b'?'−':'+'}${fm(u*q)}</b></div>`};
 $('cfl').innerHTML=Object.entries(CB).map(([k,q])=>row('b',k,q)).join('')+Object.entries(CS).map(([k,q])=>row('s',k,q)).join('');
 $('cfp').textContent=F?.nome?'Ficha: '+F.nome:'';
 const r=(l,v,c='')=>`<div class="cfr ${c}"><span>${l}</span><b>${v}</b></div>`;
 $('cft').innerHTML=r('Saldo atual',fm(saldo()))+(t.c?r('Compras','−'+fm(t.c)):'')+(t.vd?r('TM Voucher','+'+fm(t.vd)):'')+(t.d&&CUP?r(esc(cupLbl()),'+'+fm(t.d)):'')+(t.v?r('Vendas','+'+fm(t.v)):'')+r('Saldo final',fm(t.fin),'fin');
 d.returnValue='';d.addEventListener('close',()=>res(d.returnValue==='ok'),{once:true});d.showModal()})}

/* transação: relê a ficha, aplica compras/vendas e salva de uma vez */
async function finaliza(){
 if(busy||!F)return;const nb=Object.keys(CB).length,ns=Object.keys(CS).length;if(!nb&&!ns)return;
 const t=totais();if(t.fin<0)return toast('Saldo insuficiente');
 if(!ses?.token){alert('Para concluir, entre com a sua conta de player (botão Entrar).');lg.showModal();return}
 if(!await confirmaTx(t))return;
 busy=true;drawSum();
 try{
  const fr=await lerFicha(F.slug);if(!fr)throw new Error('Ficha não encontrada.');fr.d=fr.d||{};
  const inv=fr.d.inventario=Array.isArray(fr.d.inventario)?fr.d.inventario:[];
  const sal=dig(fr.d.dinheiro);let ganho=0,gasto=0;
  for(const[k,q]of Object.entries(CS)){const it=ITM.get(k),i=inv.findIndex(x=>x&&nk(x.nome)===k),cur=i<0?0:(parseInt(inv[i].qtd)||1);
   if(i>=0&&inv[i].vinculado)throw new Error((it?.name||k)+' é um item vinculado e não pode ser vendido.');
   if(dcNk(k))throw new Error('O Discount Coupon não pode ser vendido na PokéMart.');
   if(!it||sellUnit(it)<=0||cur<q)throw new Error('A Bag mudou: você não tem mais '+q+'x '+(it?.name||k)+'.');
   if(cur-q>0)inv[i].qtd=cur-q;else inv.splice(i,1);ganho+=sellUnit(it)*q}
  for(const[k,q]of Object.entries(CB)){const it=ITM.get(k);if(!isMart(it))throw new Error('Item indisponível na PokéMart: '+k);
   const i=inv.findIndex(x=>x&&nk(x.nome)===k);if(i>=0)inv[i].qtd=(parseInt(inv[i].qtd)||1)+q;else inv.push({nome:it.name,qtd:q,...bagOf(it)});gasto+=+it.price*q}
  let vd=0,vn=0;for(const[k,u]of Object.entries(VCH)){const it=ITM.get(k),m=Math.min(u,CB[k]||0);if(it&&m>0){vd+=+it.price*m;vn+=m}}
  if(vn>0){let r=vn;for(let i=0;i<inv.length&&r>0;i++){const x=inv[i];if(!x||nk(x.nome)!=='tmvoucher')continue;const q=parseInt(x.qtd)||1,m=Math.min(q,r);r-=m;if(q-m>0)x.qtd=q-m;else{inv.splice(i,1);i--}}if(r>0)throw new Error('O TM Voucher não está mais na Bag.');gasto-=vd}
  const dsc=cupDesc(gasto);gasto-=dsc;
  if(dsc>0&&CUP&&CUP.item){const i=inv.findIndex(x=>x&&dcNk(x.nome)&&dcPct(x)===CUP.valor);if(i<0)throw new Error('O Discount Coupon de '+CUP.valor+'% não está mais na Bag.');const q=parseInt(inv[i].qtd)||1;if(q>1)inv[i].qtd=q-1;else inv.splice(i,1)}
  if(sal+ganho-gasto<0)throw new Error('Saldo insuficiente (o dinheiro da ficha mudou).');
  {const h=Array.isArray(fr.d.historico_pokemart)?fr.d.historico_pokemart:[],nm=k=>ITM.get(k)?.name||k;
   h.unshift({t:new Date().toISOString(),b:Object.entries(CB).map(([k,q])=>[nm(k),q,+ITM.get(k)?.price||0]),s:Object.entries(CS).map(([k,q])=>[nm(k),q,ITM.get(k)?sellUnit(ITM.get(k)):0]),vd,vn,cp:dsc,cn:dsc>0&&CUP?CUP.codigo:'',a:sal,d:sal+ganho-gasto});
   fr.d.historico_pokemart=h.slice(0,30)}
  fr.d.dinheiro=fnum(sal+ganho-gasto);
  const j=await salvarFicha({slug:fr.slug,nome:fr.nome,foto:fr.foto,banner:fr.banner,thumb:fr.thumb,player_id:fr.player_id,d:fr.d});
  if(j){fr.foto=j.foto;fr.banner=j.banner;fr.thumb=j.thumb;fr.atualizado_em=j.atualizado_em}
  if(dsc>0&&CUP&&!CUP.item)try{await irpc('pokemart_cupom_usar',{p_codigo:CUP.codigo})}catch{}
  F=fr;CB={};CS={};CUP=null;VCH={};busy=false;toast('Transação concluída');toggleCart(false);render()
 }catch(e){busy=false;alert(e.message);try{await pick(F.slug)}catch{}}}

function pmSc(){const h=document.querySelector('.pmh');if(!h)return;const y=scrollY;if(y>90)h.classList.add('sm');else if(y<15)h.classList.remove('sm')}
addEventListener('scroll',pmSc,{passive:true});
addEventListener('popstate',()=>boot());
renderHamburgerIcon();
idxSync().finally(boot);
</script>
</body>
