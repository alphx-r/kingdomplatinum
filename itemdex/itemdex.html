<style>
:root{
  --brand:#1a3a5c;--brand-mid:#2563a8;--brand-light:#e8f0fb;
  --accent:#e8a020;--accent-light:#fdf3dc;
  --surface:#fff;--surface2:#f0f3f8;
  --border:#dde3ee;--text:#1a1f2e;--muted:#6b7a99;
  --green:#2a7a2a;--red:#c0392b;

  /* ── tokens do tema "smartwatch" (mesmo do DataDex/NationalDex/MoveDex/AbilityDex) ── */
  --deep:#050c18;--panel:#0c1a2c;--panel2:#0f2138;
  --cyan:#3fe8ff;--cyan-dim:rgba(63,232,255,.35);
  --magenta:#ff3fa0;--magenta-dim:rgba(255,63,160,.3);
  --line:rgba(63,232,255,.14);
  --ink:#cfe4f5;--ink-dim:#7b93ad;

  --r:12px;--font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif;--font-mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%}
body{min-height:100vh;font-family:var(--font-body);color:var(--ink)}

html{
  background-image:
    radial-gradient(ellipse 900px 500px at 8% -5%, rgba(63,232,255,.10), transparent 60%),
    radial-gradient(ellipse 700px 600px at 100% 30%, rgba(255,63,160,.08), transparent 60%),
    repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 42px);
  background-color:var(--deep);
  background-attachment:fixed;
}

/* ══════════════ HERO ══════════════ */
.hero{position:relative;padding:40px 24px 30px;text-align:center;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:inline-flex;align-items:center;gap:8px}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan))}
.hero-eyebrow::after{background:linear-gradient(90deg,var(--cyan),transparent)}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px 2px var(--cyan-dim);animation:pulse-dot 1.8s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.hero-title{font-family:var(--font-title);font-size:36px;font-weight:900;color:#fff;letter-spacing:3px;margin-bottom:8px;text-shadow:0 0 18px rgba(63,232,255,.35),0 2px 20px rgba(0,0,0,.4)}
.hero-title span{color:var(--cyan)}
.hero-sub{font-size:12px;color:var(--ink-dim);font-family:var(--font-mono);letter-spacing:1.5px;text-transform:uppercase}
.hero-scan{width:min(420px,80%);height:2px;margin:18px auto 0;position:relative;background:linear-gradient(90deg,transparent,var(--line),transparent);overflow:hidden;border-radius:2px}
.hero-scan::after{content:'';position:absolute;top:0;left:-30%;width:30%;height:100%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 2.6s linear infinite}
@keyframes scan{from{left:-30%}to{left:100%}}

/* ══════════════ SEARCH / FILTER BAR ══════════════ */
.dex-wrap{max-width:1200px;margin:0 auto;padding:28px 24px 60px}
.search-bar{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sinput-wrap{position:relative;flex:1;min-width:200px}
.sinput-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-dim);pointer-events:none}
#search{width:100%;padding:9px 12px 9px 38px;border-radius:20px;border:1.5px solid var(--line);background:rgba(5,12,24,.5);font-family:var(--font-body);font-size:13px;color:var(--ink);outline:none;transition:border .2s}
#search:focus{border-color:var(--cyan)}
#search::placeholder{color:var(--ink-dim)}
.mfilter{padding:9px 14px;border-radius:8px;border:1.5px solid var(--line);background:rgba(5,12,24,.5);font-family:var(--font-body);font-size:13px;color:var(--ink);outline:none;cursor:pointer}
.mfilter option{background:var(--panel);color:var(--ink)}
.mfilter:focus{border-color:var(--cyan)}
.cpill{background:rgba(63,232,255,.08);border:1px solid var(--cyan-dim);border-radius:20px;padding:5px 16px;font-family:var(--font-mono);font-size:11px;color:var(--cyan);font-weight:700;white-space:nowrap;margin-left:auto;letter-spacing:.5px}

/* ══════════════ GRID DE ITENS ══════════════ */
.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.item-card{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1.5px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;
  animation:fadeUp .3s both;transition:all .25s;position:relative;
}
.item-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,var(--cyan-dim),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.item-card:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 8px 24px rgba(63,232,255,.14)}
.item-header{background:linear-gradient(160deg,#4b5563,#333c48);border-bottom:1.5px solid var(--line);padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.item-icon-box{width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.item-icon{object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.item-icon-fallback{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.5}
.item-name{font-family:var(--font-title);font-weight:700;font-size:13px;color:#fff;letter-spacing:.3px;text-transform:uppercase;text-align:center}
.item-body{background:#fff;padding:12px 14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.item-cat{font-family:var(--font-mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--cyan)}
.item-desc{font-size:12px;color:#333;line-height:1.55;text-align:justify}
.mv-dash{color:#999;font-family:var(--font-mono)}

.empty-msg{padding:60px 20px;text-align:center;color:var(--ink-dim);font-family:var(--font-mono);font-size:12px;grid-column:1/-1}
.spinner-wrap{padding:60px 20px;text-align:center;grid-column:1/-1}
.spinner{width:34px;height:34px;border:3px solid rgba(63,232,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-text{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:600px){.sinput-wrap{flex:1 1 100%}.mfilter{flex:1 1 auto;min-width:0}.cpill{flex:1 1 100%;width:100%;box-sizing:border-box;text-align:center;margin-left:0}.item-grid{grid-template-columns:1fr;gap:12px}}
@media(max-width:500px){.hero-title{font-size:28px}.dex-wrap{padding:16px 12px 40px}}
</style>

<script>
(function () {
  if (window.KPNav) return;
  var IDX = false, AUTO = true, ADMURL = '/datadex/itemdex/adm', legacyBox = false;
  var g = function (id) { return document.getElementById(id); };
  var ICO_MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>';
  var ICO_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
  var ICO_PAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5.5"/><line x1="7" y1="10.5" x2="7" y2="14.5"/><line x1="5" y1="12.5" x2="9" y2="12.5"/><circle cx="16" cy="10.5" r="1" fill="currentColor" stroke="none"/><circle cx="18.2" cy="13.5" r="1" fill="currentColor" stroke="none"/></svg>';
/* ── atalho "Editar · ADM/MOD": só aparece com o switch ligado e acompanha o switch ao vivo ── */
  function syncAdm() {
    var a = g('kp-adm-link'); if (!a) return;
    var A = window.KPAdm, ok = !!(A && A.pode());
    a.style.display = ok ? '' : 'none';
    var l = g('kp-adm-lab'); if (l && A) l.textContent = 'Editar · ' + (A.papel() === 'mod' ? 'MOD' : 'ADM');
  }
  function ligarAdm() {
    syncAdm();
    if (window.KPAdm) { KPAdm.onChange(syncAdm); if (KPAdm.ready && KPAdm.ready.then) KPAdm.ready.then(syncAdm); }
  }
  if (ADMURL) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ligarAdm); else ligarAdm(); }

  /* ── badge automático (páginas sem login próprio): o nome vem da sessão do player ── */
  function badgeAuto() {
    var b = g('nav-player-badge'), n = g('nav-player-name'), ic = g('nav-player-ico'); if (!b || !n) return;
    var nome = '';   /* reconhece localStorage e sessionStorage; Fichário (kp_ficha_sessao) e login do index (player_session) */
    ['kp_ficha_sessao', 'player_session'].some(function (k) { return [localStorage, sessionStorage].some(function (S) { try { var s = JSON.parse(S.getItem(k)); if (s && s.nome) { nome = s.nome; return true; } } catch (e) {} return false; }); });
    if (nome) { if (n.textContent !== nome) n.textContent = nome; if (ic && !ic.firstChild) ic.innerHTML = ICO_PAD; b.style.display = 'flex'; }
    else { b.style.display = 'none'; }
  }
  if (AUTO && !legacyBox) {
    badgeAuto();
    window.addEventListener('storage', function (e) { if (e.key === 'kp_ficha_sessao' || e.key === 'player_session') badgeAuto(); });
  }

  /* index: mostra o badge na hora com o login salvo (player_session), sem esperar a rede; a página corrige depois (mostrarBadgePlayer) */
  if (IDX && !legacyBox) {
    var bn = g('nav-player-name'), bb = g('nav-player-badge'), bi = g('nav-player-ico');
    [localStorage, sessionStorage].some(function (S) { try { var s = JSON.parse(S.getItem('player_session')); if (s && s.nome && bn && bb) { if (!bn.textContent || bn.textContent === '—') bn.textContent = s.nome; if (bi && !bi.firstChild) bi.innerHTML = ICO_PAD; bb.style.display = 'flex'; return true; } } catch (e) {} return false; });
  }

  /* ── abrir/fechar o menu: reserva — se a página definir as dela (declaradas depois), as da página prevalecem ── */
  window.renderHamburgerIcon = window.renderHamburgerIcon || function () {
    var b = g('nav-hamburger'), n = g('main-nav'); if (!b) return;
    b.innerHTML = n && n.classList.contains('expanded') ? ICO_CLOSE : ICO_MENU;
  };
  window.openSidenav = window.openSidenav || function () {
    var n = g('main-nav'), b = g('nav-hamburger'), o = g('nav-overlay');
    if (n) n.classList.add('expanded'); if (b) b.classList.add('open');
    document.body.classList.add('nav-expanded'); if (o) o.classList.add('open'); window.renderHamburgerIcon();
  };
  window.closeSidenav = window.closeSidenav || function () {
    var n = g('main-nav'), b = g('nav-hamburger'), o = g('nav-overlay');
    if (n) n.classList.remove('expanded'); if (b) b.classList.remove('open');
    document.body.classList.remove('nav-expanded'); if (o) o.classList.remove('open');
    var m = g('nav-drop-menu'), d = g('nav-drop-btn'); if (m) m.classList.remove('open'); if (d) d.classList.remove('open');
    window.renderHamburgerIcon();
  };
  window.toggleSidenav = window.toggleSidenav || function () {
    var n = g('main-nav'); if (n && n.classList.contains('expanded')) window.closeSidenav(); else window.openSidenav();
  };
  window.closeSidenavMobile = window.closeSidenavMobile || function () { window.closeSidenav(); };
  window.toggleNavDrop = window.toggleNavDrop || function (e) {
    e.stopPropagation();
    var nav = g('main-nav');
    if (nav && !nav.classList.contains('expanded') && typeof window.openSidenav === 'function') window.openSidenav();
    var m = g('nav-drop-menu'), b = g('nav-drop-btn');
    var open = m.classList.toggle('open');
    b.classList.toggle('open', open);
    if (open) document.addEventListener('click', window.closeNavDrop, { once: true });
  };
  window.closeNavDrop = window.closeNavDrop || function () {
    var m = g('nav-drop-menu'), b = g('nav-drop-btn');
    if (m) m.classList.remove('open');
    if (b) b.classList.remove('open');
  };

  /* ── botões Entrar e ✕ (usam as funções da própria página) ── */
  window.KPNav = {
    entrar: function () {
      if (typeof window.closeSidenav === 'function') window.closeSidenav();
      if (typeof window.navEntrar === 'function') return window.navEntrar();
      var d = g('lg'); if (d && d.showModal) return d.showModal();
      var ov = g('player-login-overlay'); if (ov) ov.style.display = 'flex';
    },
    sair: function () {
      var f = window.sair || window.fazerLogoutPlayer || window.logout;
      if (typeof f === 'function') return f();
      if (AUTO) { ['kp_ficha_sessao', 'player_session'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} try { sessionStorage.removeItem(k); } catch (e) {} }); location.reload(); }
    }
  };

  /* clique no badge do player (ADM/MOD) abre o /adm; o switch e o ✕ têm o próprio clique */
  var bdg = g('nav-player-badge');
  if (bdg) bdg.addEventListener('click', function (e) {
    if (e.target.closest('.kp-sw, .player-logout-btn')) return;
    if (window.KPAdm && KPAdm.isStaff()) location.href = '/adm';
  });
})();
</script>

<script>
const SUPA_URL='https://vnccljhhexlsthjaaorr.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZuY2NsamhoZXhsc3RoamFhb3JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTI5NjEsImV4cCI6MjEwMDg2ODk2MX0.XtKUKNMq7MG_NAQo74nbIsvJCKFE-qhH4_AxULF7M1k';
const SH={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};

async function sbFetchAllPages(url,headers,pageSize=1000){
  let all=[],from=0;
  while(true){
    const sep=url.includes('?')?'&':'?';
    const res=await fetch(`${url}${sep}limit=${pageSize}&offset=${from}`,{headers});
    if(!res.ok) break;
    const chunk=await res.json();
    all=all.concat(chunk);
    if(chunk.length<pageSize) break;
    from+=pageSize;
  }
  return all;
}

let ALL=[];
let SIZE_FAMILIES=new Set();

// Remove o prefixo de tamanho do nome pra achar o "item base" (ex: "Big
// Nugget" e "Small Nugget" -> "nugget").
function stripSizePrefix(name){
  return (name||'').trim().replace(/^(small|big)\s+/i,'').toLowerCase();
}

// Só faz sentido diferenciar visualmente um "Big X" ou "Small X" quando existe
// de fato outra variante de tamanho do mesmo item nos dados (ex: Nugget /
// Small Nugget / Big Nugget). Itens isolados como "Big Root" ou "Small
// Bouquet" — que não têm um "Root" ou "Bouquet" normal cadastrado — não têm
// com o que comparar, então ficam no tamanho padrão.
function computeSizeFamilies(items){
  const groups={};
  items.forEach(it=>{
    const base=stripSizePrefix(it.name);
    const full=(it.name||'').trim().toLowerCase();
    (groups[base]=groups[base]||new Set()).add(full);
  });
  return new Set(Object.keys(groups).filter(base=>groups[base].size>1));
}

// Tamanho dos ícones: todos 24x24, exceto Small Pearl/Small Nugget (18x18) e Big Pearl/Big Nugget (30x30).
function itemIconPx(name){
  const n=(name||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(n==='small pearl'||n==='small nugget') return 18;
  if(n==='big pearl'||n==='big nugget') return 30;
  return 24;
}

// Ícones de itens servidos pelo jsDelivr (a partir do GitHub) em vez de irem
// dentro de cada deploy da Vercel. Só caminhos que começam com
// "sprites/items/" (com ou sem "/" inicial) são redirecionados; qualquer outra
// URL (Supabase, externa) passa sem alteração. Se o CDN falhar, o onerror tenta
// uma vez o caminho original (data-o) antes de cair no ícone de mochila.
function itemSrc(p){
  return kpAsset(p||'');
}
// Cadeia de tentativas: kpfichas_db -> (legado) kingdomplatinum -> caminho original (Vercel) -> 🎒
function itemChain(o){
  const m=/^\/?sprites\/items\/(.*)$/.exec(o||'');
  return m?[DB_RAW+'sprites/items/'+m[1],...(KP_LEGACY?[OLD_RAW+'sprites/items/'+m[1]]:[]),o]:[o];
}
function itemImgErr(img){
  const chain=itemChain(img.dataset.o),i=(+img.dataset.i||0)+1;
  if(i<chain.length){img.dataset.i=i;img.src=chain[i];return}
  img.replaceWith(Object.assign(document.createElement('div'),{className:'item-icon-fallback',textContent:'🎒'}));
}

function cardHtml(it){
  const iconSize=itemIconPx(it.name);
  const icon = it.sprite
    ? `<div class="item-icon-box"><img class="item-icon" src="${itemSrc(it.sprite)}" data-o="${it.sprite}" alt="${it.name}" loading="lazy" style="width:${iconSize}px;height:${iconSize}px" data-kpb="1" onerror="itemImgErr(this)"></div>`
    : `<div class="item-icon-box"><div class="item-icon-fallback">🎒</div></div>`;
  const isConsumivel = !!it.flags?.consumivel?.enabled;
  const isEvento = !!it.flags?.evento?.enabled;
  const rawDesc = it.item_desc || '';
  const trimmedDesc = rawDesc.trim();
  const startsWithConsumivel = /^consumível\b/i.test(trimmedDesc);
  const startsWithEvento = /^evento\b/i.test(trimmedDesc);
  let desc;
  if (startsWithConsumivel) {
    // O texto já vem com "CONSUMÍVEL" digitado no início (inserido pelo painel
    // admin) — deixa só essa palavra em negrito preto, com ponto colado, e
    // mantém o resto normal.
    const rest = trimmedDesc.slice('consumível'.length).replace(/^[\s.—-]+/, '');
    desc = `<b style="color:#000">CONSUMÍVEL.</b>${rest ? ' ' + rest : ''}`;
  } else if (startsWithEvento) {
    // Mesmo esquema, mas pro prefixo "EVENTO" (itens só obtidos em eventos,
    // ex: Strange Ball, Glass Ball).
    const rest = trimmedDesc.slice('evento'.length).replace(/^[\s.—-]+/, '');
    desc = `<b style="color:#000">EVENTO.</b>${rest ? ' ' + rest : ''}`;
  } else if (isConsumivel) {
    // Item legado com a flag marcada mas sem o texto literal na descrição.
    desc = `<b style="color:#000">CONSUMÍVEL.</b>${rawDesc ? ' ' + rawDesc : ''}`;
  } else if (isEvento) {
    desc = `<b style="color:#000">EVENTO.</b>${rawDesc ? ' ' + rawDesc : ''}`;
  } else {
    desc = rawDesc || '<span class="mv-dash">—</span>';
  }
  return `<div class="item-card">
    <div class="item-header">${icon}<span class="item-name">${it.name||''}</span></div>
    <div class="item-body">
      <span class="item-desc">${desc}</span>
    </div>
  </div>`;
}

function render(){
  const grid=document.getElementById('grid');
  const q=document.getElementById('search').value.trim().toLowerCase();
  const fCat=document.getElementById('f-cat').value;

  let list=ALL.filter(it=>{
    if(q){
      const hay=`${it.name||''} ${it.item_desc||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(fCat && it.category!==fCat) return false;
    return true;
  });

  list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  document.getElementById('count-pill').textContent=`${list.length} de ${ALL.length} itens`;
  grid.innerHTML = list.length ? list.map(cardHtml).join('') : `<div class="empty-msg">Nenhum item encontrado.</div>`;
}
function applyFilters(){ render(); }

function populateCatFilter(){
  const sel=document.getElementById('f-cat');
  const cats=[...new Set(ALL.map(it=>it.category).filter(Boolean))].sort();
  sel.innerHTML='<option value="">Todas categorias</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

// Fonte oficial: items.json em /datadex/itemdex/items.json (mesmo
// padrão do abilities.json e moves.json). Supabase só como fallback,
// já que o egress do projeto pode estourar a cota gratuita.
async function loadItemsJson(){
  const d=await dbJson('itemdex/items.json','/datadex/itemdex/items.json');
  if(!Array.isArray(d)) throw new Error('items.json não encontrado');
  return d;
}

async function init(){
  let usedFallback=false;
  try{
    ALL=await loadItemsJson();
    if(!ALL.length) throw new Error('empty items.json result');
  }catch(jsonErr){
    console.warn('items.json falhou, tentando fallback via Supabase…', jsonErr);
    try{
      ALL=await sbFetchAllPages(`${SUPA_URL}/rest/v1/items?select=*`,SH);
      usedFallback=true;
    }catch(e2){
      ALL=[];
    }
  }
  // Conquistas (insígnias, ribbons, pins, premiações) ficam cadastradas aqui
  // com a flag "conquista" — servem só pras fichas, não entram na lista de itens.
  ALL=ALL.filter(it=>!it.flags?.conquista?.enabled);
  document.getElementById('hero-sub').textContent = usedFallback
    ? `${ALL.length} itens catalogados (fonte: Supabase)`
    : `${ALL.length} itens catalogados`;
  SIZE_FAMILIES=computeSizeFamilies(ALL);
  populateCatFilter();
  render();
}
init();

</script>
