<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas ADM | Kingdom Platinum</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1a3a5c;--brand-mid:#2563a8;--accent:#e8a020;--bg:#808080;--surface:#fff;--surface2:#f0f3f8;--border:#dde3ee;--text:#1a1f2e;--muted:#6b7a99;--r:10px;--font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif;--nw:64px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--font-body);color:var(--text);padding-left:var(--nw);transition:padding-left .25s}
.nav{position:fixed;top:0;left:0;height:100vh;width:var(--nw);background:var(--brand);z-index:50;overflow:hidden;transition:width .25s;box-shadow:2px 0 12px rgba(0,0,0,.15)}.nav.open{width:220px}
.nt{display:flex;align-items:center;gap:10px;padding:0 14px;height:58px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.hb{width:36px;height:36px;min-width:36px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;font-size:18px;cursor:pointer}
.logo{font:700 15px var(--font-title);color:#fff;white-space:nowrap;opacity:0;transition:opacity .2s}.logo span{color:var(--accent)}.nav.open .logo{opacity:1}
.nl{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:2px 8px;border-radius:10px;color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.nl:hover{background:rgba(255,255,255,.12);color:#fff}.nl.on{background:rgba(255,255,255,.18);color:#fff}.nl i{font-style:normal;font-size:17px;min-width:20px;text-align:center}.nl b{opacity:0;transition:opacity .15s;font-weight:600}.nav.open .nl b{opacity:1}
.page{padding:28px;max-width:1000px;margin:0 auto}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.12);margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{font:700 22px var(--font-title);color:var(--brand)}
.mu{color:var(--muted);font-size:12px}.acts{display:flex;gap:8px;flex-wrap:wrap}
.in{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font:13px var(--font-body);outline:none;min-width:200px}.in:focus{border-color:var(--brand-mid)}
.btn{padding:9px 18px;border-radius:8px;border:0;font:700 13px var(--font-body);cursor:pointer;text-decoration:none;display:inline-block;background:var(--surface2);color:var(--text)}.btn.p{background:var(--brand-mid);color:#fff}.btn.p:hover{background:var(--brand)}.btn.d{background:#fde8e8;color:#c03030}.btn.s{padding:5px 11px;font-size:12px}
.em{grid-column:1/-1;text-align:center;padding:40px;color:#fff;font-weight:600}
</style></head><body>
<nav class="nav" id="nav"><div class="nt"><button class="hb" onclick="nav.classList.toggle('open')" aria-label="Menu">☰</button><div class="logo">Kingdom <span>Platinum</span></div></div>
<a class="nl" href="/"><i>🎲</i><b>Início</b></a><a class="nl on" href="/fichas"><i>📜</i><b>Fichas</b></a><a class="nl" href="/npcdex"><i>👤</i><b>NPCdex</b></a><a class="nl" href="/datadex"><i>📖</i><b>Datadex</b></a></nav>
<style>table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px;border-bottom:2px solid var(--border)}td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}td img,td .ph{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--surface2);display:block}.sl{font:11px monospace;color:var(--muted)}.ta{display:flex;gap:6px;justify-content:flex-end}@media(max-width:700px){.page{padding:12px}.hide{display:none}}</style>
<div class="page"><div class="card" id="gate" style="max-width:360px;margin:60px auto"><h1 style="font:700 18px var(--font-title);color:var(--brand);margin-bottom:12px">Acesso ADM</h1><div class="acts"><input class="in" id="pw" type="password" placeholder="Senha" style="flex:1" onkeydown="if(event.key==='Enter')login()"><button class="btn p" onclick="login()">Entrar</button></div><div id="ge" class="mu" style="color:#c03030;margin-top:8px"></div></div>
<div id="panel" style="display:none"><div class="card top"><div><h1>Fichas — ADM</h1><div class="mu" id="cnt"></div></div><div class="acts"><input class="in" id="qi" placeholder="Buscar nome, slug ou player..." oninput="draw()"><a class="btn" href="/fichas">Ver lista</a><button class="btn" onclick="sair()">Sair</button></div></div>
<div class="card" style="padding:8px 14px"><table><thead><tr><th></th><th>Personagem</th><th class="hide">Player</th><th class="hide">Atualizada</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></div>
<script>
const U='https://whomhpxzkhsdhsxlccvl.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indob21ocHh6a2hzZGhzeGxjY3ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzcxMzQsImV4cCI6MjEwNjU1MzEzNH0.bgHV3aR3PMSgN6ZvWtC3HICHZWC_xWLmKpY7sf2UFSQ',SK='kp_ficha_sessao',H={apikey:K,Authorization:'Bearer '+K};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=[],ses=null;try{ses=JSON.parse(localStorage.getItem(SK))}catch{}
const adm=()=>!!(ses&&ses.admin);
async function login(){try{const r=await fetch('/api/ficha-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:pw.value})});const j=await r.json().catch(()=>null);if(!r.ok||!j?.token)throw new Error(j?.error||'Senha incorreta.');ses={...j,admin:true};localStorage.setItem(SK,JSON.stringify(ses));init()}catch(e){ge.textContent=e.message}}
function sair(){localStorage.removeItem(SK);location.reload()}
function init(){gate.style.display=adm()?'none':'block';panel.style.display=adm()?'block':'none';if(adm())load()}
async function load(){try{const r=await fetch(U+'/rest/v1/fichas?select=slug,nome,foto,player:d->>player,atualizado_em&order=nome.asc',{headers:H});if(!r.ok)throw 0;L=await r.json()}catch{tb.innerHTML='<tr><td colspan="5">Erro ao carregar.</td></tr>';return}draw()}
function draw(){const q=qi.value.toLowerCase().trim(),l=L.filter(x=>!q||(x.nome+' '+x.slug+' '+(x.player||'')).toLowerCase().includes(q));cnt.textContent=l.length+' ficha(s)';
 tb.innerHTML=l.map(x=>`<tr><td>${x.foto?`<img src="${x.foto}" alt="">`:'<div class="ph"></div>'}</td><td><b>${esc(x.nome)}</b><div class="sl">/${esc(x.slug)}</div></td><td class="hide">${esc(x.player||'—')}</td><td class="hide">${new Date(x.atualizado_em).toLocaleDateString('pt-BR')}</td><td><div class="ta"><a class="btn s" href="/fichas/${encodeURIComponent(x.slug)}">✏️ Editar</a><button class="btn s d" onclick="excluir('${esc(x.slug)}','${esc(x.nome).replace(/'/g,'')}')">Excluir</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="mu">Nenhuma ficha.</td></tr>'}
async function excluir(slug,nome){if(!confirm('Excluir a ficha de '+nome+'? Não dá para desfazer.'))return;try{const r=await fetch(U+'/rest/v1/rpc/ficha_excluir',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({p_token:ses.token,p_slug:slug})});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||'HTTP '+r.status);L=L.filter(x=>x.slug!==slug);draw()}catch(e){alert('Erro ao excluir: '+e.message)}}
init();
</script></body></html>
