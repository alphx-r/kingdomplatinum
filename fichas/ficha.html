<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha | Kingdom Platinum</title>
<!-- vercel.json: { "source": "/fichas/:slug*", "destination": "/fichas/ficha.html" } -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pri:#1a1a1a;--sec:#3a3a3a;--bg:#f4f6fa;--sf:#fff;--s2:#f0f0f0;--tx:#1a1f2e;--mu:#666;--bd:#d0d0d0;--ft:'Cinzel',serif;--fb:'Nunito',sans-serif}
body{background:var(--bg);font-family:var(--fb);color:var(--tx)}
.bar{background:var(--pri);padding:8px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:50;color:#fff;font-size:13px}
.bar a{color:rgba(255,255,255,.7);text-decoration:none;font-weight:600}.bar div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 14px;border:0;border-radius:3px;font:700 12px var(--fb);cursor:pointer;background:#eee;color:#222}.btn.d{background:#fee2e2;color:#c00}.btn:hover{opacity:.85}
.wrap{max-width:1000px;margin:0 auto;padding:16px 12px 60px}
.hd{background:var(--sf);border:1.5px solid var(--bd);border-radius:6px;position:relative;overflow:hidden;display:grid;grid-template-columns:180px 1fr;min-height:200px;margin-bottom:14px}
.ph{background:#ddd;position:relative}.ph img{width:100%;height:100%;object-fit:cover;display:block}.nf{height:100%;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
.mid{padding:22px 26px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.bg{font-size:12px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:1.5px}
.tt{font-family:var(--ft);font-size:29px;font-weight:800}.sl{font-size:14px;color:var(--mu)}
.sr{display:flex;gap:28px;flex-wrap:wrap;position:absolute;left:26px;right:26px;bottom:26px;z-index:4}
.hl{font-size:11px;font-weight:800;color:#9aa0ab;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}.hv{font-size:14px;color:#1a2a4a}
.bn{position:absolute;top:0;right:0;width:58%;height:100%;background:#2a2a2a;clip-path:polygon(0 0,100% 0,100% 100%);z-index:3}.bn img{width:100%;height:100%;object-fit:cover}
.eb{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:3px;font:11px var(--fb);padding:4px 10px;cursor:pointer;z-index:5}.bn .eb{top:8px;bottom:auto;right:10px}
.dg{display:grid;grid-template-columns:repeat(6,1fr);background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;margin-bottom:14px}
.dg>div{padding:12px 14px;border-right:1px solid var(--bd);min-width:0}.dg>div:last-child{border:0}
.fs{margin-bottom:12px;border-radius:6px;overflow:hidden}
.fs h3{background:var(--pri);padding:7px 12px;text-align:center;font:700 15px var(--ft);color:#fff}
.fb{background:var(--sf);border:1.5px solid var(--bg);padding:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tg{display:grid;grid-template-columns:repeat(6,1fr);border:1.5px solid var(--bd);border-radius:0 0 6px 6px;overflow:hidden}
.ps{border-right:1.5px solid var(--bd);display:flex;flex-direction:column;min-width:0}.ps:last-child{border:0}
.ps .im{background:#f5f5f5;height:90px;display:flex;align-items:center;justify-content:center}.ps img{width:70px;height:70px;object-fit:contain;image-rendering:pixelated}
.ps .nm{background:var(--sec);color:#fff;text-align:center;font:700 12px var(--ft);padding:3px 6px;text-transform:uppercase}.ps .lv{font-size:11px;text-align:center;padding:4px;color:var(--mu)}
.ps input{border-radius:0;border-width:0 0 1px}
.in{width:100%;padding:6px 10px;border:1.5px solid #ccc;border-radius:3px;font:13px var(--fb);background:#fff;outline:none}.in:focus{border-color:var(--pri)}
textarea.in{min-height:140px;resize:vertical;line-height:1.6}
.txt{white-space:pre-wrap;font-size:13px;line-height:1.8;text-align:justify}
.row{display:flex;gap:6px;margin-bottom:6px}.li{padding:6px 4px;border-bottom:1px solid var(--bg);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}.li span{color:var(--mu)}
.mu{color:var(--mu);font-size:13px;padding:4px}
h4{font:700 13px var(--ft);margin:10px 0 6px}
dialog{margin:auto;padding:22px;border:0;border-radius:6px;width:min(340px,92vw);box-shadow:0 8px 32px rgba(0,0,0,.3)}dialog .in{margin-bottom:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;display:none;z-index:99}
@media(max-width:700px){.hd{grid-template-columns:1fr;min-height:0}.ph{display:none}.bn{position:relative;width:100%;height:150px;clip-path:none;order:-1}.sr{position:static;margin-top:12px;display:grid;grid-template-columns:1fr 1fr}.dg{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr}.tg{grid-template-columns:repeat(2,1fr)}.tt{font-size:22px}}
</style></head><body>
<div id="bar" class="bar"></div><div class="wrap" id="app"></div><div class="toast" id="tst"></div>
<dialog id="lg"><h4 style="margin-top:0">Entrar com seu perfil</h4>
<input class="in" id="ln" placeholder="Nome do player"><input class="in" id="ls" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')entrar()">
<div id="le" class="mu"></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button type="button" class="btn" onclick="lg.close()">Cancelar</button><button type="button" class="btn" style="background:#111;color:#fff" onclick="entrar()">Entrar</button></div></dialog>
<script>
const U='https://whomhpxzkhsdhsxlccvl.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indob21ocHh6a2hzZGhzeGxjY3ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzcxMzQsImV4cCI6MjEwNjU1MzEzNH0.bgHV3aR3PMSgN6ZvWtC3HICHZWC_xWLmKpY7sf2UFSQ',SK='kp_ficha_sessao';
async function api(p,o={}){const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',...o.headers}});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch{}if(!r.ok)throw new Error(j?.message||'HTTP '+r.status);return j}
const rpc=(n,b)=>api('rpc/'+n,{method:'POST',body:JSON.stringify(b)});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slugify=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let f=null,ed=false,ses=null;try{ses=JSON.parse(localStorage.getItem(SK))}catch{}
const get=p=>p.split('.').reduce((o,k)=>o?.[k],f);
function set(p,v){const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],f)[l]=v}
const S=e=>set(e.dataset.k,e.value);
const T=(p,ph='')=>ed?`<input class="in" data-k="${p}" value="${esc(get(p))}" placeholder="${ph}" oninput="S(this)">`:(esc(get(p))||'—');
const TA=(p,ph)=>ed?`<textarea class="in" data-k="${p}" placeholder="${ph}" oninput="S(this)">${esc(get(p))}</textarea>`:`<div class="txt">${esc(get(p))||'<span class="mu">Nada registrado.</span>'}</div>`;
function add(p){const a=get(p)||[];a.push({});set(p,a);render()}
function del(p,i){get(p).splice(i,1);render()}
function L(p,cols,vazio){const a=get(p)||[];
 const h=a.map((x,i)=>ed?`<div class="row">${cols.map(([k,ph,w])=>`<input class="in" style="flex:${w||1}" data-k="${p}.${i}.${k}" value="${esc(x[k])}" placeholder="${ph}" oninput="S(this)">`).join('')}<button class="btn d" onclick="del('${p}',${i})">✕</button></div>`
  :`<div class="li"><b>${esc(x[cols[0][0]])}</b>${cols.slice(1).map(([k])=>x[k]?`<span>${esc(x[k])}</span>`:'').join('')}</div>`).join('');
 return h+(ed?`<button class="btn" onclick="add('${p}')">+ Adicionar</button>`:(a.length?'':`<div class="mu">${vazio}</div>`))}
const sec=(t,h,pad)=>`<section class="fs"><h3>${t}</h3><div class="fb"${pad===0?' style="padding:0"':''}>${h}</div></section>`;
const SP={};
async function sprite(n){n=(n||'').toLowerCase().trim().replace(/\s+/g,'-');if(!n)return'';if(SP[n]===undefined){try{const r=await fetch('https://pokeapi.co/api/v2/pokemon/'+n);SP[n]=r.ok?(await r.json()).sprites.front_default||'':''}catch{SP[n]=''}}return SP[n]}
const sprites=()=>document.querySelectorAll('img[data-n]').forEach(async i=>{const s=await sprite(i.dataset.n);if(s)i.src=s});
function img(k,max){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);f[k]=c.toDataURL('image/jpeg',.82);render()};im.src=fr.result};fr.readAsDataURL(i.files[0])};i.click()}
function toast(m){tst.textContent=m;tst.style.display='block';setTimeout(()=>tst.style.display='none',2200)}
const dono=()=>f&&ses&&(ses.admin||ses.player_id===f.player_id);
function render(){
 const d=f?.d||{};document.documentElement.style.setProperty('--pri',d.cor_pri||'#1a1a1a');document.documentElement.style.setProperty('--sec',d.cor_sec||'#3a3a3a');
 bar.innerHTML=`<span><a href="/fichas">← Fichas</a>${f?.nome?' / '+esc(f.nome):''}</span><div>`+
  (ed?`<label>Cor <input type="color" value="${d.cor_pri||'#1a1a1a'}" onchange="f.d.cor_pri=this.value;render()"> <input type="color" value="${d.cor_sec||'#3a3a3a'}" onchange="f.d.cor_sec=this.value;render()"></label><button class="btn" onclick="salvar()">💾 Salvar</button><button class="btn" onclick="f.slug?location.reload():history.back()">Cancelar</button>`
   :(dono()?`<button class="btn" onclick="ed=true;render()">✏️ Editar</button><button class="btn d" onclick="excluir()">Excluir</button>`:''))+
  (ses?`<span>${esc(ses.nome)}</span><button class="btn" onclick="localStorage.removeItem(SK);location.reload()">Sair</button>`:`<button class="btn" onclick="lg.showModal()">Entrar</button>`)+`</div>`;
 if(!f){app.innerHTML='';return}
 const n=(d.time||[]).filter(x=>x.nome).length+(d.box||[]).length;
 const slot=(x,i)=>`<div class="ps"><div class="im"><img data-n="${esc(x.nome)}" alt=""></div>`+(ed?`<input class="in" data-k="d.time.${i}.nome" value="${esc(x.nome)}" placeholder="Pokémon" onchange="S(this);render()"><input class="in" data-k="d.time.${i}.apelido" value="${esc(x.apelido)}" placeholder="Apelido" oninput="S(this)"><input class="in" data-k="d.time.${i}.nivel" value="${esc(x.nivel)}" placeholder="Nível" oninput="S(this)">`:`<div class="nm">${esc(x.apelido||x.nome)||'—'}</div><div class="lv">${x.nivel?'Nv. '+esc(x.nivel):''}</div>`)+`</div>`;
 app.innerHTML=`<div class="hd"><div class="ph">${f.foto?`<img src="${f.foto}" alt="">`:'<div class="nf">Sem foto</div>'}${ed?`<button class="eb" onclick="img('foto',500)">Trocar foto</button>`:''}</div>
 <div class="mid"><div class="bg">${T('d.classe','Classe')}</div><div class="tt">${T('nome','Nome')}</div><div class="sl">${T('d.frase','Frase')}</div>
 <div class="sr">${[['Ocupação','ocupacao'],['Idade','idade'],['Equipe','equipe'],['Naturalidade','naturalidade']].map(([l,k])=>`<div><div class="hl">${l}</div><div class="hv">${T('d.'+k)}</div></div>`).join('')}</div></div>
 <div class="bn">${f.banner?`<img src="${f.banner}" alt="">`:''}${ed?`<button class="eb" onclick="img('banner',1000)">Trocar banner</button>`:''}</div></div>
 <div class="dg">${[['PV','pv'],['Ranking','ranking'],['Reputação','reputacao'],['Dinheiro','dinheiro'],['Pontos','pontos']].map(([l,k])=>`<div><div class="hl">${l}</div><div class="hv">${T('d.'+k)}</div></div>`).join('')}<div><div class="hl">Pokémon</div><div class="hv">${n}/12</div></div></div>`+
 sec('Atributos',`<div class="g3">${[['Altura','altura'],['Peso','peso'],['Tipo Físico','tipo_fisico'],['Índole','indole'],['Pontos de Ranking','pts_ranking'],['Pontos de Reputação','pts_reputacao']].map(([l,k])=>`<div><div class="hl">${l}</div><div class="hv">${T('d.'+k)}</div></div>`).join('')}</div>`)+
 sec('Biografia',TA('d.historia','Escreva a história do personagem...'))+
 sec('Time Principal',`<div class="tg">${(d.time||[]).map(slot).join('')}</div>`,0)+
 sec('Box',L('d.box',[['nome','Pokémon',2],['nivel','Nível']],'Box vazia.'))+
 sec('Inventário',L('d.inventario',[['nome','Item',2],['qtd','Qtd'],['bolso','Bolso'],['desc','Descrição',3]],'Inventário vazio.'))+
 sec('Conquistas',`<h4>Insígnias</h4>${L('d.insignias',[['nome','Insígnia',2],['desc','Detalhe',3]],'Nenhuma insígnia.')}<h4>Ribbons</h4>${L('d.ribbons',[['nome','Ribbon',2],['desc','Detalhe',3]],'Nenhum ribbon.')}<h4>Premiações</h4>${L('d.premiacoes',[['nome','Premiação',2],['desc','Detalhe',3]],'Nenhuma premiação.')}`)+
 sec('Habilidades',L('d.habilidades',[['nome','Habilidade',2],['desc','Descrição',3]],'Nenhuma habilidade.'))+
 sec('Relacionados',L('d.relacionados',[['nome','Nome',2],['tipo','Relação',2]],'Nenhuma relação salva.'))+
 sec('Anotações',TA('d.anotacoes','Anotações livres...'));
 sprites()}
async function salvar(){if(!f.nome?.trim())return alert('Informe o nome do personagem.');const slug=f.slug||slugify(f.nome);
 try{await rpc('ficha_salvar',{p_token:ses.token,p_slug:slug,p_nome:f.nome.trim(),p_foto:f.foto||null,p_banner:f.banner||null,p_d:f.d});
  if(!f.slug){location.href='/fichas/'+slug;return}ed=false;render();toast('Ficha salva')}catch(e){alert('Erro ao salvar: '+e.message)}}
async function excluir(){if(!confirm('Excluir esta ficha? Não dá para desfazer.'))return;try{await rpc('ficha_excluir',{p_token:ses.token,p_slug:f.slug});location.href='/fichas'}catch(e){alert('Erro ao excluir: '+e.message)}}
async function entrar(){try{const r=await fetch('/api/ficha-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:ln.value.trim(),senha:ls.value})});const j=await r.json().catch(()=>null);if(!r.ok||!j?.token)throw new Error(j?.error||'Nome ou senha incorretos.');localStorage.setItem(SK,JSON.stringify(j));location.reload()}catch(e){le.textContent=e.message}}
(async()=>{
 const m=location.pathname.match(/\/fichas?\/([^\/]+)/),q=new URLSearchParams(location.search).get('slug'),slug=decodeURIComponent(q||(m&&m[1])||'');
 if(!slug||slug==='nova'){if(!ses){render();lg.showModal();return}f={slug:'',player_id:ses.player_id,nome:'',d:{player:ses.nome}};ed=true}
 else{try{const r=await api('fichas?slug=eq.'+encodeURIComponent(slug));if(!r.length){app.innerHTML='<p class="mu" style="padding:40px">Ficha não encontrada.</p>';render();return}f=r[0]}catch(e){app.innerHTML='<p class="mu" style="padding:40px">Erro: '+esc(e.message)+'</p>';return}}
 f.d=f.d||{};f.d.time=Array.from({length:6},(_,i)=>f.d.time?.[i]||{});render()})();
</script></body></html>
