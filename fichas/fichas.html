<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas | Kingdom Platinum</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1a3a5c;--brand-mid:#2563a8;--accent:#e8a020;--bg:#808080;--surface:#fff;--surface2:#f0f3f8;--border:#dde3ee;--text:#1a1f2e;--muted:#6b7a99;--r:10px;--font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif;--nw:64px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--font-body);color:var(--text);padding-left:var(--nw);transition:padding-left .25s}
.nav{position:fixed;top:0;left:0;height:100vh;width:var(--nw);background:var(--brand);z-index:50;overflow:hidden;transition:width .25s;box-shadow:2px 0 12px rgba(0,0,0,.15)}.nav.open{width:220px}
.nt{display:flex;align-items:center;gap:10px;padding:0 14px;height:58px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.hb{width:36px;height:36px;min-width:36px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;font-size:18px;cursor:pointer}
.logo{font:700 15px var(--font-title);color:#fff;white-space:nowrap;opacity:0;transition:opacity .2s}.logo span{color:var(--accent)}.nav.open .logo{opacity:1}
.nl{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:2px 8px;border-radius:10px;color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.nl:hover{background:rgba(255,255,255,.12);color:#fff}.nl.on{background:rgba(255,255,255,.18);color:#fff}.nl i{font-style:normal;font-size:17px;min-width:20px;text-align:center}.nl b{opacity:0;transition:opacity .15s;font-weight:600}.nav.open .nl b{opacity:1}
.page{padding:28px;max-width:1000px;margin:0 auto}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.12);margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{font:700 22px var(--font-title);color:var(--brand)}
.mu{color:var(--muted);font-size:12px}.acts{display:flex;gap:8px;flex-wrap:wrap}
.in{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font:13px var(--font-body);outline:none;min-width:200px}.in:focus{border-color:var(--brand-mid)}
.btn{padding:9px 18px;border-radius:8px;border:0;font:700 13px var(--font-body);cursor:pointer;text-decoration:none;display:inline-block;background:var(--surface2);color:var(--text)}.btn.p{background:var(--brand-mid);color:#fff}.btn.p:hover{background:var(--brand)}.btn.d{background:#fde8e8;color:#c03030}.btn.s{padding:5px 11px;font-size:12px}
.em{grid-column:1/-1;text-align:center;padding:40px;color:#fff;font-weight:600}
</style></head><body>
<nav class="nav" id="nav"><div class="nt"><button class="hb" onclick="nav.classList.toggle('open')" aria-label="Menu">☰</button><div class="logo">Kingdom <span>Platinum</span></div></div>
<a class="nl" href="/"><i>🎲</i><b>Início</b></a><a class="nl on" href="/fichas"><i>📜</i><b>Fichas</b></a><a class="nl" href="/npcdex"><i>👤</i><b>NPCdex</b></a><a class="nl" href="/datadex"><i>📖</i><b>Datadex</b></a></nav>
<style>.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.fc{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.12);transition:transform .15s}.fc:hover{transform:translateY(-3px)}
.fc img,.fc .ph{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--brand-light,#e8f0fb);border:3px solid var(--accent)}.fc .ph{display:flex;align-items:center;justify-content:center;font:700 30px var(--font-title);color:var(--brand)}
.fn{font:700 14px var(--font-title);text-align:center}.pl{font-size:11px;color:var(--brand-mid);font-weight:700}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.page{padding:16px}}</style>
<div class="page"><div class="card top"><div><h1>Fichas</h1><div class="mu">Personagens dos players</div></div><div class="acts"><input class="in" id="qi" placeholder="Buscar por nome ou player..." oninput="draw()"><a class="btn p" href="/fichas/nova">+ Nova ficha</a></div></div>
<div class="grid" id="grid"><div class="em">Carregando...</div></div></div>
<script>
const U='https://whomhpxzkhsdhsxlccvl.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indob21ocHh6a2hzZGhzeGxjY3ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzcxMzQsImV4cCI6MjEwNjU1MzEzNH0.bgHV3aR3PMSgN6ZvWtC3HICHZWC_xWLmKpY7sf2UFSQ',SK='kp_ficha_sessao',H={apikey:K,Authorization:'Bearer '+K};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=[];
async function load(){try{const r=await fetch(U+'/rest/v1/fichas?select=slug,nome,foto,classe:d->>classe,player:d->>player&order=nome.asc',{headers:H});if(!r.ok)throw 0;L=await r.json()}catch{grid.innerHTML='<div class="em">Erro ao carregar as fichas.</div>';return}draw()}
function draw(){const q=qi.value.toLowerCase().trim(),l=L.filter(x=>!q||(x.nome+' '+(x.player||'')).toLowerCase().includes(q));
 grid.innerHTML=l.length?l.map(x=>`<a class="fc" href="/fichas/${encodeURIComponent(x.slug)}">${x.foto?`<img src="${x.foto}" alt="">`:`<div class="ph">${esc(x.nome[0])}</div>`}<div class="fn">${esc(x.nome)}</div><div class="mu">${esc(x.classe||'')}</div><div class="pl">${x.player?'por '+esc(x.player):''}</div></a>`).join(''):'<div class="em">Nenhuma ficha encontrada.</div>'}
load();
</script></body></html>
