<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPCdex — Kingdom Platinum</title>
<link rel="icon" type="image/x-icon" href="https://64.media.tumblr.com/c429cb57b048b0ba1d90c6451d7c3aa1/8607b48e6654212e-0d/s540x810/c1f9956cc78935a32f53346f3a7a942caa5d1d67.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1a3a5c;--brand-mid:#2563a8;--brand-light:#e8f0fb;
  --accent:#e8a020;--accent-light:#fdf3dc;
  --surface:#fff;--surface2:#f0f3f8;
  --border:#dde3ee;--text:#1a1f2e;--muted:#6b7a99;
  --green:#2a7a2a;--red:#c0392b;
  --deep:#050c18;--panel:#0c1a2c;--panel2:#0f2138;
  --cyan:#3fe8ff;--cyan-dim:rgba(63,232,255,.35);
  --magenta:#ff3fa0;--magenta-dim:rgba(255,63,160,.3);
  --line:rgba(63,232,255,.14);
  --ink:#cfe4f5;--ink-dim:#7b93ad;
  --r:12px;--font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif;--font-mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%}
body{min-height:100vh;font-family:var(--font-body);color:var(--ink)}
html{
  background-image:
    radial-gradient(ellipse 900px 500px at 8% -5%, rgba(63,232,255,.10), transparent 60%),
    radial-gradient(ellipse 700px 600px at 100% 30%, rgba(255,63,160,.08), transparent 60%),
    repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 42px);
  background-color:var(--deep);
  background-attachment:fixed;
}

/* ══════════════ NAV ══════════════ */
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:58px;background:var(--brand);position:sticky;top:0;z-index:9000;border-bottom:1px solid rgba(63,232,255,.18);box-shadow:0 1px 24px rgba(0,0,0,.35)}
.nav-logo{font-family:var(--font-title);font-size:16px;font-weight:700;color:#fff;letter-spacing:1px;display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.nav-logo img{height:35px;object-fit:contain}
.nav-links{display:flex;gap:4px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.nav-link{font-size:13px;font-weight:600;font-family:var(--font-body);padding:7px 18px;border-radius:20px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center}
.nav-link:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-link.active{background:rgba(255,255,255,.18);color:#fff}
.nav-hamburger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:36px;height:36px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;cursor:pointer;padding:0;flex-shrink:0}
.nav-hamburger span{display:block;width:18px;height:2px;background:#fff;border-radius:2px;transition:all .25s}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-hamburger.open span:nth-child(2){opacity:0}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-dropdown{display:none;position:absolute;top:58px;left:0;right:0;background:var(--brand);border-bottom:2px solid rgba(63,232,255,.18);z-index:8999;padding:10px 14px 14px;flex-direction:column;gap:4px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.nav-dropdown.open{display:flex}
.nav-dropdown .nav-link{width:100%;text-align:left;border-radius:8px;padding:10px 14px;font-size:13px}
@media(max-width:768px){.nav-links{display:none}.nav-hamburger{display:flex}}

/* ══════════════ HERO ══════════════ */
.hero{position:relative;padding:56px 24px 30px;text-align:center;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:inline-flex;align-items:center;gap:8px}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan))}
.hero-eyebrow::after{background:linear-gradient(90deg,var(--cyan),transparent)}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px 2px var(--cyan-dim);animation:pulse-dot 1.8s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.hero-title{font-family:var(--font-title);font-size:44px;font-weight:900;color:#fff;letter-spacing:4px;margin-bottom:10px;text-shadow:0 0 18px rgba(63,232,255,.35),0 2px 20px rgba(0,0,0,.4)}
.hero-title span{color:var(--cyan)}
.hero-sub{font-size:12px;color:var(--ink-dim);font-family:var(--font-mono);letter-spacing:1.5px;text-transform:uppercase}
.hero-scan{width:min(420px,80%);height:2px;margin:22px auto 0;position:relative;background:linear-gradient(90deg,transparent,var(--line),transparent);overflow:hidden;border-radius:2px}
.hero-scan::after{content:'';position:absolute;top:0;left:-30%;width:30%;height:100%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 2.6s linear infinite}
@keyframes scan{from{left:-30%}to{left:100%}}

/* ══════════════ TOOLBAR (busca + categorias + admin) ══════════════ */
.toolbar{max-width:1080px;margin:0 auto;padding:26px 24px 0;display:flex;flex-direction:column;gap:14px}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:11px 16px;font-family:var(--font-body);font-size:13px;color:#fff;outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--ink-dim)}
.search-input:focus{border-color:var(--cyan)}
.btn-admin{background:rgba(63,232,255,.08);border:1.5px solid var(--cyan-dim);color:var(--cyan);border-radius:10px;padding:11px 18px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-admin:hover{background:rgba(63,232,255,.16)}
.btn-admin.on{background:rgba(255,63,160,.1);border-color:var(--magenta-dim);color:var(--magenta)}
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap}
.cat-tab{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:8px 16px;border-radius:20px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink-dim);cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-tab:hover{border-color:var(--cyan-dim);color:var(--ink)}
.cat-tab.active{background:linear-gradient(135deg,var(--cyan-dim),transparent);border-color:var(--cyan);color:#fff}

/* ══════════════ CARDS ══════════════ */
.cards-wrap{max-width:1080px;margin:0 auto;padding:28px 24px 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-dim);font-family:var(--font-mono);font-size:13px}
.npc-card{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:22px 8px 22px 8px;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit;transition:all .25s;animation:fadeUp .35s both;overflow:hidden}
.npc-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,var(--cyan-dim),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.npc-card:hover{border-color:var(--cyan);transform:translateY(-4px);box-shadow:0 10px 32px rgba(63,232,255,.16),0 0 0 1px var(--cyan-dim) inset}
.npc-card.inativo{opacity:.45}
.npc-photo-ring{position:relative;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(63,232,255,.08),transparent 70%);flex-shrink:0}
.npc-photo-ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--cyan),var(--magenta),transparent 65%,var(--cyan));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2.5px));animation:spin-ring 5s linear infinite}
@keyframes spin-ring{to{transform:rotate(360deg)}}
.npc-photo{width:66px;height:66px;border-radius:50%;object-fit:cover;z-index:1;background:#0c1a2c}
.npc-photo-placeholder{width:66px;height:66px;border-radius:50%;z-index:1;display:flex;align-items:center;justify-content:center;font-size:24px;background:#0c1a2c}
.npc-name{font-family:var(--font-title);font-size:14px;font-weight:700;color:#fff;letter-spacing:.4px;text-align:center;line-height:1.3}
.npc-cargo{font-size:11px;color:var(--ink-dim);text-align:center;line-height:1.4;min-height:14px}
.npc-badge{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.6px;display:inline-flex;align-items:center;gap:5px;margin-top:auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
  .hero{padding-top:28px;padding-bottom:16px}
  .cards-wrap{grid-template-columns:repeat(2,1fr);padding:14px 16px 48px}
}
@media(max-width:500px){.hero-title{font-size:30px}}
@media(min-width:769px){
  .cards-wrap{grid-template-columns:repeat(4,1fr);gap:20px}
  .npc-card{padding:26px 18px 22px}
}

/* MODAL — criar NPC / login admin */
.modal-overlay{position:fixed;inset:0;background:rgba(2,6,14,.72);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--panel2);border:1.5px solid var(--cyan-dim);border-radius:14px;padding:26px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-title{font-family:var(--font-title);font-size:16px;font-weight:700;color:#fff;margin-bottom:16px;text-align:center}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:10px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-family:var(--font-mono)}
.modal-field input,.modal-field select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;font-family:var(--font-body);font-size:13px;color:#fff;background:var(--panel);outline:none}
.modal-field input:focus,.modal-field select:focus{border-color:var(--cyan)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-btn{padding:8px 18px;border-radius:6px;border:none;font-family:var(--font-body);font-size:12px;font-weight:700;cursor:pointer}
.modal-btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-dim)}
.modal-btn.primary{background:var(--cyan);color:#03121c}
.modal-err{color:var(--magenta);font-size:11px;margin-top:8px;text-align:center;display:none}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="https://kingdomplatinum.vercel.app"><img src="https://64.media.tumblr.com/bb526b9df0c7703d60a3e491a3f2ecf6/25947a08ea9632bf-74/s1280x1920/cff7702dac61e7830b197041196e3f7da571140b.pnj" alt="Kingdom Platinum"></a>
  <div class="nav-links">
    <a class="nav-link" href="/datadex">Home</a>
    <a class="nav-link" href="/datadex/nationaldex">NationalDex</a>
    <a class="nav-link" href="/datadex/movedex">MoveDex</a>
    <a class="nav-link" href="/datadex/abilitydex">AbilityDex</a>
    <a class="nav-link" href="/datadex/itemdex">ItemDex</a>
    <a class="nav-link active" href="/npcdex">NPCdex</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" onclick="toggleMobileMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div class="nav-dropdown" id="nav-dropdown">
  <a class="nav-link" href="/datadex">Home</a>
  <a class="nav-link" href="/datadex/nationaldex">NationalDex</a>
  <a class="nav-link" href="/datadex/movedex">MoveDex</a>
  <a class="nav-link" href="/datadex/abilitydex">AbilityDex</a>
  <a class="nav-link" href="/datadex/itemdex">ItemDex</a>
  <a class="nav-link active" href="/npcdex">NPCdex</a>
</div>

<div class="hero">
  <div class="hero-eyebrow"><span class="hero-dot"></span> Pokétch <span class="hero-dot"></span></div>
  <div class="hero-title">NPC<span>dex</span></div>
  <div class="hero-sub">Fichas dos NPCs de Nendo</div>
  <div class="hero-scan"></div>
</div>

<div class="toolbar">
  <div class="search-row">
    <input class="search-input" id="busca" placeholder="Buscar NPC pelo nome..." oninput="renderCards()">
  </div>
  <div class="cat-tabs" id="cat-tabs"></div>
</div>

<div class="cards-wrap" id="cards-wrap">
  <div class="empty-state">Carregando NPCs...</div>
</div>

<script>
const SUPA_URL='https://fatdzivyqipmcbzaiftc.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhdGR6aXZ5cWlwbWNiemFpZnRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTMyNDAsImV4cCI6MjA5ODQyOTI0MH0.0SRPZt1RYSpEbPQazv7ttHJBZNDOyIax2YRO49bvpmE';

async function api(path,opts={}){
  const isGet=!opts.method||opts.method==='GET';
  const res=await fetch(`${SUPA_URL}/rest/v1/${path}`,{
    headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Content-Type':'application/json','Prefer':'return=representation',...(isGet?{'Range':'0-9999'}:{}),...opts.headers},
    ...opts
  });
  if(res.status===204||opts.method==='DELETE')return[];
  const t=await res.text();
  try{return JSON.parse(t);}catch{return[];}
}
const apiGet=(p,q='')=>api(`${p}?${q}`);

const CATEGORIAS=[
  {val:'',label:'Todos',icon:'📋'},
  {val:'gymleader',label:'Líderes de Ginásio',icon:'🥋'},
  {val:'elitefour',label:'Elite Four',icon:'👑'},
  {val:'liga',label:'Liga',icon:'🏆'},
  {val:'vilao',label:'Vilões',icon:'💀'},
  {val:'aliado',label:'Aliados',icon:'🤝'},
  {val:'comum',label:'NPCs Comuns',icon:'👤'},
];
const CAT_INFO=Object.fromEntries(CATEGORIAS.map(c=>[c.val,c]));
const CAT_COLOR={
  gymleader:{bg:'rgba(63,232,255,.1)',fg:'var(--cyan)',bd:'var(--cyan-dim)'},
  elitefour:{bg:'rgba(255,63,160,.1)',fg:'var(--magenta)',bd:'var(--magenta-dim)'},
  liga:{bg:'rgba(232,160,32,.12)',fg:'var(--accent)',bd:'rgba(232,160,32,.35)'},
  vilao:{bg:'rgba(192,57,43,.14)',fg:'#ff6b5b',bd:'rgba(192,57,43,.4)'},
  aliado:{bg:'rgba(42,122,42,.14)',fg:'#5fd45f',bd:'rgba(42,122,42,.4)'},
  comum:{bg:'rgba(123,147,173,.1)',fg:'var(--ink-dim)',bd:'rgba(123,147,173,.3)'},
};

let todosNpcs=[], categoriaAtiva='';

function toggleMobileMenu(){
  document.getElementById('nav-hamburger').classList.toggle('open');
  document.getElementById('nav-dropdown').classList.toggle('open');
}
document.addEventListener('click',e=>{
  const btn=document.getElementById('nav-hamburger'),drop=document.getElementById('nav-dropdown');
  if(btn&&drop&&!btn.contains(e.target)&&!drop.contains(e.target)){btn.classList.remove('open');drop.classList.remove('open');}
});

function renderTabs(){
  document.getElementById('cat-tabs').innerHTML=CATEGORIAS.map(c=>
    `<button class="cat-tab${categoriaAtiva===c.val?' active':''}" onclick="setCategoria('${c.val}')">${c.icon} ${c.label}</button>`
  ).join('');
}
function setCategoria(v){categoriaAtiva=v;renderTabs();renderCards();}

function renderCards(){
  const q=(document.getElementById('busca').value||'').toLowerCase().trim();
  let lista=todosNpcs.filter(n=>n.ativo!==false);
  if(categoriaAtiva) lista=lista.filter(n=>(n.categoria||'comum')===categoriaAtiva);
  if(q) lista=lista.filter(n=>(n.nome||'').toLowerCase().includes(q)||(n.cargo||'').toLowerCase().includes(q));
  const wrap=document.getElementById('cards-wrap');
  if(!lista.length){
    wrap.innerHTML=`<div class="empty-state">Nenhum NPC encontrado.</div>`;
    return;
  }
  wrap.innerHTML=lista.map((n,i)=>{
    const cat=CAT_INFO[n.categoria]||CAT_INFO.comum;
    const col=CAT_COLOR[n.categoria]||CAT_COLOR.comum;
    const inativo=n.ativo===false;
    return`<a class="npc-card${inativo?' inativo':''}" href="/npcdex/${encodeURIComponent(n.slug)}" style="animation-delay:${Math.min(i*0.03,.4)}s">
      <div class="npc-photo-ring">
        ${n.foto?`<img class="npc-photo" src="${n.foto}" onerror="this.style.display='none'">`:`<div class="npc-photo-placeholder">${cat.icon}</div>`}
      </div>
      <div class="npc-name">${n.nome}</div>
      <div class="npc-cargo">${n.cargo||''}</div>
      <div class="npc-badge" style="background:${col.bg};color:${col.fg};border:1px solid ${col.bd}">${cat.icon} ${cat.label}${inativo?' · inativo':''}</div>
    </a>`;
  }).join('');
}

async function carregarNpcs(){
  try{
    todosNpcs=await apiGet('npcs','order=ordem.asc,nome.asc')||[];
  }catch(e){
    console.error('Erro ao carregar NPCs:',e);
    todosNpcs=[];
  }
  renderTabs();
  renderCards();
}

carregarNpcs();
</script>
</body>
</html>
