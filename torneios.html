<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Torneios | Kingdom Platinum</title>
<link rel="icon" type="image/x-icon" href="https://64.media.tumblr.com/c429cb57b048b0ba1d90c6451d7c3aa1/8607b48e6654212e-0d/s540x810/c1f9956cc78935a32f53346f3a7a942caa5d1d67.png">
<meta name="theme-color" content="#1a3a5c">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#1a3a5c;--brand-mid:#2563a8;--brand-light:#e8f0fb;--accent:#e8a020;--accent-light:#fdf3dc;--bg:#808080;--surface:#fff;--surface2:#f0f3f8;--border:#dde3ee;--border2:#c8d0e0;--text:#1a1f2e;--muted:#6b7a99;--red:#c03030;--green:#1a7a1a;--r:10px;--font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif}
html,body{min-height:100%;background:var(--bg);font-family:var(--font-body);color:var(--text)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:58px;padding:0 20px;background:var(--brand);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.logo{font-family:var(--font-title);font-weight:700;font-size:16px;letter-spacing:1px;color:#fff}.logo span{color:var(--accent)}
.top a{color:rgba(255,255,255,.75);font-size:13px;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:10px}
.top a:hover{background:rgba(255,255,255,.12);color:#fff}
.sp{flex:1}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff}
.tag.on{background:var(--accent);color:var(--brand)}
main{max-width:1240px;margin:0 auto;padding:26px 18px 60px}
h1,h2{font-family:var(--font-title);color:#fff;letter-spacing:.5px}
h1{font-size:26px;margin-bottom:4px}
.sub{color:rgba(255,255,255,.8);font-size:14px;margin-bottom:22px}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.card h3{font-family:var(--font-title);color:var(--brand);font-size:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tc{cursor:pointer;transition:transform .15s,border-color .15s;border-top:3px solid var(--accent)}
.tc:hover{transform:translateY(-2px);border-color:var(--brand-mid)}
.tc b{font-family:var(--font-title);color:var(--brand);font-size:16px;display:block;margin-bottom:6px}
.tc small{color:var(--muted);font-size:12.5px;display:block}
.st{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--brand-light);color:var(--brand-mid)}
.st.f{background:var(--accent-light);color:#a56a00}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.in{padding:9px 12px;border:1.5px solid var(--border2);border-radius:8px;background:#fff;color:var(--text);min-width:0}
.in:focus{outline:2px solid var(--brand-mid);outline-offset:1px}
.btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--brand);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--brand-light)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.p:hover{background:var(--brand-mid)}
.btn.a{background:var(--accent);border-color:var(--accent);color:var(--brand)}
.btn.d{color:var(--red)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:16px 0}
.tab{padding:9px 18px;border-radius:10px;border:none;background:rgba(255,255,255,.18);color:#fff;font-weight:700;cursor:pointer}
.tab.on{background:var(--surface);color:var(--brand)}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--brand-mid);color:#fff;font-weight:700;font-size:13px;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px var(--border2)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bk{display:flex;gap:34px;overflow-x:auto;padding:6px 4px 14px}
.rd{display:flex;flex-direction:column;min-width:230px}
.rd h4{font-family:var(--font-title);color:#fff;font-size:13px;text-align:center;margin-bottom:10px}
.ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.m{position:relative;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);overflow:visible;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.m.ed{cursor:pointer}.m.ed:hover{border-color:var(--accent)}
.m:not(.last)::after{content:"";position:absolute;right:-34px;top:50%;width:34px;border-top:2px solid rgba(255,255,255,.55)}
.sl{display:flex;align-items:center;gap:9px;padding:7px 10px;min-height:44px}
.sl+.sl{border-top:1px solid var(--border)}
.sl .nm{flex:1;font-weight:700;font-size:13.5px;line-height:1.15;min-width:0}
.sl .nm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.sl b{min-width:22px;text-align:right;color:var(--muted)}
.sl.w{background:var(--accent-light)}.sl.w b{color:#a56a00}
.sl.l .nm{color:var(--muted)}
.sl.e{color:var(--muted);font-size:12.5px;font-style:italic}
.champ{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--accent),#f3c560);color:var(--brand);padding:14px 20px;border-radius:var(--r);margin-bottom:14px;font-family:var(--font-title);font-size:18px;font-weight:700}
.champ .av{width:46px;height:46px;font-size:18px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:380px;overflow:auto}
.pi{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:13.5px;font-weight:700}
.pi small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.pi .nm{flex:1;min-width:0}
.pi button{border:none;background:none;cursor:pointer;font-size:18px;color:var(--brand-mid);font-weight:700}
.pi.x button{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--border)}
th{font-family:var(--font-title);color:var(--brand);font-size:12px}
td:nth-child(2),th:nth-child(2){text-align:left}
.rrm{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
dialog{border:none;border-radius:14px;padding:22px;width:min(380px,92vw);margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,20,40,.6)}
dialog h3{font-family:var(--font-title);color:var(--brand);margin-bottom:14px}
.ds{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ds span{flex:1;font-weight:700}.ds input{width:70px;text-align:center}
.msg{color:var(--muted);font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;font-size:13px;z-index:99}
@media(max-width:600px){.top{padding:0 12px}.rd{min-width:210px}h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">PKMN <span>KINGDOM PLATINUM</span></div>
  <a href="/">← Voltar ao site</a>
  <div class="sp"></div>
  <span class="tag" id="mode"></span>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script>
/* ───── Config (mesmos bancos do index.html / fichas.html) ───── */
const SU='https://ucbkodkjlbatttiuqjtv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYmtvZGtqbGJhdHR0aXVxanR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjExODcsImV4cCI6MjA5MzMzNzE4N30.a65MSk7m4DvgTw2pHXhaqMOOEpjTB_wPsXJUfvOGiG4';
const LS='kp_torneios';
const S={list:[],cur:null,chars:[],players:[],online:false,tab:'chave',q:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Edita quem está logado como ADM no site; ?org=1 libera para testes locais */
const canEdit=()=>!!localStorage.getItem('adm_session')||/[?&]org=1/.test(location.search);
const FMT={single:'Eliminatória simples',rr:'Todos contra todos'};

/* tema sazonal igual ao do site */
try{const t=JSON.parse(localStorage.getItem('kp_tema'));if(t){const r=document.documentElement.style;[['--brand','brand'],['--brand-mid','brandMid'],['--accent','accent'],['--bg','bg'],['--surface','surface'],['--text','text']].forEach(([v,k])=>t[k]&&r.setProperty(v,t[k]))}}catch{}

async function api(p,o={}){const r=await fetch(SU+'/rest/v1/'+p,{...o,headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,'Content-Type':'application/json',...o.headers}});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return t?JSON.parse(t):[]}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ───── Dados ───── */
async function boot(){
  const [pl,fi,tr]=await Promise.all([
    api('players?select=id,nome').catch(()=>[]),
    fetch('/api/ficha-salvar?lista=1',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
    api('torneios?select=dados').then(r=>{S.online=true;return r.map(x=>x.dados)}).catch(()=>null)
  ]);
  S.players=pl;
  S.chars=(Array.isArray(fi)?fi:[]).filter(e=>e&&e.slug&&e.nome&&e.desativada!=='true').map(e=>{
    const o=S.players.find(p=>String(p.id)===String(e.player_id));
    return{id:e.slug,nome:e.nome,foto:e.foto||'',cor:/^#[0-9a-f]{3,8}$/i.test(e.cor||'')?e.cor:'',ranking:parseInt(e.ranking,10)||0,player:o?o.nome:(String(e.player_id)==='admin'?'':(e.player||''))}
  });
  if(tr)S.list=tr;else try{S.list=JSON.parse(localStorage.getItem(LS))||[]}catch{S.list=[]}
  const id=location.hash.slice(1);S.cur=S.list.find(t=>t.id===id)||null;
  render();
}
async function persist(t){
  t.at=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S.list))}catch{}
  if(S.online)try{await api('torneios',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:t.id,dados:t})})}catch{toast('Não salvou no servidor (salvo só neste navegador)')}
}
async function remove(t){
  S.list=S.list.filter(x=>x!==t);try{localStorage.setItem(LS,JSON.stringify(S.list))}catch{}
  if(S.online)try{await api('torneios?id=eq.'+encodeURIComponent(t.id),{method:'DELETE'})}catch{}
}

/* ───── Lógica do torneio ───── */
const P=(t,id)=>t.part.find(p=>p.id===id);
function seedOrder(n){let a=[1,2];while(a.length<n)a=a.flatMap(x=>[x,a.length*2+1-x]);return a}
function start(t){
  let ps=[...t.part];
  if(t.seed==='ranking')ps.sort((a,b)=>(b.ranking||0)-(a.ranking||0));
  else if(t.seed==='aleatorio')for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ps[i],ps[j]]=[ps[j],ps[i]]}
  if(t.formato==='rr'){
    t.m=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)t.m.push({a:ps[i].id,b:ps[j].id,sa:null,sb:null});
  }else{
    let size=2;while(size<ps.length)size*=2;
    const slots=seedOrder(size).map(s=>ps[s-1]?.id??null),rounds=[];
    let r0=[];for(let i=0;i<size;i+=2)r0.push({a:slots[i],b:slots[i+1],sa:null,sb:null});
    rounds.push(r0);
    for(let n=size/2;n>1;n/=2)rounds.push(Array.from({length:n/2},()=>({a:null,b:null,sa:null,sb:null})));
    t.m=rounds;sync(t);
  }
  t.status='andamento';
}
function win(m,r){
  if(r===0&&(m.a==null)!==(m.b==null))return m.a??m.b;
  if(m.a==null||m.b==null||m.sa==null||m.sb==null||m.sa===m.sb)return null;
  return m.sa>m.sb?m.a:m.b;
}
function sync(t){
  if(t.formato!=='single')return;
  for(let r=1;r<t.m.length;r++)t.m[r].forEach((m,i)=>{
    const a=win(t.m[r-1][2*i],r-1),b=win(t.m[r-1][2*i+1],r-1);
    if(m.a!==a||m.b!==b){m.a=a;m.b=b;m.sa=m.sb=null}
  });
  const f=t.m[t.m.length-1][0];t.champ=win(f,t.m.length-1);
  t.status=t.champ?'fim':'andamento';
}
function standings(t){
  const s={};t.part.forEach(p=>s[p.id]={p,j:0,v:0,e:0,d:0,pts:0,sg:0});
  t.m.forEach(m=>{if(m.sa==null||m.sb==null)return;const A=s[m.a],B=s[m.b];A.j++;B.j++;A.sg+=m.sa-m.sb;B.sg+=m.sb-m.sa;
    if(m.sa>m.sb){A.v++;B.d++;A.pts+=3}else if(m.sa<m.sb){B.v++;A.d++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}});
  return Object.values(s).sort((x,y)=>y.pts-x.pts||y.sg-x.sg||(y.p.ranking||0)-(x.p.ranking||0));
}
function finishRR(t){t.status=t.m.every(m=>m.sa!=null)?'fim':'andamento';if(t.status==='fim')t.champ=standings(t)[0].p.id}

/* ───── Render ───── */
const av=p=>`<span class="av" style="${p.cor?'background:'+p.cor:''}">${esc((p.nome||'?')[0].toUpperCase())}${p.foto?`<img src="${esc(p.foto)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;
const who=p=>`<span class="nm">${esc(p.nome)}${p.player?`<small>${esc(p.player)}</small>`:''}</span>`;
const stLabel=t=>t.status==='fim'?'Finalizado':t.status==='andamento'?'Em andamento':'Inscrições abertas';

function render(){
  $('#mode').textContent=canEdit()?'Organizador':'Visitante';$('#mode').className='tag'+(canEdit()?' on':'');
  $('#app').innerHTML=S.cur?detail(S.cur):list();
}
function list(){
  const cr=canEdit()?`<div class="card" style="margin-bottom:16px"><h3>Novo torneio</h3><div class="row">
    <input class="in" id="nn" placeholder="Nome do torneio" style="flex:1;min-width:200px">
    <select class="in" id="nf"><option value="single">${FMT.single}</option><option value="rr">${FMT.rr}</option></select>
    <button class="btn p" onclick="criar()">Criar</button></div></div>`:'';
  const cards=S.list.slice().sort((a,b)=>(b.at||0)-(a.at||0)).map(t=>`<div class="card tc" tabindex="0" onclick="abrir('${t.id}')" onkeydown="if(event.key==='Enter')abrir('${t.id}')">
    <b>${esc(t.nome)}</b><small>${FMT[t.formato]}</small><small>${t.part.length} participantes${t.champ?' · Campeão: '+esc(P(t,t.champ)?.nome):''}</small>
    <span class="st ${t.status==='fim'?'f':''}">${stLabel(t)}</span></div>`).join('');
  return`<h1>Torneios</h1><p class="sub">Chaves, inscrições e resultados dos players e personagens do Kingdom Platinum.</p>${cr}
    ${cards?`<div class="grid">${cards}</div>`:'<div class="card">Nenhum torneio criado ainda.</div>'}`;
}
function detail(t){
  const ed=canEdit(),tabs=[['chave',t.formato==='rr'?'Jogos':'Chave'],...(t.formato==='rr'&&t.status!=='inscricao'?[['class','Classificação']]:[]),['part','Participantes']];
  if(t.status==='inscricao'&&S.tab!=='part')S.tab='part';
  const champ=t.champ&&P(t,t.champ)?`<div class="champ">${av(P(t,t.champ))}<div>Campeão: ${esc(P(t,t.champ).nome)}</div></div>`:'';
  let body='';
  if(S.tab==='part')body=parts(t,ed);
  else if(S.tab==='class')body=`<div class="card">${classTable(t)}</div>`;
  else body=t.formato==='rr'?rrGames(t,ed):bracket(t,ed);
  return`<div class="row"><div style="flex:1"><h1>${esc(t.nome)}</h1><p class="sub" style="margin-bottom:0">${FMT[t.formato]} · ${stLabel(t)}</p></div>
    <button class="btn" onclick="voltar()">← Todos os torneios</button>
    ${ed&&t.status!=='inscricao'?'<button class="btn" onclick="reiniciar()">Reabrir inscrições</button>':''}
    ${ed?'<button class="btn d" onclick="excluir()">Excluir</button>':''}</div>
    <div class="tabs">${t.status==='inscricao'?'':tabs.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>${champ}${body}`;
}
function parts(t,ed){
  const open=t.status==='inscricao',ids=new Set(t.part.map(p=>p.id));
  const q=S.q.toLowerCase(),av2=S.chars.filter(c=>!ids.has(c.id)&&(c.nome+' '+c.player).toLowerCase().includes(q));
  const inscritos=t.part.map(p=>`<div class="pi ${open&&ed?'x':''}">${av(p)}${who(p)}${open&&ed?`<button title="Remover" onclick="rm('${esc(p.id)}')">×</button>`:''}</div>`).join('')||'<p class="msg">Ninguém inscrito ainda.</p>';
  let add='';
  if(open&&ed)add=`<div class="card" style="margin-top:14px"><h3>Adicionar personagens</h3>
    <div class="row" style="margin-bottom:12px"><input class="in" id="sq" placeholder="Buscar personagem ou player" value="${esc(S.q)}" oninput="S.q=this.value;buscar()" style="flex:1;min-width:200px">
    <input class="in" id="mn" placeholder="Participante avulso" onkeydown="if(event.key==='Enter')avulso()"><button class="btn" onclick="avulso()">Adicionar</button></div>
    <div class="pl" id="avl">${avList(av2)}</div>
    ${S.chars.length?'':'<p class="msg">Fichas indisponíveis nesta página; adicione participantes avulsos.</p>'}</div>
    <div class="card" style="margin-top:14px"><h3>Iniciar</h3><div class="row"><select class="in" id="sd" onchange="t_seed(this.value)">
    <option value="ranking" ${t.seed==='ranking'?'selected':''}>Seed por ranking da ficha</option><option value="aleatorio" ${t.seed==='aleatorio'?'selected':''}>Sorteio aleatório</option><option value="ordem" ${t.seed==='ordem'?'selected':''}>Ordem de inscrição</option></select>
    <button class="btn a" onclick="iniciar()">Gerar chaves e iniciar</button></div></div>`;
  return`<div class="card"><h3>Inscritos (${t.part.length})</h3><div class="pl">${inscritos}</div></div>${add}`;
}
const avList=l=>l.slice(0,80).map(c=>`<div class="pi">${av(c)}${who(c)}<button title="Adicionar" onclick="add('${esc(c.id)}')">+</button></div>`).join('')||'<p class="msg">Nenhum resultado.</p>';
function bracket(t,ed){
  const n=t.m.length;
  return`<div class="bk">${t.m.map((rd,r)=>`<div class="rd"><h4>${n-r===1?'Final':n-r===2?'Semifinal':n-r===3?'Quartas de final':'Rodada '+(r+1)}</h4><div class="ms">${rd.map((m,i)=>matchBox(t,m,r,i,ed,r===n-1)).join('')}</div></div>`).join('')}</div>`;
}
function matchBox(t,m,r,i,ed,last){
  const w=win(m,r),bye=r===0&&(m.a==null)!==(m.b==null),can=ed&&m.a&&m.b;
  const sl=(id,sc)=>{const p=id&&P(t,id);return p?`<div class="sl ${w&&w===id?'w':w?'l':''}">${av(p)}${who(p)}<b>${sc??''}</b></div>`:`<div class="sl e">${bye?'BYE':'A definir'}</div>`};
  return`<div class="m ${can?'ed':''} ${last?'last':''}" ${can?`tabindex="0" onclick="placar(${r},${i})" onkeydown="if(event.key==='Enter')placar(${r},${i})"`:''}>${sl(m.a,m.sa)}${sl(m.b,m.sb)}</div>`;
}
function rrGames(t,ed){
  return`<div class="rrm">${t.m.map((m,i)=>{const A=P(t,m.a),B=P(t,m.b),w=m.sa==null?null:m.sa>m.sb?m.a:m.sa<m.sb?m.b:'';
    return`<div class="m ${ed?'ed':''}" ${ed?`tabindex="0" onclick="placar(0,${i})" onkeydown="if(event.key==='Enter')placar(0,${i})"`:''}>
    <div class="sl ${w===m.a?'w':''}">${av(A)}${who(A)}<b>${m.sa??''}</b></div><div class="sl ${w===m.b?'w':''}">${av(B)}${who(B)}<b>${m.sb??''}</b></div></div>`}).join('')}</div>`;
}
function classTable(t){
  return`<table><tr><th>#</th><th>Participante</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr>${standings(t).map((s,i)=>`<tr><td>${i+1}</td><td><div class="row" style="flex-wrap:nowrap">${av(s.p)}${who(s.p)}</div></td><td>${s.j}</td><td>${s.v}</td><td>${s.e}</td><td>${s.d}</td><td>${s.sg>0?'+':''}${s.sg}</td><td><b>${s.pts}</b></td></tr>`).join('')}</table>`;
}

/* ───── Ações ───── */
function criar(){
  const nome=$('#nn').value.trim();if(!nome)return toast('Dê um nome ao torneio');
  const t={id:'t'+Date.now().toString(36),nome,formato:$('#nf').value,status:'inscricao',seed:'ranking',part:[],m:[],champ:null,at:Date.now()};
  S.list.push(t);S.cur=t;S.tab='part';location.hash=t.id;persist(t);render();
}
function abrir(id){S.cur=S.list.find(t=>t.id===id);S.tab='chave';S.q='';location.hash=id;render();scrollTo(0,0)}
function voltar(){S.cur=null;history.replaceState(null,'',location.pathname+location.search);render()}
function add(id){const c=S.chars.find(x=>x.id===id);if(!c)return;S.cur.part.push({...c});persist(S.cur);render()}
function avulso(){const v=$('#mn').value.trim();if(!v)return;S.cur.part.push({id:'x'+Date.now().toString(36),nome:v,foto:'',cor:'',ranking:0,player:''});persist(S.cur);render()}
function rm(id){S.cur.part=S.cur.part.filter(p=>p.id!==id);persist(S.cur);render()}
function buscar(){const ids=new Set(S.cur.part.map(p=>p.id)),q=S.q.toLowerCase();$('#avl').innerHTML=avList(S.chars.filter(c=>!ids.has(c.id)&&(c.nome+' '+c.player).toLowerCase().includes(q)))}
function t_seed(v){S.cur.seed=v;persist(S.cur)}
function iniciar(){const t=S.cur;if(t.part.length<2)return toast('Precisa de pelo menos 2 participantes');start(t);S.tab=t.formato==='rr'?'chave':'chave';persist(t);render()}
function reiniciar(){if(!confirm('Reabrir inscrições? Todos os resultados serão apagados.'))return;Object.assign(S.cur,{status:'inscricao',m:[],champ:null});S.tab='part';persist(S.cur);render()}
async function excluir(){if(!confirm('Excluir este torneio?'))return;await remove(S.cur);voltar()}
function placar(r,i){
  const t=S.cur,m=t.m[r][i],A=P(t,m.a),B=P(t,m.b),d=$('#dlg');
  d.innerHTML=`<h3>Lançar resultado</h3>
    <div class="ds">${av(A)}<span>${esc(A.nome)}</span><input class="in" id="sa" type="number" min="0" value="${m.sa??''}"></div>
    <div class="ds">${av(B)}<span>${esc(B.nome)}</span><input class="in" id="sb" type="number" min="0" value="${m.sb??''}"></div>
    <p class="msg" id="em">${t.formato==='single'?'Empates não são permitidos na chave.':''}</p>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn d" onclick="salvarM(${r},${i},true)">Limpar</button><button class="btn" onclick="$('#dlg').close()">Cancelar</button><button class="btn p" onclick="salvarM(${r},${i})">Salvar</button></div>`;
  d.showModal();
}
function salvarM(r,i,clear){
  const t=S.cur,m=t.m[r][i];
  if(clear){m.sa=m.sb=null}else{
    const a=parseInt($('#sa').value,10),b=parseInt($('#sb').value,10);
    if(isNaN(a)||isNaN(b)){$('#em').textContent='Preencha os dois placares.';return}
    if(t.formato==='single'&&a===b){$('#em').textContent='A chave não aceita empate.';return}
    m.sa=a;m.sb=b;
  }
  if(t.formato==='single')sync(t);else finishRR(t);
  $('#dlg').close();persist(t);render();
}
addEventListener('hashchange',()=>{const t=S.list.find(x=>x.id===location.hash.slice(1));if(t!==S.cur){S.cur=t||null;render()}});
boot();
</script>
