<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Torneios | Kingdom Platinum</title>
<link rel="icon" type="image/x-icon" href="https://64.media.tumblr.com/c429cb57b048b0ba1d90c6451d7c3aa1/8607b48e6654212e-0d/s540x810/c1f9956cc78935a32f53346f3a7a942caa5d1d67.png">
<meta name="theme-color" content="#1a3a5c">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#1a3a5c;--brand-mid:#2563a8;--brand-light:#e8f0fb;--accent:#e8a020;--accent-light:#fdf3dc;--bg:#808080;--surface:#fff;--surface2:#f0f3f8;--border:#dde3ee;--border2:#c8d0e0;--text:#1a1f2e;--muted:#6b7a99;--red:#c03030;--green:#1a7a1a;--r:10px;--font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif}
html,body{min-height:100%;background:var(--bg);font-family:var(--font-body);color:var(--text)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,input,select{font:inherit}
:root{--sidenav-w:64px;--sidenav-w-open:220px}
body{padding-left:var(--sidenav-w);transition:padding-left .25s ease}
/* body.nav-expanded não empurra mais o conteúdo — a sidenav sempre sobrepõe (desktop e mobile) */
.nav{display:flex;flex-direction:column;align-items:stretch;padding:0;width:var(--sidenav-w);height:100vh;height:100dvh;background:var(--nav-bg,var(--brand));position:fixed;top:0;left:0;z-index:9000;overflow:hidden;transition:width .25s ease;box-shadow:2px 0 12px rgba(0,0,0,.15)}
.nav.expanded{width:var(--sidenav-w-open);box-shadow:4px 0 24px rgba(0,0,0,.3)}
.nav-top{display:flex;align-items:center;gap:10px;padding:0 14px;height:58px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.nav-hamburger{position:relative;display:flex;justify-content:center;align-items:center;width:36px;height:36px;min-width:36px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;cursor:pointer;padding:0;flex-shrink:0;color:#fff;transition:background .2s,border-color .2s,color .2s}
.nav-hamburger svg{width:18px;height:18px;display:block}
#nav-player-badge.is-admin{border-color:rgba(255,255,255,.3)}
.nav-logo{font-family:var(--font-title);font-size:15px;font-weight:700;color:#fff;letter-spacing:1px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.nav.expanded .nav-logo{opacity:1;transition:opacity .3s ease .1s}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;flex-direction:column;gap:2px;padding:8px;overflow-y:auto;overflow-x:hidden;flex:1}
/* scroll invisível em todo o site (a rolagem continua funcionando) */
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.nav-link{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;font-family:var(--font-body);padding:10px 12px;border-radius:10px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;white-space:nowrap;width:100%;text-align:left;text-decoration:none!important}
.nav-link:hover,.nav-link:visited,.nav-link:active,.nav-link:focus{text-decoration:none!important}
.nav-link:hover{background:rgba(255,255,255,.12);color:#ffffff}
.nav-link.active{background:rgba(255,255,255,.18);color:#fff}
.nav-link .nav-ico{font-size:17px;min-width:20px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-ico svg{width:17px;height:17px;display:block}
.nav-link .nav-label{opacity:0;transition:opacity .15s;overflow:hidden}
.nav.expanded .nav-link .nav-label{opacity:1;transition:opacity .25s ease .08s}
.nav-drop-wrap{position:relative;display:flex;flex-direction:column}
.nav-drop-btn{font-size:13px;font-weight:600;font-family:var(--font-body);padding:10px 12px;border-radius:10px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;width:100%;text-align:left;white-space:nowrap}
.nav-drop-btn:hover,.nav-drop-btn.open,.nav-drop-btn.active{background:rgba(255,255,255,.2);color:#fff}
.nav-drop-btn .nav-ico{font-size:17px;min-width:20px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-drop-btn .nav-label{opacity:0;transition:opacity .15s;overflow:hidden;flex:1}
.nav.expanded .nav-drop-btn .nav-label{opacity:1;transition:opacity .25s ease .08s}
.nav-drop-btn .nav-drop-arrow{font-size:10px;line-height:1;opacity:0;transition:opacity .15s,transform .2s;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px}
.nav.expanded .nav-drop-btn .nav-drop-arrow{opacity:1}
.nav-drop-btn.open .nav-drop-arrow{transform:rotate(180deg)}
.nav-drop-menu{display:none;flex-direction:column;gap:2px;padding:2px 0 2px 14px;margin-top:2px}
.nav-drop-menu.open{display:flex}
.nav-drop-item{font-size:12.5px;font-weight:600;font-family:var(--font-body);padding:9px 12px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,.75);cursor:pointer;transition:all .15s;text-align:left;white-space:nowrap;display:flex;align-items:center;gap:10px}
.nav-drop-item:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-bottom{padding:8px;border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}
.nav-login{font-size:12px;font-weight:700;font-family:var(--font-body);padding:10px 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;width:100%;white-space:nowrap}
.nav-login .nav-ico{font-size:16px;min-width:20px;text-align:center;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-login .nav-label{opacity:0;transition:opacity .15s;overflow:hidden}
.nav.expanded .nav-login .nav-label{opacity:1;transition:opacity .25s ease .08s}
.nav-login:hover{background:var(--accent);border-color:var(--accent)}
.nav-login.active{background:var(--accent);border-color:var(--accent)}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8999}
main{max-width:1100px;margin:0 auto;padding:16px 12px 60px;color:var(--text)}
h1,h2{font-family:var(--font-title);color:var(--brand);letter-spacing:.5px}
.hd{background:var(--surface);border:1.5px solid var(--border);border-radius:6px;padding:18px 22px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.12)}.hd .sub{margin-bottom:0}
h1{font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{text-align:left;padding:12px 14px;border:2px solid var(--border2);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--text)}
.opt b{display:block;font-family:var(--font-title);color:var(--brand);font-size:14px;margin-bottom:2px}.opt small{color:var(--muted);font-size:12px}
.opt.on{border-color:var(--accent);background:var(--accent-light)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}.fl .in{width:100%;font-weight:500;color:var(--text)}
.lk{margin-top:8px;font-size:12.5px;background:var(--brand-light);color:var(--brand);padding:8px 12px;border-radius:8px;word-break:break-all}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pi button.btn{font-size:12px;padding:6px 12px;border:1.5px solid var(--border2);background:var(--surface);color:var(--brand)}
.pi button.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}.pi button.btn.d{color:var(--red)}
.card{background:var(--surface);border-radius:6px;border:1.5px solid var(--border);padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.card{color:var(--text)}.card h3{background:var(--brand);color:#fff;text-align:center;font-family:var(--font-title);font-size:15px;font-weight:700;padding:8px 12px;margin:-18px -18px 14px;border-radius:5px 5px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tc{cursor:pointer;transition:transform .15s,border-color .15s;border-top:3px solid var(--accent)}
.tc:hover{transform:translateY(-2px);border-color:var(--brand-mid)}
.tc b{font-family:var(--font-title);color:var(--brand);font-size:16px;display:block;margin-bottom:6px}
.tc small{color:var(--muted);font-size:12.5px;display:block}
.st{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--brand-light);color:var(--brand-mid)}
.st.f{background:var(--accent-light);color:#a56a00}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.in{padding:9px 12px;border:1.5px solid var(--border2);border-radius:8px;background:#fff;color:var(--text);min-width:0}
.in:focus{outline:2px solid var(--brand-mid);outline-offset:1px}
.btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--brand);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--brand-light)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.p:hover{background:var(--brand-mid)}
.btn.a{background:var(--accent);border-color:var(--accent);color:var(--brand)}
.btn.d{color:var(--red)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;padding:4px;margin:0 0 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;overflow-x:auto}
.tab{flex:1 0 auto;background:none;border:0;border-radius:7px;padding:9px 18px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface2)}
.tab.on{background:var(--brand);color:#fff}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--brand-mid);color:#fff;font-weight:700;font-size:13px;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px var(--border2)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bk{display:flex;gap:34px;overflow-x:auto;padding:6px 4px 14px}
.rd{display:flex;flex-direction:column;min-width:230px}
.rd h4{background:var(--brand);color:#fff;font-family:var(--font-title);font-size:13px;text-align:center;padding:7px 8px;border-radius:6px;margin-bottom:10px}
.ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.m{position:relative;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);overflow:visible;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.m.ed{cursor:pointer}.m.ed:hover{border-color:var(--accent)}
.m:not(.last)::after{content:"";position:absolute;right:-34px;top:50%;width:34px;border-top:2px solid var(--brand-mid)}
.sl{display:flex;align-items:center;gap:9px;padding:7px 10px;min-height:44px}
.sl+.sl{border-top:1px solid var(--border)}
.sl .nm{flex:1;font-weight:700;font-size:13.5px;line-height:1.15;min-width:0}
.sl .nm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.sl b{min-width:22px;text-align:right;color:var(--muted)}
.sl.w{background:var(--accent-light)}.sl.w b{color:#a56a00}
.sl.l .nm{color:var(--muted)}
.sl.e{color:var(--muted);font-size:12.5px;font-style:italic}
.champ{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--accent),#f3c560);color:var(--brand);padding:14px 20px;border-radius:var(--r);margin-bottom:14px;font-family:var(--font-title);font-size:18px;font-weight:700}
.champ .av{width:46px;height:46px;font-size:18px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:380px;overflow:auto}
.pi{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:13.5px;font-weight:700}
.pi small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.pi .nm{flex:1;min-width:0}
.pi button{border:none;background:none;cursor:pointer;font-size:18px;color:var(--brand-mid);font-weight:700}
.pi.x button{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--border)}
th{font-family:var(--font-title);color:var(--brand);font-size:12px}
td:nth-child(2),th:nth-child(2){text-align:left}
.rrm{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
dialog{border:none;border-radius:14px;padding:22px;width:min(380px,92vw);margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,20,40,.6)}
dialog h3{font-family:var(--font-title);color:var(--brand);margin-bottom:14px}
.ds{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ds>span:not(.av){flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}.ds .av{flex:none;width:36px;height:36px}.dn{flex:1;min-width:0}.dn>span{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl{display:flex;gap:6px;margin-top:6px}.wl button{padding:4px 10px;border-radius:99px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--muted);font-weight:700;font-size:12px;cursor:pointer}
.wl button[data-k=v].on{background:var(--green);border-color:var(--green);color:#fff}.wl button[data-k=p].on{background:var(--red);border-color:var(--red);color:#fff}.ds input{width:70px;text-align:center}
.msg{color:var(--muted);font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;font-size:13px;z-index:99}
@media(max-width:600px){main{padding:10px 8px 60px}.hd{padding:14px}.rd{min-width:210px}h1{font-size:21px}}
.pmh{position:sticky;top:0;z-index:200;background:linear-gradient(135deg,var(--brand),var(--brand-mid));color:#fff;padding:22px 12px 20px;box-shadow:0 4px 18px rgba(0,0,0,.18);transition:padding .2s}
.pmw{max-width:1100px;margin:0 auto}
.pmht{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pmb{display:flex;flex-direction:column;min-width:150px;cursor:pointer}.pmb b{font:700 26px var(--font-title);letter-spacing:1px;color:#fff}
.pmq{flex:1;min-width:180px;border:0;border-radius:22px;padding:11px 18px;background:#fff;color:var(--text);font-size:14px}
.pmq:focus{outline:2px solid var(--accent)}
.pmcart{position:relative;border:0;border-radius:22px;min-width:48px;height:42px;padding:0 10px;background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}.pmcart:hover{background:rgba(255,255,255,.3)}
.pmcart.tx{padding:0 16px;gap:8px;font-size:13px;font-weight:700;white-space:nowrap}.pmcart.on{background:var(--accent);color:var(--brand)}
.pmcart:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pmh.sm{padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}.pmh.sm .pmb{min-width:0}.pmh.sm .pmb b{font-size:18px}.pmh.sm .pmq{padding:7px 14px}.pmh.sm .pmcart{height:34px;min-width:40px}
.sh-sub{background:color-mix(in srgb,var(--brand-mid) 20%,transparent)}
.sh-sub>div{max-width:1100px;margin:0 auto;padding:9px 12px;text-align:center;font-weight:700;font-size:13px;color:var(--brand)}
.pmtabs{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.1);margin-bottom:14px;overflow-x:auto}
.pmtabs button{flex:1 0 auto;border:0;background:none;border-radius:7px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap}.pmtabs button.on{background:var(--brand-mid);color:#fff}
@media(max-width:600px){
:root{--sidenav-w:52px}
.pmh{padding:12px 10px 10px}
.pmht{gap:6px;flex-wrap:wrap}
.pmb{flex:1 1 auto;min-width:0;overflow:hidden}
.pmb b{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmq{order:9;flex:1 1 100%;min-width:0;padding:10px 14px;font-size:14px}
.pmcart,.pmcart.tx{min-width:40px;width:40px;height:40px;padding:0;flex:none;gap:0}
.pmcart.tx span{display:none}
.sh-sub>div{padding:7px 10px;font-size:12px}
.pmtabs button{padding:8px 12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ───── Lógica do torneio ───── */
const P=(t,id)=>t.part.find(p=>p.id===id);
function seedOrder(n){let a=[1,2];while(a.length<n)a=a.flatMap(x=>[x,a.length*2+1-x]);return a}
function start(t){
  let ps=[...t.part];
  if(t.seed==='ranking')ps.sort((a,b)=>(b.ranking||0)-(a.ranking||0));
  else if(t.seed==='aleatorio')for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ps[i],ps[j]]=[ps[j],ps[i]]}
  if(t.formato==='rr'){
    t.m=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)t.m.push({a:ps[i].id,b:ps[j].id,sa:null,sb:null});
  }else{
    let size=2;while(size<ps.length)size*=2;
    const slots=seedOrder(size).map(s=>ps[s-1]?.id??null),rounds=[];
    let r0=[];for(let i=0;i<size;i+=2)r0.push({a:slots[i],b:slots[i+1],sa:null,sb:null});
    rounds.push(r0);
    for(let n=size/2;n>1;n/=2)rounds.push(Array.from({length:n/2},()=>({a:null,b:null,sa:null,sb:null})));
    t.m=rounds;sync(t);
  }
  t.status='andamento';
}
function win(m,r){
  if(r===0&&(m.a==null)!==(m.b==null))return m.a??m.b;
  if(m.a==null||m.b==null||m.sa==null||m.sb==null||m.sa===m.sb)return null;
  return m.sa>m.sb?m.a:m.b;
}
function sync(t){
  if(t.formato!=='single')return;
  for(let r=1;r<t.m.length;r++)t.m[r].forEach((m,i)=>{
    const a=win(t.m[r-1][2*i],r-1),b=win(t.m[r-1][2*i+1],r-1);
    if(m.a!==a||m.b!==b){m.a=a;m.b=b;m.sa=m.sb=null}
  });
  const f=t.m[t.m.length-1][0];t.champ=win(f,t.m.length-1);
  t.status=t.champ?'fim':'andamento';
}
function standings(t){
  const s={};t.part.forEach(p=>s[p.id]={p,j:0,v:0,e:0,d:0,pts:0,sg:0});
  t.m.forEach(m=>{if(m.sa==null||m.sb==null)return;const A=s[m.a],B=s[m.b];A.j++;B.j++;A.sg+=m.sa-m.sb;B.sg+=m.sb-m.sa;
    if(m.sa>m.sb){A.v++;B.d++;A.pts+=3}else if(m.sa<m.sb){B.v++;A.d++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}});
  return Object.values(s).sort((x,y)=>y.pts-x.pts||y.sg-x.sg||(y.p.ranking||0)-(x.p.ranking||0));
}
function finishRR(t){t.status=t.m.every(m=>m.sa!=null)?'fim':'andamento';if(t.status==='fim')t.champ=standings(t)[0].p.id}

function cardsHtml(){
  const q=slug(S.hq||'');
  const L=S.list.filter(t=>(S.hf==='t'||t.status===S.hf)&&(!q||slug(t.nome+' '+(t.desc||'')+' '+(t.nomes??(t.part||[]).map(p=>p.nome+' '+(p.player||'')).join(' '))).includes(q)))
    .sort((a,b)=>(b.at||0)-(a.at||0));
  return L.length?L.map(t=>`<div class="card tc" tabindex="0" onclick="abrir('${t.id}')" onkeydown="if(event.key==='Enter')abrir('${t.id}')">
    <b>${esc(t.nome)}</b><small>${FMT[t.formato]}</small><small>${nP(t)}${t.vagas?'/'+t.vagas:''} participantes${t.data?' · '+fmtData(t.data):''}${champNome(t)?' · Campeão: '+esc(champNome(t)):''}</small>
    <span class="st ${t.status==='fim'?'f':''}">${stLabel(t)}</span></div>`).join(''):`<div class="card" style="grid-column:1/-1;text-align:center;color:var(--muted)">${S.list.length?'Nenhum torneio encontrado.':'Nenhum torneio criado ainda.'}</div>`;
}
function drawCards(){const e=$('#cards');if(e)e.innerHTML=cardsHtml()}
function setHF(k){S.hf=k;render()}
function list(){
  const tabs=[['t','Todos'],['i','Inscrições abertas'],['a','Em andamento'],['f','Finalizados']].map(([k,l])=>{const v={i:'inscricao',a:'andamento',f:'fim'}[k]||'t';return`<button type="button" class="${S.hf===v?'on':''}" onclick="setHF('${v}')">${l}</button>`}).join('');
  return`${canEdit()&&S.criando?novoForm():''}<div class="pmtabs">${tabs}</div><div class="grid" id="cards">${cardsHtml()}</div>`;
}
function detail(t){
  const ed=canEdit(),tabs=[['chave',t.formato==='rr'?'Jogos':'Chave'],...(t.formato==='rr'&&t.status!=='inscricao'?[['class','Classificação']]:[]),['part','Participantes']];
  if(t.status==='inscricao'&&S.tab!=='part')S.tab='part';
  const champ=t.champ&&P(t,t.champ)?`<div class="champ">${av(P(t,t.champ))}<div>Campeão: ${esc(P(t,t.champ).nome)}</div></div>`:'';
  let body='';
  if(S.tab==='part')body=parts(t,ed);
  else if(S.tab==='class')body=`<div class="card">${classTable(t)}</div>`;
  else body=t.formato==='rr'?rrGames(t,ed):bracket(t,ed);
  const info=[FMT[t.formato],stLabel(t),t.md>1?'Melhor de '+t.md:'',fmtData(t.data),t.vagas?t.part.length+'/'+t.vagas+' vagas':''].filter(Boolean).join(' · ');
  return`<div class="hd"><div class="row"><div style="flex:1;min-width:220px"><h1>${esc(t.nome)}</h1><p class="sub" style="margin-bottom:0">${esc(info)}</p>${t.desc?`<p class="msg" style="white-space:pre-wrap;margin-top:8px">${esc(t.desc)}</p>`:''}</div>
    <button class="btn" onclick="voltar()">← Todos os torneios</button>
    ${ed&&t.status==='inscricao'?`<button class="btn" onclick="togInsc()">${t.aberta?'Fechar':'Abrir'} inscrições dos players</button>`:''}
    ${ed&&t.status!=='inscricao'?'<button class="btn" onclick="reiniciar()">Reabrir inscrições</button>':''}
    ${ed?'<button class="btn" onclick="renomear()">Renomear</button><button class="btn d" onclick="excluir()">Excluir</button>':''}</div></div>
    ${t.status==='inscricao'?'':`<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>`}${champ}${body}`;
}
function parts(t,ed){
  const open=t.status==='inscricao',ids=new Set(t.part.map(p=>p.id));
  const q=S.q.toLowerCase(),av2=S.chars.filter(c=>!ids.has(c.id)&&(c.nome+' '+c.player).toLowerCase().includes(q));
  const inscritos=t.part.map(p=>`<div class="pi ${open&&ed?'x':''}">${av(p)}${who(p)}${open&&ed?`<button title="Remover" onclick="sair('${esc(p.id)}')">×</button>`:''}</div>`).join('')||'<p class="msg">Ninguém inscrito ainda.</p>';
  let add='';
  if(open&&ed)add=`<div class="card" style="margin-top:14px"><h3>Adicionar personagens</h3>
    <div class="row" style="margin-bottom:12px"><input class="in" id="sq" placeholder="Buscar personagem ou player" value="${esc(S.q)}" oninput="S.q=this.value;buscar()" style="flex:1;min-width:200px">
    <input class="in" id="mn" placeholder="Participante avulso" onkeydown="if(event.key==='Enter')avulso()"><button class="btn" onclick="avulso()">Adicionar</button></div>
    <div class="pl" id="avl">${avList(av2)}</div>
    ${S.chars.length?'':'<p class="msg">Fichas indisponíveis nesta página; adicione participantes avulsos.</p>'}</div>
    <div class="card" style="margin-top:14px"><h3>Iniciar</h3><div class="row"><select class="in" id="sd" onchange="t_seed(this.value)">
    <option value="ranking" ${t.seed==='ranking'?'selected':''}>Seed por ranking da ficha</option><option value="aleatorio" ${t.seed==='aleatorio'?'selected':''}>Sorteio aleatório</option><option value="ordem" ${t.seed==='ordem'?'selected':''}>Ordem de inscrição</option></select>
    <button class="btn a" onclick="iniciar()">Gerar chaves e iniciar</button></div></div>`;
  return`<div class="card"><h3>Inscritos (${t.part.length}${t.vagas?'/'+t.vagas:''})</h3><div class="pl">${inscritos}</div></div>${ed?'':selfCard(t)}${add}`;
}
function selfCard(t){
  if(t.status!=='inscricao')return'';
  const wrap=h=>`<div class="card" style="margin-top:14px"><h3>Inscrição</h3>${h}</div>`;
  if(!t.aberta)return wrap('<p class="msg" style="margin:0">As inscrições deste torneio estão fechadas.</p>');
  const me=S.me;
  if(me&&!S.ses?.token)return wrap('<p class="msg" style="margin:0 0 10px">Sua sessão expirou. Entre no site novamente para se inscrever.</p><a class="btn p" href="/" style="display:inline-block;text-decoration:none">Entrar no site</a>');
  if(!me)return wrap('<p class="msg" style="margin:0 0 10px">Entre com sua conta de player para inscrever seus personagens.</p><a class="btn p" href="/" style="display:inline-block;text-decoration:none">Entrar no site</a>');
  const mine=S.chars.filter(c=>String(c.pid)===String(me.id)),ids=new Set(t.part.map(p=>p.id)),usados=t.part.filter(p=>String(p.pid)===String(me.id)).length,lim=t.porPlayer||1,cheio=t.vagas&&t.part.length>=t.vagas;
  const rows=mine.map(c=>ids.has(c.id)?`<div class="pi">${av(c)}${who(c)}<button class="btn d" onclick="sair('${esc(c.id)}')">Sair</button></div>`:`<div class="pi">${av(c)}${who(c)}<button class="btn p" ${usados>=lim||cheio?'disabled':''} onclick="add('${esc(c.id)}')">Inscrever</button></div>`).join('')||'<p class="msg">Nenhuma ficha encontrada para o seu usuário.</p>';
  return wrap(`<p class="msg" style="margin:0 0 10px">${esc(me.nome)}, você pode inscrever até ${lim} personagem(ns) (${usados}/${lim} usado${usados===1?'':'s'})${cheio?'. Torneio cheio.':'.'}</p><div class="pl">${rows}</div>`);
}
const avList=l=>l.slice(0,80).map(c=>`<div class="pi">${av(c)}${who(c)}<button title="Adicionar" onclick="add('${esc(c.id)}')">+</button></div>`).join('')||'<p class="msg">Nenhum resultado.</p>';
function bracket(t,ed){
  const n=t.m.length;
  return`<div class="bk">${t.m.map((rd,r)=>`<div class="rd"><h4>${n-r===1?'Final':n-r===2?'Semifinal':n-r===3?'Quartas de final':'Rodada '+(r+1)}</h4><div class="ms">${rd.map((m,i)=>matchBox(t,m,r,i,ed,r===n-1)).join('')}</div></div>`).join('')}</div>`;
}
function matchBox(t,m,r,i,ed,last){
  const w=win(m,r),bye=r===0&&(m.a==null)!==(m.b==null),can=ed&&m.a&&m.b;
  const sl=(id,sc)=>{const p=id&&P(t,id);return p?`<div class="sl ${w&&w===id?'w':w?'l':''}">${av(p)}${who(p)}<b>${sc??''}</b></div>`:`<div class="sl e">${bye?'BYE':'A definir'}</div>`};
  return`<div class="m ${can?'ed':''} ${last?'last':''}" ${can?`tabindex="0" onclick="placar(${r},${i})" onkeydown="if(event.key==='Enter')placar(${r},${i})"`:''}>${sl(m.a,m.sa)}${sl(m.b,m.sb)}</div>`;
}
function rrGames(t,ed){
  return`<div class="rrm">${t.m.map((m,i)=>{const A=P(t,m.a),B=P(t,m.b),w=m.sa==null?null:m.sa>m.sb?m.a:m.sa<m.sb?m.b:'';
    return`<div class="m ${ed?'ed':''}" ${ed?`tabindex="0" onclick="placar(0,${i})" onkeydown="if(event.key==='Enter')placar(0,${i})"`:''}>
    <div class="sl ${w===m.a?'w':''}">${av(A)}${who(A)}<b>${m.sa??''}</b></div><div class="sl ${w===m.b?'w':''}">${av(B)}${who(B)}<b>${m.sb??''}</b></div></div>`}).join('')}</div>`;
}
function classTable(t){
  return`<table><tr><th>#</th><th>Participante</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr>${standings(t).map((s,i)=>`<tr><td>${i+1}</td><td><div class="row" style="flex-wrap:nowrap">${av(s.p)}${who(s.p)}</div></td><td>${s.j}</td><td>${s.v}</td><td>${s.e}</td><td>${s.d}</td><td>${s.sg>0?'+':''}${s.sg}</td><td><b>${s.pts}</b></td></tr>`).join('')}</table>`;
}

function novoForm(){
  const o=(k,t,d)=>`<button type="button" class="opt ${S.fmt===k?'on':''}" data-k="${k}" onclick="setFmt('${k}')"><b>${t}</b><small>${d}</small></button>`;
  return`<div class="card"  style="margin-bottom:16px"><h3>Novo torneio</h3>
  <label class="fl">Nome do evento<input class="in" id="nn" placeholder="Ex.: Xmas Cup" oninput="lk()"></label>
  <div class="lk" id="lk"></div>
  <div class="opts" style="margin-top:14px">${o('single','Eliminatória simples','Perdeu, está fora. Byes automáticos.')}${o('rr','Todos contra todos','Cada um enfrenta todos. Vence quem somar mais pontos.')}</div>
  <div class="fg">
   <label class="fl">Data e hora<input class="in" id="nd" type="datetime-local"></label>
   <label class="fl">Vagas (vazio = sem limite)<input class="in" id="nv" type="number" min="2" placeholder="Ilimitado"></label>
   <label class="fl">Personagens por player<input class="in" id="np" type="number" min="1" value="1"></label>
   <label class="fl">Melhor de<select class="in" id="nm"><option value="1">1 partida</option><option value="3">3 partidas</option><option value="5">5 partidas</option></select></label>
   <label class="fl">Seeds<select class="in" id="ns"><option value="ranking">Ranking da ficha</option><option value="aleatorio">Sorteio aleatório</option><option value="ordem">Ordem de inscrição</option></select></label>
  </div>
  <label class="fl">Descrição e regras<textarea class="in" id="ndc" rows="3" placeholder="Regras, premiação, observações..."></textarea></label>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="na" checked> Players podem se inscrever sozinhos</label>
  <div class="row" style="margin-top:14px"><button class="btn p" onclick="criar()">Criar torneio</button><button class="btn" onclick="S.criando=false;render()">Cancelar</button></div></div>`;
}
function setFmt(k){S.fmt=k;document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',b.dataset.k===k))}
function lk(){const e=$('#lk');if(e)e.textContent='Link: '+location.href.split('#')[0].split('?')[0]+'#'+(slug($('#nn')?.value||'')||'nomedoevento')}

/* ───── Ações ───── */
async function criar(){
  const nome=$('#nn').value.trim();if(!nome)return toast('Dê um nome ao evento');
  const n=parseInt($('#nv').value,10);
  const t={id:uid(nome),nome,formato:S.fmt,status:'inscricao',seed:$('#ns').value,desc:$('#ndc').value.trim(),data:$('#nd').value,vagas:n>1?n:0,porPlayer:Math.max(1,parseInt($('#np').value,10)||1),md:parseInt($('#nm').value,10),aberta:$('#na').checked,part:[],m:[],champ:null,at:Date.now()};
  try{await persist(t,{novo:true})}catch(e){return toast(e.message)}
  S.cur=t;S.criando=false;S.tab='part';location.hash=t.id;render();
}
async function renomear(){
  const t=S.cur,n=prompt('Novo nome do torneio:',t.nome);if(!n||!n.trim())return;
  const old=t.id;
  try{if(S.online){const f=await loadFull(old);if(f)setCur(f)}t.nome=n.trim();t.id=uid(t.nome,old);await persist(t,{de:old});S.list=S.list.filter(x=>x.id!==old)}
  catch(e){t.id=old;return toast(e.message)}
  location.hash=t.id;render();
}
function togInsc(){mut(t=>{t.aberta=!t.aberta})}
async function abrir(id){
  const t=await loadFull(id);if(!t)return toast('Torneio não encontrado.');
  S.cur=t;S.tab='chave';S.q='';location.hash=id;render();scrollTo(0,0);
}
function voltar(){S.cur=null;S.criando=false;history.replaceState(null,'',location.pathname+location.search);render();scrollTo(0,0)}
function togPreview(){S.preview=!S.preview;S.criando=false;try{sessionStorage.setItem('kp_preview',S.preview?'1':'')}catch{}hubKey='';render();toast(S.preview?'Modo player ativado':'Modo organizador')}
function novo(){if(!canEdit())return;S.cur=null;history.replaceState(null,'',location.pathname+location.search);S.criando=!S.criando;render();scrollTo(0,0);if(S.criando)$('#nn')?.focus()}
function gerenciar(){
  const d=$('#dlg');
  d.innerHTML=`<h3>Gerenciar torneios</h3><p class="msg" style="margin:0 0 14px">${S.online?'Torneios salvos no GitHub (data/torneios).':'API indisponível: salvando só neste navegador.'}</p>
  <div class="row" style="flex-direction:column;align-items:stretch"><button class="btn" onclick="exportar()">Exportar backup (JSON)</button>
  <label class="btn" style="text-align:center">Importar backup<input type="file" accept=".json,application/json" hidden onchange="importar(this.files[0])"></label>
  <button class="btn" onclick="recarregar()">Recarregar do servidor</button><button class="btn" onclick="$('#dlg').close()">Fechar</button></div>`;
  d.showModal();
}
async function exportar(){
  const L=S.online?(await Promise.all(S.list.map(x=>loadFull(x.id)))).filter(Boolean):S.list;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,2)],{type:'application/json'}));a.download='torneios.json';a.click();
}
async function importar(file){
  if(!file)return;
  try{const L=JSON.parse(await file.text());if(!Array.isArray(L))throw 0;let n=0;
    for(const t of L){if(!t||!t.id||!Array.isArray(t.part))continue;const ex=S.list.some(x=>x.id===t.id);
      if(S.online)await persist(t,{novo:!ex});else{const i=S.list.findIndex(x=>x.id===t.id);i<0?S.list.push(t):S.list[i]=t;await persist(t)}n++}
    $('#dlg').close();render();toast(n+' torneio(s) importado(s)')}catch(e){toast(e&&e.message?e.message:'Arquivo inválido')}
}
async function recarregar(){
  await loadList();
  if(S.cur){const t=await loadFull(S.cur.id);if(t)setCur(t);else S.cur=null}
  $('#dlg').close();render();
}
addEventListener('scroll',()=>{const h=$('#pmh');if(!h)return;if(scrollY>90)h.classList.add('sm');else if(scrollY<15)h.classList.remove('sm')},{passive:true});
async function add(id){
  const c=S.chars.find(x=>x.id===id);if(!c)return;
  if(!canEdit())return playerOp('torneio_inscrever',id);
  let rk=0;
  try{const j=await fetch('/api/ficha-salvar?slug='+encodeURIComponent(id)).then(r=>r.ok?r.json():null);if(j?.d)rk=numPts(j.d.pts_ranking)}catch{}
  mut(t=>{if(t.status!=='inscricao'||t.part.some(p=>p.id===id))return false;t.part.push({...c,ranking:rk})});
}
async function playerOp(action,slug){
  const ses=sesF();
  if(!S.online)return toast('Servidor indisponível. Tente de novo mais tarde.');
  if(!ses?.token)return toast('Sua sessão expirou. Entre no site novamente.');
  try{const j=await apiPost({action,token:ses.token,slug,torneio:S.cur.id,por:S.me?.nome});setCur(j.torneio);toList(S.cur);toast(action==='torneio_inscrever'?'Inscrição realizada!':'Inscrição cancelada.')}catch(e){toast(e.message)}
  render();
}
function avulso(){const v=$('#mn').value.trim();if(!v)return;mut(t=>{t.part.push({id:'x'+Date.now().toString(36),nome:v,foto:'',cor:'',ranking:0,player:''})})}
function sair(id){
  if(!canEdit())return playerOp('torneio_sair',id);
  mut(t=>{if(t.status!=='inscricao')return false;t.part=t.part.filter(x=>x.id!==id)});
}
function buscar(){const ids=new Set(S.cur.part.map(p=>p.id)),q=S.q.toLowerCase();$('#avl').innerHTML=avList(S.chars.filter(c=>!ids.has(c.id)&&(c.nome+' '+c.player).toLowerCase().includes(q)))}
function t_seed(v){mut(t=>{t.seed=v})}
function iniciar(){mut(t=>{if(t.part.length<2){toast('Precisa de pelo menos 2 participantes');return false}start(t)},()=>{S.tab='chave'})}
function reiniciar(){if(!confirm('Reabrir inscrições? Todos os resultados serão apagados.'))return;mut(t=>{Object.assign(t,{status:'inscricao',m:[],champ:null})},()=>{S.tab='part'})}
async function excluir(){if(!confirm('Excluir este torneio?'))return;try{await remove(S.cur)}catch(e){return toast(e.message)}voltar()}
function placar(r,i){
  const t=S.cur,m=t.m[r][i],A=P(t,m.a),B=P(t,m.b),d=$('#dlg');
  d.innerHTML=`<h3>Lançar resultado</h3>
    <div class="ds">${av(A)}<div class="dn"><span>${esc(A.nome)}</span><div class="wl"><button type="button" data-s="a" data-k="v" onclick="setW('a')">Venceu</button><button type="button" data-s="a" data-k="p" onclick="setW('b')">Perdeu</button></div></div><input class="in" id="sa" type="number" min="0" value="${m.sa??''}" oninput="markW()"></div>
    <div class="ds">${av(B)}<div class="dn"><span>${esc(B.nome)}</span><div class="wl"><button type="button" data-s="b" data-k="v" onclick="setW('b')">Venceu</button><button type="button" data-s="b" data-k="p" onclick="setW('a')">Perdeu</button></div></div><input class="in" id="sb" type="number" min="0" value="${m.sb??''}" oninput="markW()"></div>
    <p class="msg" id="em">${t.formato==='single'?'Empates não são permitidos na chave.':''}</p>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn d" onclick="salvarM(${r},${i},true)">Limpar</button><button class="btn" onclick="$('#dlg').close()">Cancelar</button><button class="btn p" onclick="salvarM(${r},${i})">Salvar</button></div>`;
  d.showModal();markW();
}
function setW(w){
  const A=$('#sa'),B=$('#sb');let a=parseInt(A.value,10),b=parseInt(B.value,10);
  if(isNaN(a)||isNaN(b)){a=w==='a'?1:0;b=w==='a'?0:1}
  else if(w==='a'?a<=b:b<=a){[a,b]=[b,a];if(a===b){if(w==='a')a=b+1;else b=a+1}}
  A.value=a;B.value=b;markW()
}
function markW(){
  const a=parseInt($('#sa').value,10),b=parseInt($('#sb').value,10),ok=!isNaN(a)&&!isNaN(b)&&a!==b,w=ok?(a>b?'a':'b'):'';
  document.querySelectorAll('#dlg .wl button').forEach(x=>x.classList.toggle('on',ok&&((x.dataset.k==='v')===(x.dataset.s===w))))
}
function salvarM(r,i,clear){
  let a,b;
  if(!clear){
    a=parseInt($('#sa').value,10);b=parseInt($('#sb').value,10);
    if(isNaN(a)||isNaN(b)){$('#em').textContent='Preencha os dois placares.';return}
    if(S.cur.formato==='single'&&a===b){$('#em').textContent='A chave não aceita empate.';return}
  }
  $('#dlg').close();
  mut(t=>{const m=t.m[r][i];if(!m)return false;if(clear){m.sa=m.sb=null}else{m.sa=a;m.sb=b}if(t.formato==='single')sync(t);else finishRR(t)});
}
addEventListener('hashchange',async()=>{const id=location.hash.slice(1);if(id===(S.cur&&S.cur.id))return;S.cur=id?await loadFull(id):null;render()});
boot();
</script>
</body>
</html>
