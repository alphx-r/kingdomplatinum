<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Torneios | KPRPG</title>
<link rel="icon" type="image/x-icon" href="https://64.media.tumblr.com/c429cb57b048b0ba1d90c6451d7c3aa1/8607b48e6654212e-0d/s540x810/c1f9956cc78935a32f53346f3a7a942caa5d1d67.png">
<meta name="theme-color" content="#1a3a5c">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#1a3a5c;--brand-mid:#2563a8;--brand-light:#e8f0fb;--accent:#e8a020;--accent-light:#fdf3dc;--bg:#808080;--surface:#fff;--surface2:#f0f3f8;--border:#dde3ee;--border2:#c8d0e0;--text:#1a1f2e;--muted:#6b7a99;--red:#c03030;--green:#1a7a1a;--r:10px;--font-title:'Cinzel',serif;--font-body:'Nunito',sans-serif}
html,body{min-height:100%;background:var(--bg);font-family:var(--font-body);color:var(--text)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,input,select{font:inherit}
/* scroll invisível em todo o site (a rolagem continua funcionando) */
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
main{max-width:1100px;margin:0 auto;padding:16px 12px 60px;color:var(--text)}
h1,h2{font-family:var(--font-title);color:var(--brand);letter-spacing:.5px}
.hd{background:var(--surface);border:1.5px solid var(--border);border-radius:6px;padding:18px 22px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.12)}.hd .sub{margin-bottom:0}
h1{font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{text-align:left;padding:12px 14px;border:2px solid var(--border2);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--text)}
.opt b{display:block;font-family:var(--font-title);color:var(--brand);font-size:14px;margin-bottom:2px}.opt small{color:var(--muted);font-size:12px}
.opt.on{border-color:var(--accent);background:var(--accent-light)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}.fl .in{width:100%;font-weight:500;color:var(--text)}
.lk{margin-top:8px;font-size:12.5px;background:var(--brand-light);color:var(--brand);padding:8px 12px;border-radius:8px;word-break:break-all}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pi button.btn{font-size:12px;padding:6px 12px;border:1.5px solid var(--border2);background:var(--surface);color:var(--brand)}
.pi button.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}.pi button.btn.d{color:var(--red)}
.card{background:var(--surface);border-radius:6px;border:1.5px solid var(--border);padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.card{color:var(--text)}.card h3{background:var(--brand);color:#fff;text-align:center;font-family:var(--font-title);font-size:15px;font-weight:700;padding:8px 12px;margin:-18px -18px 14px;border-radius:5px 5px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tc{cursor:pointer;transition:transform .15s,border-color .15s;border-top:3px solid var(--accent)}
.tc:hover{transform:translateY(-2px);border-color:var(--brand-mid)}
.tc b{font-family:var(--font-title);color:var(--brand);font-size:16px;display:block;margin-bottom:6px}
.tc small{color:var(--muted);font-size:12.5px;display:block}
.st{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--brand-light);color:var(--brand-mid)}
.st.f{background:var(--accent-light);color:#a56a00}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.in{padding:9px 12px;border:1.5px solid var(--border2);border-radius:8px;background:#fff;color:var(--text);min-width:0}
.in:focus{outline:2px solid var(--brand-mid);outline-offset:1px}
.btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--brand);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--brand-light)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.p:hover{background:var(--brand-mid)}
.btn.a{background:var(--accent);border-color:var(--accent);color:var(--brand)}
.btn.d{color:var(--red)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;padding:4px;margin:0 0 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;overflow-x:auto}
.tab{flex:1 0 auto;background:none;border:0;border-radius:7px;padding:9px 18px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface2)}
.tab.on{background:var(--brand);color:#fff}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--brand-mid);color:#fff;font-weight:700;font-size:13px;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px var(--border2)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bk{display:flex;gap:34px;overflow-x:auto;padding:6px 4px 14px}
.rd{display:flex;flex-direction:column;min-width:230px}
.rd h4{background:var(--brand);color:#fff;font-family:var(--font-title);font-size:13px;text-align:center;padding:7px 8px;border-radius:6px;margin-bottom:10px}
.ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.m{position:relative;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);overflow:visible;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.m.ed{cursor:pointer}.m.ed:hover{border-color:var(--accent)}
.m:not(.last)::after{content:"";position:absolute;right:-34px;top:50%;width:34px;border-top:2px solid var(--brand-mid)}
.sl{display:flex;align-items:center;gap:9px;padding:7px 10px;min-height:44px}
.sl+.sl{border-top:1px solid var(--border)}
.sl .nm{flex:1;font-weight:700;font-size:13.5px;line-height:1.15;min-width:0}
.sl .nm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.sl b{min-width:22px;text-align:right;color:var(--muted)}
.sl.w{background:var(--accent-light)}.sl.w b{color:#a56a00}
.sl.l .nm{color:var(--muted)}
.sl.e{color:var(--muted);font-size:12.5px;font-style:italic}
.champ{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--accent),#f3c560);color:var(--brand);padding:14px 20px;border-radius:var(--r);margin-bottom:14px;font-family:var(--font-title);font-size:18px;font-weight:700}
.champ .av{width:46px;height:46px;font-size:18px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:380px;overflow:auto}
.pi{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:13.5px;font-weight:700}
.pi small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.pi .nm{flex:1;min-width:0}
.pi button{border:none;background:none;cursor:pointer;font-size:18px;color:var(--brand-mid);font-weight:700}
.pi.x button{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--border)}
th{font-family:var(--font-title);color:var(--brand);font-size:12px}
td:nth-child(2),th:nth-child(2){text-align:left}
.rrm{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
/* tipo de evento: mostra só os campos do tipo escolhido */
#nf[data-tipo=sorteio] .ft-t{display:none}#nf[data-tipo=torneio] .ft-s{display:none}
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.eq .pi{margin-bottom:8px}.eq .pi:last-child{margin-bottom:0}
.eq h3 small{font-weight:500;opacity:.8}
.pi select.mv{flex:none;width:58px;padding:4px 6px;font-size:12px;cursor:pointer}
dialog{border:none;border-radius:14px;padding:22px;width:min(380px,92vw);margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,20,40,.6)}
dialog h3{font-family:var(--font-title);color:var(--brand);margin-bottom:14px}
.ds{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ds>span:not(.av){flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}.ds .av{flex:none;width:36px;height:36px}.dn{flex:1;min-width:0}.dn>span{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl{display:flex;gap:6px;margin-top:6px}.wl button{padding:4px 10px;border-radius:99px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--muted);font-weight:700;font-size:12px;cursor:pointer}
.wl button[data-k=v].on{background:var(--green);border-color:var(--green);color:#fff}.wl button[data-k=p].on{background:var(--red);border-color:var(--red);color:#fff}.ds input{width:70px;text-align:center}
.msg{color:var(--muted);font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;font-size:13px;z-index:99}
@media(max-width:600px){main{padding:10px 8px 60px}.hd{padding:14px}.rd{min-width:210px}h1{font-size:21px}}
.pmh{position:sticky;top:0;z-index:200;background:linear-gradient(135deg,var(--brand),var(--brand-mid));color:#fff;padding:22px 12px 20px;box-shadow:0 4px 18px rgba(0,0,0,.18);transition:padding .2s}
.pmw{max-width:1100px;margin:0 auto}
.pmht{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pmb{display:flex;flex-direction:column;min-width:150px;cursor:pointer}.pmb b{font:700 26px var(--font-title);letter-spacing:1px;color:#fff}
.pmq{flex:1;min-width:180px;border:0;border-radius:22px;padding:11px 18px;background:#fff;color:var(--text);font-size:14px}
.pmq:focus{outline:2px solid var(--accent)}
.pmcart{position:relative;border:0;border-radius:22px;min-width:48px;height:42px;padding:0 10px;background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}.pmcart:hover{background:rgba(255,255,255,.3)}
.pmcart.tx{padding:0 16px;gap:8px;font-size:13px;font-weight:700;white-space:nowrap}.pmcart.on{background:var(--accent);color:var(--brand)}
.pmcart:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modsw{--W:88px;--H:30px;--K:24px;--T:58px;position:relative;flex:none;border:0;padding:0;width:var(--W);height:var(--H);border-radius:var(--H);background:#3bb54a;color:#fff;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .2s ease;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.modsw .sw-k{position:absolute;top:3px;left:3px;width:var(--K);height:var(--K);border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transform:translateX(var(--T));transition:transform .2s ease}
.modsw .sw-t{position:absolute;top:0;bottom:0;width:var(--T);display:flex;align-items:center;justify-content:center;font:800 11px/1 var(--font-body,inherit);letter-spacing:.4px;text-transform:uppercase;pointer-events:none}
.modsw .sw-mod{left:0}.modsw .sw-ply{right:0;display:none}
.modsw.off{background:#9b9b9b}
.modsw.off .sw-k{transform:translateX(0)}
.modsw.off .sw-mod{display:none}.modsw.off .sw-ply{display:flex}
.modsw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pmh.sm .modsw{--W:80px;--H:28px;--K:22px;--T:52px}
.pmh.sm{padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}.pmh.sm .pmb{min-width:0}.pmh.sm .pmb b{font-size:18px}.pmh.sm .pmq{padding:7px 14px}.pmh.sm .pmcart{height:34px;min-width:40px}
.sh-sub{background:color-mix(in srgb,var(--brand-mid) 20%,transparent)}
.sh-sub>div{max-width:1100px;margin:0 auto;padding:9px 12px;text-align:center;font-weight:700;font-size:13px;color:var(--brand)}
.pmtabs{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.1);margin-bottom:14px;overflow-x:auto}
.pmtabs button{flex:1 0 auto;border:0;background:none;border-radius:7px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap}.pmtabs button.on{background:var(--brand-mid);color:#fff}
@media(max-width:768px){.pmh{top:52px}}
@media(max-width:600px){
.pmh{padding:12px 10px 10px}
.pmht{gap:6px;flex-wrap:wrap}
.pmb{flex:1 1 auto;min-width:0;overflow:hidden}
.pmb b{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmq{order:9;flex:1 1 100%;min-width:0;padding:10px 14px;font-size:14px}
.pmcart,.pmcart.tx{min-width:40px;width:40px;height:40px;padding:0;flex:none;gap:0}
.pmcart.tx span{display:none}
.modsw{--W:80px;--H:28px;--K:22px;--T:52px}.modsw .sw-t{font-size:10px;letter-spacing:.2px}
.sh-sub>div{padding:7px 10px;font-size:12px}
.pmtabs button{padding:8px 12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* barra "ficha ativa" (mesmo visual da PokéMart): com qual personagem o player se inscreve */
.card.lh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:12px;padding:14px 18px;margin-bottom:14px}
.lh .lhf{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
.lav{position:relative;display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;min-width:52px;border-radius:50%;overflow:hidden;background:var(--brand-mid);color:#fff;font:700 20px var(--font-title);flex:none}
.lav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lh .lhn{font:800 18px var(--font-title);color:var(--text);overflow-wrap:anywhere}
.lh .lhu{font-size:12.5px;font-weight:600;color:var(--muted)}
.lh .lhx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lh .lhx .btn.tr{background:color-mix(in srgb,var(--brand-mid) 9%,var(--surface));border-color:color-mix(in srgb,var(--brand-mid) 30%,transparent);color:var(--text);font-weight:800;opacity:.78;transition:opacity .15s,background .15s}
.lh .lhx .btn.tr:hover,.lh .lhx .btn.tr:focus-visible{opacity:1;background:color-mix(in srgb,var(--brand-mid) 16%,var(--surface))}
.lh .lhs{text-align:right}.lh .lhs span{display:block;font:800 10px var(--font-body);letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}.lh .lhs b{font:800 22px var(--font-title);color:var(--text)}
.lh .lhm{flex-basis:100%;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
dialog.qm{width:min(480px,94vw)}
dialog.qm .qg{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:60vh;overflow-y:auto;padding:2px}
.qc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border:2px solid var(--border2);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;text-align:center;transition:transform .15s,border-color .15s,box-shadow .15s}
.qc:hover{transform:translateY(-2px);border-color:var(--brand-mid);box-shadow:0 6px 16px rgba(0,0,0,.18)}.qc.on{border-color:var(--accent);background:var(--accent-light)}
.qc .lav{width:72px;height:72px;min-width:72px;font-size:28px}
.qc b{font:800 15px var(--font-title);word-break:break-word}.qc small{font-size:12px;font-weight:600;color:var(--muted);min-height:15px}
@media(max-width:600px){
 .card.lh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;padding:14px}
 .lh .lhf{grid-column:1;grid-row:1;min-width:0}.lh .lhn{font-size:17px}
 .lh .lhs{grid-column:2;grid-row:1}.lh .lhs b{font-size:20px;white-space:nowrap}
 .lh .lhx{grid-column:1/-1;grid-row:2}.lh .lhx .btn{flex:1;min-height:40px}
 .lh .lhm{grid-column:1/-1;grid-row:3}
}
.hd .bkl{border:none;background:none;color:var(--brand-mid);font-weight:700;font-size:13px;cursor:pointer;padding:0;margin-bottom:8px}.hd .bkl:hover{text-decoration:underline}
.hd .adm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.hd .adm-g{display:flex;flex-wrap:wrap;gap:8px}.hd .adm-g:empty{display:none}.hd .adm-g.r{margin-left:auto}
@media(max-width:600px){.hd .adm-g{flex:1 1 100%}.hd .adm-g .btn{flex:1 1 auto}.hd .adm-g.r{margin-left:0}}
/* lista de torneios: cards mais ricos */
#cards .grid{margin-bottom:6px}
.sec{display:flex;align-items:center;gap:10px;margin:18px 2px 10px;font:700 13px var(--font-title);letter-spacing:.8px;text-transform:uppercase;color:var(--brand)}
.sec:first-child{margin-top:4px}.sec::after{content:"";flex:1;height:1px;background:var(--border2)}
.sec i{order:2;font:700 11px var(--font-body);font-style:normal;background:var(--brand-light);color:var(--brand-mid);padding:2px 9px;border-radius:99px}
.pmtabs .cn{display:inline-block;margin-left:7px;min-width:20px;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:800;background:var(--brand-light);color:var(--brand-mid)}
.pmtabs button.on .cn{background:rgba(255,255,255,.25);color:#fff}
.card.tc{--c:var(--accent);display:flex;flex-direction:column;gap:10px;padding:16px 16px 14px;border-top:4px solid var(--c);border-radius:12px;position:relative;overflow:hidden}
.tc.s-o{--c:var(--green)}.tc.s-a{--c:var(--brand-mid)}.tc.s-f{--c:var(--accent)}.tc.s-c{--c:#8a93a6}
.tc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.tc svg{width:15px;height:15px;flex:none}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tc-ico{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}.tc-ico svg{width:19px;height:19px}
.tc .st{display:inline-flex;align-items:center;gap:6px;margin:0;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 75%,#000)}
.tc .st i{width:7px;height:7px;border-radius:50%;background:var(--c)}.tc .st.o i{animation:tcp 1.8s ease-in-out infinite}
@keyframes tcp{50%{opacity:.35}}
.tc>b{font-size:18px;line-height:1.2;margin:0}
.tc-meta{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12.5px;font-weight:600}
.tc-meta span{display:flex;align-items:center;gap:7px}.tc-meta em{font-style:normal;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 8px;border-radius:99px;font-size:11px}
.tc-d{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.tc-pp{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--border2)}
.avs{display:inline-flex;flex:none}.avs .av{width:28px;height:28px;min-width:28px;font-size:11px;margin-left:-8px}.avs .av:first-child{margin-left:0}.avs .av.more{background:var(--surface2);color:var(--muted);font-weight:800}

const SU='https://ucbkodkjlbatttiuqjtv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYmtvZGtqbGJhdHR0aXVxanR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjExODcsImV4cCI6MjA5MzMzNzE4N30.a65MSk7m4DvgTw2pHXhaqMOOEpjTB_wPsXJUfvOGiG4';

function uid(nome,ign){const b=slug(nome)||'torneio';let i=b,n=2;while(S.list.some(t=>t.id===i&&t.id!==ign))i=b+n++;return i}

const sesF=()=>{try{return JSON.parse(localStorage.getItem('kp_ficha_sessao'))}catch{return null}};

const podeEditar=t=>{if(S.preview)return false;if(realAdmin())return true;if(!isMod()||!t)return false;const id=String(meuId());return String(t.criador)===id||(Array.isArray(t.mods)&&t.mods.map(String).includes(id))};
const KA='kp_torneio_adm';

const numPts=v=>{const x=Number(String(v??'').replace(/\./g,'').replace(',','.'));return Number.isFinite(x)?x:0};

const TEMAS_SAZ={
 primavera:{brand:'#1a4a2a',brandMid:'#2e9e50',accent:'#80d880',bg:'#f0fbf2',surface:'#ffffff',text:'#0a1e0e'},
 verao:{brand:'#E2582B',brandMid:'#C2410C',accent:'#D9483B',bg:'#fff7f0',surface:'#ffffff',text:'#2b1208'},
 outono:{brand:'#3a1800',brandMid:'#a05020',accent:'#d08030',bg:'#fff8f0',surface:'#ffffff',text:'#1e0e00'},
 inverno:{brand:'#0a1e3a',brandMid:'#3a80c8',accent:'#90c8f0',bg:'#f0f6ff',surface:'#ffffff',text:'#0a1428'}
};
const EST_MES={1:'primavera',2:'verao',3:'outono',4:'inverno',5:'primavera',6:'verao',7:'outono',8:'inverno',9:'primavera',10:'verao',11:'outono',12:'inverno'};
function aplicaTema(t){if(!t)return;const r=document.documentElement.style;[['--brand','brand'],['--brand-mid','brandMid'],['--accent','accent'],['--bg','bg'],['--surface','surface'],['--text','text']].forEach(([v,k])=>{if(t[k])r.setProperty(v,t[k])})}

  const q=p=>fetch(SU+'/rest/v1/'+p,{headers:{apikey:SKEY,Authorization:'Bearer '+SKEY}}).then(r=>r.ok?r.json():[]).catch(()=>[]);

async function api(p,o={}){const r=await fetch(SU+'/rest/v1/'+p,{...o,headers:{apikey:SKEY,Authorization:'Bearer '+SKEY,'Content-Type':'application/json',...o.headers}});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return t?JSON.parse(t):[]}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ───── Dados ───── */
async function apiPost(body){
  const r=await fetch('/api/ficha-salvar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error(j?.error||'Erro '+r.status);e.status=r.status;e.code=j?.code;throw e}
  return j;
}
async function loadList(){
  try{const r=await fetch('/api/ficha-salvar?torneios=1',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(!Array.isArray(j))throw 0;S.online=true;S.list=j;return}catch{}
  S.online=false;try{S.list=JSON.parse(localStorage.getItem(LS))||[]}catch{S.list=[]}
}
async function loadFull(id){
  if(!S.online)return S.list.find(t=>t.id===id)||null;
  const r=await fetch('/api/ficha-salvar?torneio='+encodeURIComponent(id)+'&_='+Date.now(),{cache:'no-store'});

}
const resumo=t=>({id:t.id,nome:t.nome,formato:t.formato,nEquipes:t.nEquipes,status:t.status,desc:(t.desc||'').slice(0,200),data:t.data,vagas:t.vagas,aberta:t.aberta,nPart:t.part.length,avs:t.part.slice(0,4).map(p=>({nome:p.nome,foto:p.foto,cor:p.cor})),champ:t.champ,champNome:champNome(t),nomes:t.part.map(p=>p.nome+' '+(p.player||'')).join(' '),at:t.at});
function toList(t){S.list=S.list.filter(x=>x.id!==t.id);S.list.unshift(S.online?resumo(t):t)}
function setCur(t){if(S.cur&&S.cur!==t){Object.keys(S.cur).forEach(k=>delete S.cur[k]);Object.assign(S.cur,t)}else S.cur=t}
/* login do organizador: nome+senha conferidos no servidor (admin_login), guardados só nesta aba */

    let v=null;
    $('#ab').onclick=()=>{const n=$('#an').value.trim(),s=$('#as').value;if(!n||!s)return;v={n,s};try{sessionStorage.setItem(KA,JSON.stringify(v))}catch{}d.close()};
    $('#ac').onclick=()=>d.close();
    d.addEventListener('close',()=>ok(v),{once:true});d.showModal();
  });

const kpNrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toLowerCase();
async function carregaOrgs(){
  /* moderadores = kp_staff.mods.torneios (nomes); o id vem da lista de players, para atribuir torneios a eles */
  try{await KPAdm.ready}catch{}
  const nomes=(window.KPAdm&&KPAdm.staff().mods.torneios)||[];
  S.orgs=nomes.map(n=>{const p=S.players.find(x=>kpNrm(x.nome)===n);return p?{id:p.id,nome:p.nome}:{nome:n}});

/* pede o nome+senha do PLAYER (não é o login de ADM por email), conferidos no servidor */
async function salvaOrgs(L){
  const staff=JSON.parse(JSON.stringify(KPAdm.staff()));staff.mods=staff.mods||{};staff.mods.torneios=L.map(o=>kpNrm(o.nome)).filter(Boolean);
  for(let k=0;k<2;k++){
    const c=await KPAdm.cred('Confirme a senha do seu player para salvar os moderadores.');if(!c)throw new Error('Cancelado.');
    const r=await fetch('/api/ficha-salvar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'staff_salvar',nome:c.n,senha:c.s,staff})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){
      try{sessionStorage.removeItem('kp_staff_cache')}catch{}
      /* transição: o servidor de torneios (_torneios.js) ainda lê config.torneio_organizadores; mantém igual até ele ser atualizado */
      try{await api('config?on_conflict=chave',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({chave:'torneio_organizadores',valor:L})})}catch{}
      S.orgs=L;return;
    }
    if(r.status===401||r.status===403){KPAdm.credLimpar();if(k)throw new Error(j.error||'Sem permissão');toast(j.error||'Senha incorreta')}
    else throw new Error(j.error||'Erro '+r.status);
  }
}
function organizadores(){
  if(!realAdmin())return;
  const d=$('#dlg');
  const lista=S.orgs.map((o,i)=>`<div class="ds"><span style="flex:1;font-weight:700">${esc(o.nome||o.id)}</span><button class="btn d" onclick="orgDel(${i})">Remover</button></div>`).join('')||'<p class="msg">Nenhum moderador ainda.</p>';
  const livres=S.players.filter(p=>!S.orgs.some(o=>String(o.id)===String(p.id))).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  d.innerHTML=`<h3>Moderadores de torneios</h3><p class="msg" style="margin:0 0 12px">Players abaixo podem criar e editar torneios.</p>${lista}
  <div class="ds" style="margin-top:12px"><select class="in" id="orgsel" style="flex:1;width:auto"><option value="">Escolher player…</option>${livres.map(p=>`<option value="${esc(String(p.id))}">${esc(p.nome)}</option>`).join('')}</select><button class="btn p" onclick="orgAdd()">Adicionar</button></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="$('#dlg').close()">Fechar</button></div>`;

}
async function orgAdd(){

  try{await salvaOrgs([...S.orgs,{id:p.id,nome:p.nome}]);organizadores()}catch(e){toast('Não foi possível salvar ('+e.message+')')}

async function orgDel(i){

async function admPost(body){
  if(isMod()){
    if(body.action==='torneio_excluir')throw new Error('Só o ADM pode excluir torneios.');
    const u=S.me||{},c=S.chars.find(x=>String(x.pid)===String(meuId()));   // o servidor confere o token através de uma ficha do próprio moderador
    if(!c)throw new Error('Para organizar torneios você precisa ter pelo menos uma ficha.');
    return apiPost({...body,token:S.ses.token,slug:c.id,por:u.nome||S.ses?.nome});
  }
  for(let k=0;k<2;k++){
    const c=admCred()||await pedirAdm();if(!c)throw new Error('Login cancelado.');
    try{return await apiPost({...body,adm_nome:c.n,adm_senha:c.s})}
    catch(e){if(e.status===401||e.status===403){sessionStorage.removeItem(KA);if(k)throw e;toast(e.message)}else throw e}
  }
}
async function boot(){
  try{await KPAdm.ready}catch{}
  const [pl,fi]=await Promise.all([
    api('players?select=id,nome').catch(()=>[]),
    fetch('/api/ficha-salvar?lista=1',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
    loadList()
  ]);
  S.players=pl;try{S.me=JSON.parse(localStorage.getItem('player_session'))}catch{}
  S.ses=sesF();await carregaOrgs();try{S.preview=(realAdmin()||isMod())&&sessionStorage.getItem('kp_preview')==='1'}catch{}
  S.chars=(Array.isArray(fi)?fi:[]).filter(e=>e&&e.slug&&e.nome&&e.desativada!=='true').map(e=>{
    const o=S.players.find(p=>String(p.id)===String(e.player_id));
    return{id:e.slug,pid:e.player_id,nome:e.nome,foto:e.foto||'',cor:/^#[0-9a-f]{3,8}$/i.test(e.cor||'')?e.cor:'',ranking:0,player:o?o.nome:(String(e.player_id)==='admin'?'':(e.player||''))}
  });
  const id=location.hash.slice(1);if(id)S.cur=await loadFull(id);
  render();
}
async function persist(t,o={}){
  if(S.online){
    const r=await admPost({action:'torneio_salvar',torneio:t,base:o.novo?undefined:t.at,novo:!!o.novo,de:o.de});
    t.id=r.id;t.at=r.at;if(r.criador!==undefined)t.criador=r.criador;if(Array.isArray(r.mods))t.mods=r.mods;toList(t);return;
  }
  t.at=Date.now();if(!S.list.includes(t))S.list.push(t);
  try{localStorage.setItem(LS,JSON.stringify(S.list))}catch{}
}
/* atualização otimista: a tela muda na hora e o banco salva em segundo plano (fila em série) */
let pend=0,fila=Promise.resolve();
function mut(fn,after){
  if(!podeEditar(S.cur))return toast('Você não tem permissão para editar este torneio.');
  const snap=JSON.stringify(S.cur);
  let r;
  try{r=fn(S.cur)}catch(e){toast(e.message);return}
  if(r===false)return;
  if(after)after();render();
  const t=S.cur;pend++;
  fila=fila.then(async()=>{
    try{await persist(t)}
    catch(e){
      toast(e.message||'Erro ao salvar');
      try{
        const f=S.online?await loadFull(t.id):JSON.parse(snap);
        if(f){if(S.cur===t||(S.cur&&S.cur.id===t.id))setCur(f);else if(S.cur)S.cur=f}
      }catch{}
      render();
    }
  }).finally(()=>{pend--});
}
addEventListener('beforeunload',e=>{if(pend>0){e.preventDefault();e.returnValue=''}});
setInterval(async()=>{
  if(!S.online||pend>0||$('#dlg').open||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
  try{await loadList();if(S.cur){const t=await loadFull(S.cur.id);if(t&&t.at!==S.cur.at)setCur(t)}render()}catch{}
},30000);
async function remove(t){
  if(S.online)await admPost({action:'torneio_excluir',id:t.id});
  S.list=S.list.filter(x=>x.id!==t.id);try{if(!S.online)localStorage.setItem(LS,JSON.stringify(S.list))}catch{}
}
/* ───── Lógica do torneio ───── */
const P=(t,id)=>t.part.find(p=>p.id===id);
function seedOrder(n){let a=[1,2];while(a.length<n)a=a.flatMap(x=>[x,a.length*2+1-x]);return a}
function start(t){
  let ps=[...t.part];
  if(t.seed==='ranking')ps.sort((a,b)=>(b.ranking||0)-(a.ranking||0));
  else if(t.seed==='aleatorio')for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ps[i],ps[j]]=[ps[j],ps[i]]}
  if(t.formato==='rr'){
    t.m=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)t.m.push({a:ps[i].id,b:ps[j].id,sa:null,sb:null});
  }else{
    let size=2;while(size<ps.length)size*=2;
    const slots=seedOrder(size).map(s=>ps[s-1]?.id??null),rounds=[];
    let r0=[];for(let i=0;i<size;i+=2)r0.push({a:slots[i],b:slots[i+1],sa:null,sb:null});
    rounds.push(r0);
    for(let n=size/2;n>1;n/=2)rounds.push(Array.from({length:n/2},()=>({a:null,b:null,sa:null,sb:null})));
    t.m=rounds;sync(t);
  }
  t.status='andamento';
}
function win(m,r){
  if(r===0&&(m.a==null)!==(m.b==null))return m.a??m.b;
  if(m.a==null||m.b==null||m.sa==null||m.sb==null||m.sa===m.sb)return null;
  return m.sa>m.sb?m.a:m.b;
}
function sync(t){
  if(t.formato!=='single')return;
  for(let r=1;r<t.m.length;r++)t.m[r].forEach((m,i)=>{
    const a=win(t.m[r-1][2*i],r-1),b=win(t.m[r-1][2*i+1],r-1);
    if(m.a!==a||m.b!==b){m.a=a;m.b=b;m.sa=m.sb=null}
  });
  const f=t.m[t.m.length-1][0];t.champ=win(f,t.m.length-1);
  t.status=t.champ?'fim':'andamento';
}
function standings(t){
  const s={};t.part.forEach(p=>s[p.id]={p,j:0,v:0,e:0,d:0,pts:0,sg:0});
  t.m.forEach(m=>{if(m.sa==null||m.sb==null)return;const A=s[m.a],B=s[m.b];A.j++;B.j++;A.sg+=m.sa-m.sb;B.sg+=m.sb-m.sa;
    if(m.sa>m.sb){A.v++;B.d++;A.pts+=3}else if(m.sa<m.sb){B.v++;A.d++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}});
  return Object.values(s).sort((x,y)=>y.pts-x.pts||y.sg-x.sg||(y.p.ranking||0)-(x.p.ranking||0));
}
function finishRR(t){t.status=t.m.every(m=>m.sa!=null)?'fim':'andamento';if(t.status==='fim')t.champ=standings(t)[0].p.id}

/* ───── Render ───── */
const av=p=>`<span class="av" style="${p.cor?'background:'+p.cor:''}">${esc((p.nome||'?')[0].toUpperCase())}${p.foto?`<img src="${esc(p.foto)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;
const who=(p,sub=true)=>`<span class="nm">${esc(p.nome)}${sub&&p.player?`<small>${esc(p.player)}</small>`:''}</span>`;
const stLabel=t=>t.status==='fim'?(t.formato==='sorteio'?'Sorteio realizado':'Finalizado'):t.status==='andamento'?'Em andamento':'Inscrições abertas';

const ICO=p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
let hubKey='';

}
function classTable(t){
  return`<table><tr><th>#</th><th>Participante</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr>${standings(t).map((s,i)=>`<tr><td>${i+1}</td><td><div class="row" style="flex-wrap:nowrap">${av(s.p)}${who(s.p)}</div></td><td>${s.j}</td><td>${s.v}</td><td>${s.e}</td><td>${s.d}</td><td>${s.sg>0?'+':''}${s.sg}</td><td><b>${s.pts}</b></td></tr>`).join('')}</table>`;
}

function novoForm(){
  const tp=(k,t,d)=>`<button type="button" class="opt ${S.tipo===k?'on':''}" data-g="t" data-k="${k}" onclick="setTipo('${k}')"><b>${t}</b><small>${d}</small></button>`;
  const o=(k,t,d)=>`<button type="button" class="opt ${S.fmt===k?'on':''}" data-g="f" data-k="${k}" onclick="setFmt('${k}')"><b>${t}</b><small>${d}</small></button>`;
  return`<div class="card" id="nf" data-tipo="${S.tipo}" style="margin-bottom:16px"><h3>Novo evento</h3>
  <label class="fl" style="margin-bottom:6px">Tipo de evento</label>
  <div class="opts" style="margin-bottom:14px">${tp('torneio','Torneio','Chaves ou todos contra todos, com resultados e campeão.')}${tp('sorteio','Sorteio de equipes','Os inscritos são sorteados em X equipes.')}</div>
  <label class="fl">Nome do evento<input class="in" id="nn" placeholder="Ex.: Xmas Cup" oninput="lk()"></label>
  <div class="lk" id="lk"></div>
  <div class="opts ft-t" style="margin-top:14px">${o('single','Eliminatória simples','Perdeu, está fora. Byes automáticos.')}${o('rr','Todos contra todos','Cada um enfrenta todos. Vence quem somar mais pontos.')}</div>
  <div class="fg">
   <label class="fl">Data e hora<input class="in" id="nd" type="datetime-local"></label>
   <label class="fl">Vagas (vazio = sem limite)<input class="in" id="nv" type="number" min="2" placeholder="Ilimitado"></label>
   <label class="fl">Personagens por player<input class="in" id="np" type="number" min="1" value="1"></label>
   <label class="fl ft-t">Melhor de<select class="in" id="nm"><option value="1">1 partida</option><option value="3">3 partidas</option><option value="5">5 partidas</option></select></label>
   <label class="fl ft-t">Seeds<select class="in" id="ns"><option value="ranking">Ranking da ficha</option><option value="aleatorio">Sorteio aleatório</option><option value="ordem">Ordem de inscrição</option></select></label>
  <label class="fl ft-s">Quantidade de equipes<input class="in" id="ne" type="number" min="2" value="2"></label>
   <label class="fl ft-s">Critério do sorteio<select class="in" id="nsq"><option value="aleatorio">Totalmente aleatório</option><option value="ranking">Equilibrar por ranking da ficha</option></select></label>
  </div>
  <label class="fl">Descrição e regras<textarea class="in" id="ndc" rows="3" placeholder="Regras, premiação, observações..."></textarea></label>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="na" checked> Players podem se inscrever sozinhos</label>
  <div class="row" style="margin-top:14px"><button class="btn p" onclick="criar()">Criar evento</button><button class="btn" onclick="S.criando=false;render()">Cancelar</button></div></div>`;
}
function setFmt(k){S.fmt=k;document.querySelectorAll('.opt[data-g=f]').forEach(b=>b.classList.toggle('on',b.dataset.k===k))}
function setTipo(k){S.tipo=k;const f=$('#nf');if(f)f.dataset.tipo=k;document.querySelectorAll('.opt[data-g=t]').forEach(b=>b.classList.toggle('on',b.dataset.k===k))}
function lk(){const e=$('#lk');if(e)e.textContent='Link: '+location.href.split('#')[0].split('?')[0]+'#'+(slug($('#nn')?.value||'')||'nomedoevento')}

/* ───── Ações ───── */
async function criar(){
  const nome=$('#nn').value.trim();if(!nome)return toast('Dê um nome ao evento');
  const n=parseInt($('#nv').value,10);
  const t={id:uid(nome),nome,formato:S.fmt,status:'inscricao',seed:$('#ns').value,desc:$('#ndc').value.trim(),data:$('#nd').value,vagas:n>1?n:0,porPlayer:Math.max(1,parseInt($('#np').value,10)||1),md:parseInt($('#nm').value,10),aberta:$('#na').checked,part:[],m:[],champ:null,at:Date.now()};
  if(S.tipo==='sorteio'){
    const ne=parseInt($('#ne').value,10);
    if(!(ne>=2))return toast('Informe ao menos 2 equipes');
    if(t.vagas&&t.vagas<ne)return toast('As vagas precisam ser pelo menos o número de equipes');
    Object.assign(t,{formato:'sorteio',nEquipes:ne,seed:$('#nsq').value,md:1,eq:[]});
  }
  try{await persist(t,{novo:true})}catch(e){return toast(e.message)}
  S.cur=t;S.criando=false;S.tab='part';location.hash=t.id;render();
}
async function renomear(){
  if(!podeEditar(S.cur))return;
  const t=S.cur,n=prompt('Novo nome do torneio:',t.nome);if(!n||!n.trim())return;
  const old=t.id;
  try{if(S.online){const f=await loadFull(old);if(f)setCur(f)}t.nome=n.trim();t.id=uid(t.nome,old);await persist(t,{de:old});S.list=S.list.filter(x=>x.id!==old)}
  catch(e){t.id=old;return toast(e.message)}
  location.hash=t.id;render();
}
/* alterar tipo do evento (torneio chave / todos contra todos / sorteio de equipes) */
const MT={fmt:'single',ne:2};
function mudarTipo(){
  if(!podeEditar(S.cur))return;
  const t=S.cur,d=$('#dlg');MT.fmt=t.formato;MT.ne=t.nEquipes||2;
  const o=(k,n,ds)=>`<button type="button" class="opt ${MT.fmt===k?'on':''}" data-k="${k}" onclick="mtSel('${k}')"><b>${n}</b><small>${ds}</small></button>`;
  d.innerHTML=`<h3>Alterar tipo do evento</h3>
  <div class="opts" style="grid-template-columns:1fr">${o('single','Torneio · Eliminatória simples','Perdeu, está fora. Byes automáticos.')}${o('rr','Torneio · Todos contra todos','Vence quem somar mais pontos.')}${o('sorteio','Sorteio de equipes','Os inscritos são sorteados em X equipes.')}</div>
  <label class="fl" id="mtne" style="margin-top:12px;${MT.fmt==='sorteio'?'':'display:none'}">Quantidade de equipes<input class="in" id="mtn" type="number" min="2" value="${MT.ne}" style="width:100%;text-align:left"></label>
  <p class="msg" style="margin:12px 0 0">${t.status==='inscricao'?'Os inscritos são mantidos.':'Atenção: resultados/equipes serão apagados e as inscrições serão reabertas. Os inscritos são mantidos.'}</p>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="$('#dlg').close()">Cancelar</button><button class="btn p" onclick="salvaTipo()">Salvar</button></div>`;
  d.showModal();
}
function mtSel(k){MT.fmt=k;document.querySelectorAll('#dlg .opt').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#mtne').style.display=k==='sorteio'?'':'none'}
function salvaTipo(){
  const t=S.cur,k=MT.fmt;
  if(k===t.formato&&(k!=='sorteio'||parseInt($('#mtn').value,10)===t.nEquipes)){$('#dlg').close();return}
  let ne=0;
  if(k==='sorteio'){ne=parseInt($('#mtn').value,10);if(!(ne>=2))return toast('Informe ao menos 2 equipes');if(t.vagas&&t.vagas<ne)return toast('As vagas precisam ser pelo menos o número de equipes')}
  if(t.status!=='inscricao'&&!confirm('Mudar o tipo apaga resultados e equipes e reabre as inscrições. Continuar?'))return;
  $('#dlg').close();
  mut(x=>{
    x.formato=k;x.status='inscricao';x.m=[];x.champ=null;
    if(k==='sorteio'){x.nEquipes=ne;x.eq=[];x.md=1;if(x.seed==='ordem')x.seed='aleatorio'}
    else{delete x.nEquipes;delete x.eq;x.md=x.md||1}
  },()=>{S.tab='part'});
}
function modsTorneio(){
  if(!realAdmin()||!podeEditar(S.cur))return;
  const t=S.cur,at=new Set((t.mods||[]).map(String));
  const L=S.orgs.map(o=>`<label class="ds" style="cursor:pointer"><input type="checkbox" value="${esc(String(o.id))}" ${at.has(String(o.id))?'checked':''} style="width:18px;height:18px"><span style="flex:1;font-weight:700">${esc(o.nome||o.id)}</span></label>`).join('')||'<p class="msg">Nenhum moderador cadastrado. Adicione em ⚙ Gerenciar → Moderadores de torneios.</p>';
  const d=$('#dlg');
  d.innerHTML=`<h3>Moderadores deste torneio</h3><p class="msg" style="margin:0 0 12px">Quem criou o torneio já pode editar. Marque outros moderadores para dar acesso a este torneio.</p>${L}
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="$('#dlg').close()">Cancelar</button><button class="btn p" onclick="salvaModsT()">Salvar</button></div>`;
  d.showModal();
}
function salvaModsT(){const ids=[...document.querySelectorAll('#dlg input[type=checkbox]:checked')].map(x=>x.value);$('#dlg').close();mut(t=>{t.mods=ids})}
function togInsc(){mut(t=>{t.aberta=!t.aberta})}
async function abrir(id){
  const t=await loadFull(id);if(!t)return toast('Torneio não encontrado.');
  S.cur=t;S.tab='chave';S.q='';location.hash=id;render();scrollTo(0,0);
}
function voltar(){S.cur=null;S.criando=false;history.replaceState(null,'',location.pathname+location.search);render();scrollTo(0,0)}
function togPreview(){S.preview=!S.preview;S.criando=false;try{sessionStorage.setItem('kp_preview',S.preview?'1':'')}catch{}const b=document.getElementById('modsw');if(b){b.classList.toggle('off',S.preview);b.setAttribute('aria-checked',String(!S.preview));b.disabled=true}setTimeout(()=>{hubKey='';render();toast(S.preview?'Modo player ativado':'Modo MOD ativado')},b?180:0)}
function novo(){if(!canEdit())return;S.cur=null;history.replaceState(null,'',location.pathname+location.search);S.criando=!S.criando;render();scrollTo(0,0);if(S.criando)$('#nn')?.focus()}
function gerenciar(){
  if(!realAdmin()||S.preview)return;
  const d=$('#dlg');
  d.innerHTML=`<h3>Gerenciar torneios</h3><p class="msg" style="margin:0 0 14px">${S.online?'Torneios salvos no GitHub (data/torneios).':'API indisponível: salvando só neste navegador.'}</p>
  <div class="row" style="flex-direction:column;align-items:stretch"><button class="btn" onclick="exportar()">Exportar backup (JSON)</button>
  <label class="btn" style="text-align:center">Importar backup<input type="file" accept=".json,application/json" hidden onchange="importar(this.files[0])"></label>
  ${realAdmin()?'<button class="btn" onclick="organizadores()">Moderadores de torneios</button>':''}<button class="btn" onclick="recarregar()">Recarregar do servidor</button><button class="btn" onclick="$('#dlg').close()">Fechar</button></div>`;
  d.showModal();
}
async function exportar(){
  const L=S.online?(await Promise.all(S.list.map(x=>loadFull(x.id)))).filter(Boolean):S.list;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,2)],{type:'application/json'}));a.download='torneios.json';a.click();
}
async function importar(file){
  if(!file||!realAdmin())return;
  try{const L=JSON.parse(await file.text());if(!Array.isArray(L))throw 0;let n=0;
    for(const t of L){if(!t||!t.id||!Array.isArray(t.part))continue;const ex=S.list.some(x=>x.id===t.id);
      if(S.online)await persist(t,{novo:!ex});else{const i=S.list.findIndex(x=>x.id===t.id);i<0?S.list.push(t):S.list[i]=t;await persist(t)}n++}
    $('#dlg').close();render();toast(n+' torneio(s) importado(s)')}catch(e){toast(e&&e.message?e.message:'Arquivo inválido')}
}
async function recarregar(){
  await loadList();
  if(S.cur){const t=await loadFull(S.cur.id);if(t)setCur(t);else S.cur=null}
  $('#dlg').close();render();
}
addEventListener('scroll',()=>{const h=$('#pmh');if(!h)return;if(scrollY>90)h.classList.add('sm');else if(scrollY<15)h.classList.remove('sm')},{passive:true});
async function add(id){
  const c=S.chars.find(x=>x.id===id);if(!c)return;
  if(!podeEditar(S.cur))return playerOp('torneio_inscrever',id);
  let rk=0;
  try{const j=await fetch('/api/ficha-salvar?slug='+encodeURIComponent(id)).then(r=>r.ok?r.json():null);if(j?.d)rk=numPts(j.d.pts_ranking)}catch{}
  mut(t=>{if(t.status!=='inscricao'||t.part.some(p=>p.id===id))return false;t.part.push({...c,ranking:rk})});
}
async function playerOp(action,slug){
  const ses=sesF();
  if(!S.online)return toast('Servidor indisponível. Tente de novo mais tarde.');
  if(!ses?.token)return toast('Sua sessão expirou. Entre no site novamente.');
  try{const j=await apiPost({action,token:ses.token,slug,torneio:S.cur.id,por:S.me?.nome});setCur(j.torneio);toList(S.cur);toast(action==='torneio_inscrever'?'Inscrição realizada!':'Inscrição cancelada.')}catch(e){toast(e.message)}
  render();
}
function avulso(){const v=$('#mn').value.trim();if(!v)return;mut(t=>{t.part.push({id:'x'+Date.now().toString(36),nome:v,foto:'',cor:'',ranking:0,player:''})})}
function sairTorneio(id){
  if(!podeEditar(S.cur))return playerOp('torneio_sair',id);
  mut(t=>{if(t.status!=='inscricao')return false;t.part=t.part.filter(x=>x.id!==id)});
}
function buscar(){const ids=new Set(S.cur.part.map(p=>p.id)),q=S.q.toLowerCase();$('#avl').innerHTML=avList(S.chars.filter(c=>!ids.has(c.id)&&(c.nome+' '+c.player).toLowerCase().includes(q)))}
function t_seed(v){mut(t=>{t.seed=v})}
function sortear(t){
  const n=t.nEquipes,ps=[...t.part];
  for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ps[i],ps[j]]=[ps[j],ps[i]]}
  if(t.seed==='ranking')ps.sort((a,b)=>(b.ranking||0)-(a.ranking||0));   /* empate no ranking continua aleatório */
  t.eq=Array.from({length:n},(_,i)=>({id:'e'+(i+1),nome:'Equipe '+(i+1),membros:[]}));
  ps.forEach((p,i)=>{const r=Math.floor(i/n),k=i%n;t.eq[t.seed==='ranking'&&r%2?n-1-k:k].membros.push(p.id)});   /* ranking: distribuição em "cobrinha" p/ equilibrar */
  t.m=[];t.champ=null;t.status='fim';
}
function resortear(){if(!podeEditar(S.cur)||S.cur.formato!=='sorteio')return;if(!confirm('Sortear as equipes novamente? As equipes atuais serão substituídas.'))return;mut(t=>{sortear(t)})}
function moverMembro(pid,eid){mut(t=>{const dest=(t.eq||[]).find(e=>e.id===eid);if(!dest||dest.membros.includes(pid))return false;t.eq.forEach(e=>{e.membros=e.membros.filter(x=>x!==pid)});dest.membros.push(pid)})}
function iniciar(){mut(t=>{if(t.formato==='sorteio'){if(t.part.length<t.nEquipes){toast('Precisa de pelo menos '+t.nEquipes+' participantes (1 por equipe)');return false}sortear(t);return}if(t.part.length<2){toast('Precisa de pelo menos 2 participantes');return false}start(t)},()=>{S.tab='chave'})}
function reiniciar(){if(!podeEditar(S.cur))return;if(!confirm('Reabrir inscrições? Todos os resultados serão apagados.'))return;mut(t=>{Object.assign(t,{status:'inscricao',m:[],champ:null,...(t.formato==='sorteio'?{eq:[]}:{})})},()=>{S.tab='part'})}
async function excluir(){if(!realAdmin()||!podeEditar(S.cur))return;if(!confirm('Excluir este torneio?'))return;try{await remove(S.cur)}catch(e){return toast(e.message)}voltar()}
function placar(r,i){
  if(!podeEditar(S.cur))return;
  const t=S.cur,m=t.m[r][i],A=P(t,m.a),B=P(t,m.b),d=$('#dlg');
  d.innerHTML=`<h3>Lançar resultado</h3>
    <div class="ds">${av(A)}<div class="dn"><span>${esc(A.nome)}</span><div class="wl"><button type="button" data-s="a" data-k="v" onclick="setW('a')">Venceu</button><button type="button" data-s="a" data-k="p" onclick="setW('b')">Perdeu</button></div></div><input class="in" id="sa" type="number" min="0" value="${m.sa??''}" oninput="markW()"></div>
    <div class="ds">${av(B)}<div class="dn"><span>${esc(B.nome)}</span><div class="wl"><button type="button" data-s="b" data-k="v" onclick="setW('b')">Venceu</button><button type="button" data-s="b" data-k="p" onclick="setW('a')">Perdeu</button></div></div><input class="in" id="sb" type="number" min="0" value="${m.sb??''}" oninput="markW()"></div>
    <p class="msg" id="em">${t.formato==='single'?'Empates não são permitidos na chave.':''}</p>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn d" onclick="salvarM(${r},${i},true)">Limpar</button><button class="btn" onclick="$('#dlg').close()">Cancelar</button><button class="btn p" onclick="salvarM(${r},${i})">Salvar</button></div>`;
  d.showModal();markW();
}
function setW(w){
  const A=$('#sa'),B=$('#sb');let a=parseInt(A.value,10),b=parseInt(B.value,10);
  if(isNaN(a)||isNaN(b)){a=w==='a'?1:0;b=w==='a'?0:1}
  else if(w==='a'?a<=b:b<=a){[a,b]=[b,a];if(a===b){if(w==='a')a=b+1;else b=a+1}}
  A.value=a;B.value=b;markW()
}
function markW(){
  const a=parseInt($('#sa').value,10),b=parseInt($('#sb').value,10),ok=!isNaN(a)&&!isNaN(b)&&a!==b,w=ok?(a>b?'a':'b'):'';
  document.querySelectorAll('#dlg .wl button').forEach(x=>x.classList.toggle('on',ok&&((x.dataset.k==='v')===(x.dataset.s===w))))
}
function salvarM(r,i,clear){
  let a,b;
  if(!clear){
    a=parseInt($('#sa').value,10);b=parseInt($('#sb').value,10);
    if(isNaN(a)||isNaN(b)){$('#em').textContent='Preencha os dois placares.';return}
    if(S.cur.formato==='single'&&a===b){$('#em').textContent='A chave não aceita empate.';return}
  }
  $('#dlg').close();
  mut(t=>{const m=t.m[r][i];if(!m)return false;if(clear){m.sa=m.sb=null}else{m.sa=a;m.sb=b}if(t.formato==='single')sync(t);else finishRR(t)});
}
addEventListener('hashchange',async()=>{const id=location.hash.slice(1);if(id===(S.cur&&S.cur.id))return;S.cur=id?await loadFull(id):null;render()});
boot();
$('#dlg').addEventListener('close',()=>{$('#dlg').className=''});
</script>
</body>
</html>
